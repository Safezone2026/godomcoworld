<!DOCTYPE html>
<html>
<head>
<title>Checkout</title>
<link rel="stylesheet" href="../css/style.css">
<style>
input, select {
  width:100%;
  padding:10px;
  margin:5px 0;
  border-radius:8px;
  border:none;
}
</style>
</head>

<body>

<h2>🛒 Checkout</h2>

<!-- 👤 BUYER FORM -->
<h3>Buyer Details</h3>
<input type="text" id="name" placeholder="Full Name">
<input type="text" id="phone" placeholder="Phone Number">
<input type="text" id="address" placeholder="Delivery Address">

<!-- 🚚 SHIPPING -->
<h3>Shipping Method</h3>
<select id="shipping">
  <option value="1000">Standard Delivery - ₦1000</option>
  <option value="2000">Express Delivery - ₦2000</option>
</select>

<hr>

<!-- 🛒 CART -->
<div id="cartItems"></div>

<h3 id="subtotal"></h3>
<h3 id="shippingFee"></h3>
<h3 id="platformFee"></h3>
<h2 id="total"></h2>

<button onclick="checkout()">💳 Pay Now</button>

<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

let container = document.getElementById("cartItems");

let subtotal = 0;

// 🛒 LOAD CART
cart.forEach(item => {
  subtotal += Number(item.price);

  container.innerHTML += `
    <div>
      <h4>${item.name}</h4>
      <p>₦${item.price}</p>
    </div>
  `;
});

// 💰 FEES
function calculateTotal(){

  let shipping = Number(document.getElementById("shipping").value);

  let platformFee = subtotal * 0.05; // 5%

  let total = subtotal + shipping + platformFee;

  document.getElementById("subtotal").innerText = "Subtotal: ₦" + subtotal;
  document.getElementById("shippingFee").innerText = "Shipping: ₦" + shipping;
  document.getElementById("platformFee").innerText = "Platform Fee (5%): ₦" + platformFee.toFixed(2);
  document.getElementById("total").innerText = "Total: ₦" + total.toFixed(2);

  return { total, shipping, platformFee };
}

// Run initially
calculateTotal();

// Update when shipping changes
document.getElementById("shipping").addEventListener("change", calculateTotal);


// 💳 CHECKOUT
async function checkout(){

  let name = document.getElementById("name").value;
  let phone = document.getElementById("phone").value;
  let address = document.getElementById("address").value;

  if(!name || !phone || !address){
    alert("Please fill all details");
    return;
  }

  let { total, shipping, platformFee } = calculateTotal();

  try {

    const res = await fetch('http://127.0.0.1:3000/checkout', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        user: localStorage.getItem("piUser"),
        cart: cart,
        subtotal: subtotal,
        shipping: shipping,
        platformFee: platformFee,
        total: total,
        buyer: { name, phone, address }
      })
    });

    const data = await res.json();

    alert("Payment successful!");

    // 🧾 SAVE HISTORY
    let history = JSON.parse(localStorage.getItem("history")) || [];

    history.push({
      items: cart,
      total: total,
      buyer: { name, phone, address },
      date: new Date().toLocaleString()
    });

    localStorage.setItem("history", JSON.stringify(history));

    localStorage.removeItem("cart");

    window.location.href = "history.html";

  } catch(err){
    alert("Payment failed");
    console.error(err);
  }
}

</script>

</body>
</html>
