<!DOCTYPE html>
<html>
<head>
<title>Checkout</title>
<link rel="stylesheet" href="../css/style.css">
<style>
input, select {
  width:100%;
  padding:10px;
  margin:5px 0;
  border-radius:8px;
  border:none;
}
</style>
   <div>
  <p>🪙 Pi Balance: <span id="pi-balance">0</span> π</p>
  <p>💵 Fiat Balance: <span id="fiat-balance">0</span></p>
   </div>
</head>

<body>

<h2>🛒 Checkout</h2>

<!-- 👤 BUYER FORM -->
<h3>Buyer Details</h3>
<input type="text" id="buyerName" placeholder="Full Name">

<input type="text" id="phone" placeholder="Phone Number">

<input type="email" id="email" placeholder="Email Address">

<input type="text" id="houseAddress" placeholder="House / Street Address">

<input type="text" id="city" placeholder="City">

<input type="text" id="state" placeholder="State">

<input type="text" id="country" value="Nigeria">

<input type="hidden" id="lat">
<input type="hidden" id="lng">

<p id="shippingFee">
  🚚 Delivery fee will be calculated automatically based on your delivery location.
</p>

<hr>

<!-- 🛒 CART -->
<div id="cartItems"></div>

<h3 id="subtotal"></h3>
<h3 id="shippingFee"></h3>
<h3 id="platformFee"></h3>
<h2 id="total"></h2>
  <button onclick="calculateTotal()">🧮 Calculate Total</button>

<div id="paymentButtons" style="display:none; margin-top:15px;">
  <button onclick="payWithFiat()">💵 Pay with Fiat</button>
  <button onclick="payWithPi()">🪙 Pay with Pi</button>
</div>

<button onclick="checkout()">💳 Pay Now</button>

<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

let container = document.getElementById("cartItems");

let subtotal = 0;

// 🛒 LOAD CART
cart.forEach(item => {
  subtotal += Number(item.price);

  container.innerHTML += `
    <div>
      <h4>${item.name}</h4>
      <p>₦${item.price}</p>
    </div>
  `;
});

// 💱 GLOBAL VALUES
let totalNaira = 0;
let totalUSD = 0;
let totalPi = 0;

// ================= API AND TOTALS =================
const API = "https://godomcoworld-backend.onrender.com";

function calculateTotal() {
  const shippingInput = document.getElementById("shipping");
  const shipping = Number(shippingInput ? shippingInput.value : 0);
  const platformFee = subtotal * 0.05;

  totalNaira = subtotal + shipping + platformFee;

  const rates = JSON.parse(localStorage.getItem("countryRates") || "{}");
  const nairaRate = Number(rates.NG?.rate || 1500);
  const piRate = Number(localStorage.getItem("PI_RATE")) || 471238500;

  totalUSD = totalNaira / nairaRate;
  totalPi = totalNaira / piRate;
}

// ================= TRANSACTION PIN AUTHORIZATION =================
async function requestCheckoutAuthorization(walletId, network) {
  try {
    const statusRes = await fetch(
      API + "/wallet/security/status/" +
      encodeURIComponent(walletId) +
      "?network=" + encodeURIComponent(network)
    );

    const statusData = await statusRes.json();

    if (!statusRes.ok) {
      alert(statusData.message || "Could not check Transaction PIN status.");
      return null;
    }

    if (!statusData.pinSet) {
      alert("Set your Transaction PIN in Wallet Security before checkout.");
      return null;
    }

    if (statusData.locked) {
      alert("Your Transaction PIN is temporarily locked. Please try again later.");
      return null;
    }

    const pin = prompt("Enter your Transaction PIN to complete checkout:");

    if (pin === null) return null;

    if (!/^\d{4,6}$/.test(pin)) {
      alert("Your Transaction PIN must contain 4 to 6 digits.");
      return null;
    }

    const verifyRes = await fetch(API + "/wallet/security/verify-pin", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ walletId, network, pin })
    });

    const verifyData = await verifyRes.json();

    if (
      !verifyRes.ok ||
      !verifyData.success ||
      !verifyData.authorizationToken
    ) {
      alert(verifyData.message || "Transaction PIN verification failed.");
      return null;
    }

    return verifyData.authorizationToken;
  } catch (err) {
    console.error("Checkout PIN authorization failed:", err);
    alert("Could not verify your Transaction PIN. Please try again.");
    return null;
  }
}

// ================= PAYMENT =================
async function payWithBackend(type) {
  try {
    calculateTotal();

    const walletId = localStorage.getItem("walletId");
    const network = localStorage.getItem("walletNetwork") || "testnet";

    if (!walletId) {
      alert("Wallet not found. Please open your wallet and try again.");
      return;
    }

    if (!["testnet", "mainnet"].includes(network)) {
      alert("Invalid wallet network. Please select your wallet network again.");
      return;
    }

    const paymentCurrency = type === "Pi" ? "PI" : "NG";
    const amount = paymentCurrency === "PI" ? totalPi : totalNaira;

    if (!Number.isFinite(amount) || amount <= 0) {
      alert("The checkout total is invalid. Please check your cart and shipping.");
      return;
    }

    // Verify the PIN before attempting to deduct funds.
    const authorizationToken = await requestCheckoutAuthorization(walletId, network);
    if (!authorizationToken) return;

    // 1. Deduct payment from the selected network's wallet.
    const payRes = await fetch(API + "/wallet/pay", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        walletId,
        amount,
        currency: paymentCurrency,
        type: "product",
        network,
        authorizationToken
      })
    });

    const payData = await payRes.json();

    if (!payRes.ok || !payData.success) {
      alert(payData.message || "Wallet payment failed.");
      return;
    }

    // 2. Create the checkout order.
    const checkoutRes = await fetch(API + "/api/checkout", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        orderId: "ORD-" + Date.now(),
        paymentMethod: type,
        paymentCurrency,
        network,
        totalNaira,
        totalUSD,
        totalPi,
        cart,
        user: localStorage.getItem("piUser"),
        buyerName: document.getElementById("buyerName").value,
        phone: document.getElementById("phone").value,
        email: document.getElementById("email").value,
        address: document.getElementById("address").value,
        houseAddress: document.getElementById("houseAddress").value,
        city: document.getElementById("city").value,
        state: document.getElementById("state").value,
        country: document.getElementById("country").value,
        lat: Number(document.getElementById("lat").value || 0),
        lng: Number(document.getElementById("lng").value || 0),
        shippingMethod: document.getElementById("shipping").value
      })
    });

    const checkoutData = await checkoutRes.json();

    if (!checkoutRes.ok || !checkoutData.success) {
      alert(
        checkoutData.message ||
        "Payment was processed, but order creation failed. Contact support before retrying."
      );
      return;
    }

    alert("Payment and checkout successful.");
    localStorage.removeItem("cart");
    window.location.href = "history.html";
  } catch (err) {
    console.error("Checkout failed:", err);
    alert("Checkout failed. Check your connection and order status before retrying.");
  }
}

// ================= BUTTONS =================
function payWithPi() {
  payWithBackend("Pi");
}

function payWithFiat() {
  payWithBackend("Fiat");
}

// ================= LOAD BALANCES =================
async function loadBalances() {
  try {
    const walletId = localStorage.getItem("walletId");
    const network = localStorage.getItem("walletNetwork") || "testnet";

    if (!walletId) return;

    const res = await fetch(
      API + "/wallet/" + encodeURIComponent(walletId) +
      "?network=" + encodeURIComponent(network)
    );

    const data = await res.json();

    if (res.ok && data.success && data.wallet && data.wallet.balances) {
      document.getElementById("pi-balance").innerText =
        Number(data.wallet.balances.PI || 0).toLocaleString(undefined, {
          maximumFractionDigits: 8
        });

      document.getElementById("fiat-balance").innerText =
        Number(data.wallet.balances.NG || 0).toLocaleString();
    }
  } catch (err) {
    console.error("Could not load wallet balances:", err);
  }
}

window.onload = loadBalances;  

</script>

<script src="js/dev-console.js"></script>
<script src="js/receipt.js"></script>
</body>
</html>
