<!DOCTYPE html>
<html>
<head>
<title>Checkout</title>
<link rel="stylesheet" href="../css/style.css">
<style>
input, select {
  width:100%;
  padding:10px;
  margin:5px 0;
  border-radius:8px;
  border:none;
}
</style>
   <div>
  <p>🪙 Pi Balance: <span id="pi-balance">0</span> π</p>
  <p>💵 Fiat Balance: <span id="fiat-balance">0</span></p>
   </div>
</head>

<body>

<h2>🛒 Checkout</h2>

<!-- 👤 BUYER FORM -->
<h3>Buyer Details</h3>
<input type="text" id="buyerName" placeholder="Full Name">

<input type="text" id="phone" placeholder="Phone Number">

<input type="email" id="email" placeholder="Email Address">

<input type="text" id="houseAddress" placeholder="House / Street Address">

<input type="text" id="city" placeholder="City">

<input type="text" id="state" placeholder="State">

<input type="text" id="country" value="Nigeria">

<input type="hidden" id="lat">
<input type="hidden" id="lng">

<p id="shippingFee">
  🚚 Delivery fee will be calculated automatically based on your delivery location.
</p>

<hr>

<!-- 🛒 CART -->
<div id="cartItems"></div>

<h3 id="subtotal"></h3>
<h3 id="shippingFee"></h3>
<h3 id="platformFee"></h3>
<h2 id="total"></h2>
  <button onclick="calculateTotal()">🧮 Calculate Total</button>

<div id="paymentButtons" style="display:none; margin-top:15px;">
  <button onclick="payWithFiat()">💵 Pay with Fiat</button>
  <button onclick="payWithPi()">🪙 Pay with Pi</button>
</div>

<button onclick="checkout()">💳 Pay Now</button>

<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

let container = document.getElementById("cartItems");

let subtotal = 0;

// 🛒 LOAD CART
cart.forEach(item => {
  subtotal += Number(item.price);

  container.innerHTML += `
    <div>
      <h4>${item.name}</h4>
      <p>₦${item.price}</p>
    </div>
  `;
});

// 💱 GLOBAL VALUES
let totalNaira = 0;
let totalUSD = 0;
let totalPi = 0;

// 💰 CALCULATE
function calculateTotal(){

  let shipping = Number(document.getElementById("shipping").value);
  let platformFee = subtotal * 0.05;

  totalNaira = subtotal + shipping + platformFee;

  const rates = JSON.parse(localStorage.getItem("countryRates") || "{}");

const nairaRate = Number(rates.NG?.rate || 1500);

const piRate =
Number(localStorage.getItem("PI_RATE")) ||
471238500;

totalUSD = totalNaira / nairaRate;
totalPi = totalNaira / piRate;

  // ================= PAYMENT =================

async function payWithBackend(type){

  try{

    const paymentCurrency =
      type === "Pi" ? "PI" : "NG";

    const amount =
      paymentCurrency === "PI"
      ? totalPi
      : totalNaira;

    // ---------------- 1. Deduct wallet ----------------

    const payRes = await fetch(
      API + "/pay",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          walletId:localStorage.getItem("walletId"),
          amount,
          currency:paymentCurrency
        })
      }
    );

    const payData = await payRes.json();

    if(!payData.success){
      return alert(payData.message);
    }

    // ---------------- 2. Checkout ----------------

    const checkoutRes = await fetch(
      API + "/api/checkout",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({

          orderId:"ORD-" + Date.now(),

          paymentMethod:type,
          paymentCurrency,

          totalNaira,
          totalUSD,
          totalPi,

          cart,

          user:
            localStorage.getItem("piUser"),

          buyerName:
            document.getElementById("buyerName").value,

          phone:
            document.getElementById("phone").value,

          email:
            document.getElementById("email").value,

          address:
            document.getElementById("address").value,

          houseAddress:
            document.getElementById("houseAddress").value,

          city:
            document.getElementById("city").value,

          state:
            document.getElementById("state").value,

          country:
            document.getElementById("country").value,

          lat:Number(
            document.getElementById("lat").value || 0
          ),

          lng:Number(
            document.getElementById("lng").value || 0
          ),

          shippingMethod:
            document.getElementById("shipping").value

        })
      }
    );

    const checkoutData =
      await checkoutRes.json();

    if(!checkoutData.success){
      return alert(
        checkoutData.message ||
        "Checkout failed"
      );
    }

    alert("✅ Payment successful");

    localStorage.removeItem("cart");

    window.location.href =
      "history.html";

  }
  catch(err){

    console.error(err);

    alert("Checkout failed");

  }

}

// ================= BUTTONS =================

function payWithPi(){
  payWithBackend("Pi");
}

function payWithFiat(){
  payWithBackend("Fiat");
}

// ================= LOAD BALANCES =================

async function loadBalances(){

  try{

    const res = await fetch(
      API + "/wallet/" +
      localStorage.getItem("walletId")
    );

    const data = await res.json();

    if(data.success){

      document.getElementById("pi-balance").innerText =
      Number(data.wallet.balances.PI || 0)
      .toLocaleString(undefined,{
        maximumFractionDigits:8
      });

      document.getElementById("fiat-balance").innerText =
      Number(data.wallet.balances.NG || 0)
      .toLocaleString();

    }

  }catch(err){

    console.error(err);

  }

}

window.onload = loadBalances;  

</script>

<script src="js/dev-console.js"></script>
<script src="js/receipt.js"></script>
</body>
</html>
