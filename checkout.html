<!DOCTYPE html>
<html>
<head>
<title>Checkout</title>
<link rel="stylesheet" href="../css/style.css">
<style>
input, select {
  width:100%;
  padding:10px;
  margin:5px 0;
  border-radius:8px;
  border:none;
}
</style>
   <div>
  <p>🪙 Pi Balance: <span id="pi-balance">0</span> π</p>
  <p>💵 Fiat Balance: <span id="fiat-balance">0</span></p>
   </div>
</head>

<body>

<h2>🛒 Checkout</h2>

<!-- 👤 BUYER FORM -->
<h3>Buyer Details</h3>
<input type="text" id="name" placeholder="Full Name">
<input type="text" id="phone" placeholder="Phone Number">
<input type="text" id="address" placeholder="Delivery Address">

<!-- 🚚 SHIPPING -->
<h3>Shipping Method</h3>
<select id="shipping">
  <option value="1000">Standard Delivery - ₦1000</option>
  <option value="2000">Express Delivery - ₦2000</option>
</select>

<hr>

<!-- 🛒 CART -->
<div id="cartItems"></div>

<h3 id="subtotal"></h3>
<h3 id="shippingFee"></h3>
<h3 id="platformFee"></h3>
<h2 id="total"></h2>
  <button onclick="calculateTotal()">🧮 Calculate Total</button>

<div id="paymentButtons" style="display:none; margin-top:15px;">
  <button onclick="payWithFiat()">💵 Pay with Fiat</button>
  <button onclick="payWithPi()">🪙 Pay with Pi</button>
</div>

<button onclick="checkout()">💳 Pay Now</button>

<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

let container = document.getElementById("cartItems");

let subtotal = 0;

// 🛒 LOAD CART
cart.forEach(item => {
  subtotal += Number(item.price);

  container.innerHTML += `
    <div>
      <h4>${item.name}</h4>
      <p>₦${item.price}</p>
    </div>
  `;
});

// 💱 GLOBAL VALUES
let totalNaira = 0;
let totalUSD = 0;
let totalPi = 0;

// 💰 CALCULATE
function calculateTotal(){

  let shipping = Number(document.getElementById("shipping").value);
  let platformFee = subtotal * 0.05;

  totalNaira = subtotal + shipping + platformFee;

  // 🔥 CONVERSION (EDIT RATE IF NEEDED)
  let nairaToUSD = 1500;     // ₦1500 = $1
  let piRate = 314159;       // 1 Pi = $314,159

  totalUSD = totalNaira / nairaToUSD;
  totalPi = totalUSD / piRate;

  document.getElementById("subtotal").innerText = "Subtotal: ₦" + subtotal;
  document.getElementById("shippingFee").innerText = "Shipping: ₦" + shipping;
  document.getElementById("platformFee").innerText = "Platform Fee: ₦" + platformFee.toFixed(2);

  document.getElementById("total").innerHTML = `
    Total: ₦${totalNaira.toFixed(2)} <br>
    ≈ $${totalUSD.toFixed(2)} <br>
    ≈ ${totalPi.toFixed(8)} π
  `;

  // ✅ SHOW PAYMENT BUTTONS
  document.getElementById("paymentButtons").style.display = "block";
}

// 💳 PAY WITH FIAT
async function payWithFiat(){

  let fiat = Number(localStorage.getItem("fiat_balance")) || 0;

  if(fiat < totalNaira){
    alert("Insufficient Fiat balance");
    return;
  }

  fiat -= totalNaira;

  localStorage.setItem("fiat_balance", fiat);

  completeCheckout("Fiat");
}

// 🪙 PAY WITH PI
async function payWithPi(){

  let pi = Number(localStorage.getItem("pi_balance")) || 0;

  if(pi < totalPi){
    alert("Insufficient Pi balance");
    return;
  }

  pi -= totalPi;

  localStorage.setItem("pi_balance", pi);

  completeCheckout("Pi");
}

// ✅ FINALIZE
async function completeCheckout(method){

  try {

    await fetch('http://127.0.0.1:3000/checkout', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        method: method,
        totalNaira: totalNaira,
        totalUSD: totalUSD,
        totalPi: totalPi,
        cart: cart,
        user: localStorage.getItem("piUser")
      })
    });

    alert("Payment successful with " + method);

    // SAVE HISTORY
    let history = JSON.parse(localStorage.getItem("history")) || [];

    history.push({
      items: cart,
      total: totalNaira,
      method: method,
      date: new Date().toLocaleString()
    });

    localStorage.setItem("history", JSON.stringify(history));

    localStorage.removeItem("cart");

    window.location.href = "history.html";

  } catch(err){
    alert("Payment failed");
  }
  }

</script>

</body>
</html>
