<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Activity Log</title>

<link rel="stylesheet" href="../css/style.css">

<style>
body{
  background:#0d0d0d;
  color:white;
  font-family:Arial;
}

.container{
  padding:20px;
}

.log{
  background:#111;
  padding:15px;
  border-radius:10px;
  margin-top:10px;
  border-left:5px solid #00c853;
}
.type{
  font-weight:bold;
  color:#00c853;
}
.date{
  font-size:12px;
  color:gray;
}
</style>

</head>

<body>

<div class="container">

<h2>📊 Activity Log</h2>

<div id="log"></div>

</div>

<script>

async function loadActivities(){

  try {

    const res = await fetch('https://godomcoworld-backend.onrender.com/activity');
    const data = await res.json();

    const container = document.getElementById("log");

    if(!data.activities || data.activities.length === 0){
      container.innerHTML = "<p>No activity yet</p>";
      return;
    }

    container.innerHTML = "";

    data.activities.forEach(a => {

      container.innerHTML += `
        <div class="log">
          <div class="type">${a.type}</div>
          <div>${a.message}</div>
          <div class="date">${a.date}</div>
        </div>
      `;

    });

  } catch(err){
    console.error(err);
    document.getElementById("log").innerHTML = "⚠️ Failed to load activity";
  }

}

// AUTO LOAD
window.onload = loadActivities;

</script>

<script src="js/dev-console.js"></script>
</body>
</html>
