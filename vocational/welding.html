<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welding & Fitting Technology - Godomcoworld</title>
<link rel="stylesheet" href="../css/style.css">
</head>

<body>

<header>
<div class="logo">🌍 Godomcoworld</div>
<a href="index.html"><button>Back</button></a>
</header>

<div class="container">

<h2 id="courseTitleHeader"></h2>
<p id="courseDescription"></p>

<p id="lockedMsg" style="color:red;">🔒 Subscribe to unlock this course</p>
<p id="expiryMsg" style="color:orange;"></p>

<h3>Choose Plan</h3>
<div class="course-grid" id="plansContainer"></div>

<!-- COURSE CONTENT -->
<div id="courseContent" style="display:none; margin-top:30px;">

<h3>📚 Course Content</h3>
<ul id="courseList"></ul>

<hr>

<h3>🤖 AI Tutor (Voice Enabled)</h3>

<textarea id="aiQuestion" placeholder="Ask anything..." style="width:100%;height:80px;"></textarea>

<br><br>

<button onclick="startListening()">🎤 Speak</button>
<button onclick="askAI()">Ask AI</button>
<button onclick="speakAnswer()">🔊 Listen</button>

<p id="aiResponse" style="margin-top:15px;"></p>

<button id="certBtn" onclick="generateCertificate()" style="display:none; margin-top:15px;">
🎓 Get Certificate
</button>

</div>

</div>

<!-- CERTIFICATE -->
<div id="certificate" style="display:none; padding:30px; background:white; color:black; text-align:center; border:8px solid gold; margin-top:20px;">
<h1 style="color:darkblue;">🏆 Certificate of Completion</h1>
<p>This certifies that</p>
<h2 id="studentName"></h2>
<p>has successfully completed</p>
<h2 id="courseTitle"></h2>
<p>on Godomcoworld Technology Platform</p>
<p id="date"></p>
<p><strong>Certificate ID:</strong> <span id="certId"></span></p>
<div id="qrcode"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<script src="../js/payment.js"></script>
<script src="../js/wallet-init.js"></script>

<script>
  let username = localStorage.getItem("username");

if(!username){
  username = prompt("Enter your username (e.g seller1)");
  localStorage.setItem("username", username);
}

console.log("Current user:", username);

// ================= CONFIG =================
let courseName = "Welding & Fitting Technology";

let courseDescription = "Master welding and pipe fitting skills for construction, fabrication, and industrial engineering.";

let pricing = [
  { name: "Basic", price: 25 },
  { name: "Intermediate", price: 50 },
  { name: "Professional", price: 100 },
  { name: "Master", price: 200 }
];

let courseContentList = [
  "Introduction to Welding",
  "Welding Tools & Equipment",
  "Arc Welding Techniques",
  "Gas Welding & Cutting",
  "Welding Safety Standards",
  "Metal Fabrication Basics",
  "Introduction to Pipe Fitting",
  "Pipe Measurement & Layout",
  "Threading, Bending & Installation",
  "Industrial Fitting Techniques",
  "Blueprint Reading",
  "Hands-on Practical Projects"
];

// ================= INIT =================
Pi.init({
  version:"2.0",
  sandbox:false,
  apiKey:"YOUR_PI_API_KEY"
});

window.onload = function(){

  document.title = courseName + " - Godomcoworld";

  document.getElementById("courseTitleHeader").innerText = courseName;
  document.getElementById("courseDescription").innerText = courseDescription;

  renderPlans();
  renderContent();
  checkAccess();
};

// ================= RENDER =================
function renderPlans(){

  let container = document.getElementById("plansContainer");

  pricing.forEach(plan => {

    let pi = (plan.price / 314159).toFixed(8);

    container.innerHTML += `
      <div class="card">
        <h3>${plan.name}</h3>
        <p>$${plan.price}/month</p>
        <p>${pi} π</p>
        <button onclick="payCourse(${plan.price}, '${plan.name}')">Pay with Pi</button>
      </div>
    `;
  });
}

function renderContent(){

  let list = document.getElementById("courseList");

  courseContentList.forEach(item => {
    list.innerHTML += `<li>${item}</li>`;
  });
}

// ================= ACCESS =================
async function checkAccess(){

  let username = localStorage.getItem("piUser");
  if(!username) return;

  try {

    let res = await fetch(`http://127.0.0.1:3000/course-access?username=${username}&courseName=${courseName}`);
    let data = await res.json();

    if(data.access){
      unlock();
    } else if(data.expired){
      document.getElementById("expiryMsg").innerText = "⚠️ Subscription expired";
    }

  } catch(err){
    console.error(err);
  }
}

// ================= PAYMENT =================
async function payCourse(price, plan){

  let username = localStorage.getItem("piUser");

  if(!username){
    alert("Login required");
    return;
  }

  let piAmount = (price / 314159).toFixed(8);

  Pi.createPayment(
  {amount:parseFloat(piAmount), memo:courseName, metadata:{plan}},
  {

    onReadyForServerCompletion: async function(){
      // 🔥 SAVE TO BACKEND
      await fetch('http://127.0.0.1:3000/subscribe-course', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          username,
          courseName,
          plan,
          price
        })
      });

      alert("Payment successful!");
      unlock();
    },

    onCancel: () => alert("Payment cancelled"),
    onError: (err) => {
      console.log(err);
      alert("Payment error");
    }

  });
}

// ================= UNLOCK =================
function unlock(){
  document.getElementById("lockedMsg").style.display = "none";
  document.getElementById("courseContent").style.display = "block";
  document.getElementById("certBtn").style.display = "block";
}

// ================= CERTIFICATE =================
function generateCertificate(){

  let username = localStorage.getItem("piUser");

  if(!username){
    alert("Login required");
    return;
  }

  let name = prompt("Enter your name:");
  if(!name) return;

  let certId = "GODO-" + Date.now();

  document.getElementById("studentName").innerText = name;
  document.getElementById("courseTitle").innerText = courseName;
  document.getElementById("date").innerText = new Date().toDateString();
  document.getElementById("certId").innerText = certId;

  new QRCode(document.getElementById("qrcode"), {
    text: window.location.origin + "/verify.html?id=" + certId
  });

  document.getElementById("certificate").style.display = "block";

  window.print();
}

// ================= VOICE =================
function startListening(){

  let recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
  recognition.start();

  recognition.onresult = function(e){
    document.getElementById("aiQuestion").value = e.results[0][0].transcript;
  };
}

// ================= AI =================
function askAI(){

  let q = document.getElementById("aiQuestion").value.toLowerCase();

  if(!q) return alert("Ask a question");

  let res = "AI Tutor: ";

  if(q.includes("welding")){
    res += "Welding joins metals using heat, essential in construction and fabrication.";
  }
  else if(q.includes("fitting") || q.includes("pipe")){
    res += "Pipe fitting involves installing and maintaining piping systems used in industries.";
  }
  else{
    res += "Great question! Full AI tutor coming soon.";
  }

  document.getElementById("aiResponse").innerText = res;
}

// ================= SPEAK =================
function speakAnswer(){

  let text = document.getElementById("aiResponse").innerText;

  if(!text) return alert("No response");

  let speech = new SpeechSynthesisUtterance(text);
  window.speechSynthesis.speak(speech);
}

</script>

<script src="js/dev-console.js"></script>
</body>
</html>
