<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Electrical Installation Training</title>

<link rel="stylesheet" href="../css/style.css">

</head>

<body>

<header>

<div class="logo">🌍 Godomcoworld</div>

<a href="index.html">
<button>Back</button>
</a>

</header>

<div class="container">

<h2>Electrical Installation</h2>

<p>Learn wiring, safety, and installation techniques.</p>

<!-- LOCKED -->
<div id="lockedContent">
  <p style="color:red;">🔒 Subscribe to unlock this course</p>
  <p id="expiryMsg" style="color:orange;"></p>
</div>

<!-- PRICING -->
<h3>Choose Plan</h3>

<div class="course-grid">

<div class="card">
  <h3>Basic</h3>
  <p>$10/month</p>
  <p id="basicPi"></p>
  <button onclick="pay('basic',10)">Subscribe</button>
</div>

<div class="card">
  <h3>Intermediate</h3>
  <p>$20/month</p>
  <p id="interPi"></p>
  <button onclick="pay('intermediate',20)">Subscribe</button>
</div>

<div class="card">
  <h3>Professional</h3>
  <p>$30/month</p>
  <p id="proPi"></p>
  <button onclick="pay('pro',30)">Subscribe</button>
</div>

</div>

<!-- UNLOCKED CONTENT -->
<div id="courseContent" style="display:none;">
  <h3>Course Content</h3>
  <ul>
    <li>Lesson 1</li>
    <li>Lesson 2</li>
    <li>Practical Training</li>
  </ul>
</div>

</div>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>

<script>
Pi.init({
  version: "2.0",
  sandbox: true,
  apiKey: "qc4ufrjtkej5vt51xmoljidnzyrjfdghxr3mzd8s0h14qf7qybebv6kehyqudl7h"
});

// PI PRICES
document.getElementById("basicPi").innerText = (10/314159).toFixed(8) + " π";
document.getElementById("interPi").innerText = (20/314159).toFixed(8) + " π";
document.getElementById("proPi").innerText = (30/314159).toFixed(8) + " π";

// CHECK ACCESS
let courseName = "Electrical Installation";
let data = localStorage.getItem("plan_" + courseName);

if(data){
  let parsed = JSON.parse(data);
  let now = new Date().getTime();

  if(now < parsed.expiry){
    unlock();

    let daysLeft = Math.ceil((parsed.expiry - now) / (1000*60*60*24));
    document.getElementById("expiryMsg").innerText =
      "⏳ Access expires in " + daysLeft + " days";

  } else {
    localStorage.removeItem("plan_" + courseName);
    document.getElementById("expiryMsg").innerText =
      "⚠️ Subscription expired. Please renew.";
  }
      }

// PAYMENT
async function pay(plan, usd){

  let piAmount = (usd / 314159).toFixed(8);

  try{
    const payment = await Pi.requestPay({
      amount: parseFloat(piAmount),
      memo: courseName,
      metadata:{plan}
    });

    if(payment && payment.txid){

      let expiryDate = new Date().getTime() + (30 * 24 * 60 * 60 * 1000);

let subscriptionData = {
  plan: plan,
  expiry: expiryDate
};

localStorage.setItem("plan_" + courseName, JSON.stringify(subscriptionData));

      alert("Course unlocked!");

      unlock();
    }

  }catch(err){
    alert("Payment failed");
  }
}

// UNLOCK
function unlock(){
  document.getElementById("lockedContent").style.display = "none";
  document.getElementById("courseContent").style.display = "block";
}
</script>

</body>
  </html>
