  <script>
function updateButton(courseName, buttonId){

  let plan = localStorage.getItem("plan_" + courseName);
  let btn = document.getElementById(buttonId).querySelector("button");

  if(plan){
    btn.innerText = "Continue Course 🔓";
    btn.style.background = "green";
  }else{
    btn.innerText = "Unlock Course 🔒";
    btn.style.background = "#00bfff";
  }
}

// RUN FOR ALL COURSES
updateButton("Electrical Installation", "btn-electrical");
updateButton("Solar Installation", "btn-solar");
updateButton("Welding Technology", "btn-welding");
updateButton("Automobile Mechanics", "btn-mechanics");
updateButton("Fashion & Textile Design", "btn-fashion");
updateButton("Furniture & Carpentry", "btn-carpentry");
updateButton("Smartphone Repair", "btn-phone");
updateButton("Agricultural Processing", "btn-agro");
  </script>
