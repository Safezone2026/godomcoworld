<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Course</title>
<link rel="stylesheet" href="../css/style.css">
</head>

<body>

<header>
  <div class="logo">Course Details</div>
  <a href="index.html"><button>Back</button></a>
</header>

<div class="container">

<h2 id="courseTitle"></h2>
<p>This course will equip you with practical skills.</p>

<!-- 🔒 LOCKED CONTENT -->
<div id="lockedContent">
  <p style="color:red;">🔒 Subscribe to access full course</p>
</div>

<!-- 💰 PRICING -->
<h3>Choose Plan</h3>

<div class="course-grid">

<div class="card">
  <h3>Basic</h3>
  <p>$10/month</p>
  <p id="basicPi"></p>
  <button onclick="pay('basic',10)">Subscribe</button>
</div>

<div class="card">
  <h3>Intermediate</h3>
  <p>$20/month</p>
  <p id="interPi"></p>
  <button onclick="pay('intermediate',20)">Subscribe</button>
</div>

<div class="card">
  <h3>Professional</h3>
  <p>$30/month</p>
  <p id="proPi"></p>
  <button onclick="pay('pro',30)">Subscribe</button>
</div>

</div>

<!-- ✅ UNLOCKED CONTENT -->
<div id="courseContent" style="display:none;">
  <h3>Course Content</h3>
  <ul>
    <li>Lesson 1</li>
    <li>Lesson 2</li>
    <li>Practical Training</li>
  </ul>
</div>

</div>

<script src="https://sdk.minepi.com/pi-sdk.js"></script>

<script>
// INIT PI
Pi.init({
  version: "2.0",
  sandbox: true,
  apiKey: "qc4ufrjtkej5vt51xmoljidnzyrjfdghxr3mzd8s0h14qf7qybebv6kehyqudl7h"
});

// GET COURSE NAME FROM URL
let params = new URLSearchParams(window.location.search);
let courseName = params.get("course");

document.getElementById("courseTitle").innerText = courseName;

// SHOW PI VALUES
document.getElementById("basicPi").innerText = (10/314159).toFixed(8) + " π";
document.getElementById("interPi").innerText = (20/314159).toFixed(8) + " π";
document.getElementById("proPi").innerText = (30/314159).toFixed(8) + " π";

// CHECK ACCESS
let userPlan = localStorage.getItem("plan_" + courseName);

if(userPlan){
  unlockCourse();
}

// PAYMENT
async function pay(plan, usd){

  let piAmount = (usd / 314159).toFixed(8);

  try{
    const payment = await Pi.requestPay({
      amount: parseFloat(piAmount),
      memo: courseName + " course",
      metadata:{plan}
    });

    if(payment && payment.txid){

      // SAVE ACCESS PER COURSE
      localStorage.setItem("plan_" + courseName, plan);

      alert("Access granted!");

      unlockCourse();
    }

  }catch(err){
    alert("Payment failed");
  }
}

// UNLOCK FUNCTION
function unlockCourse(){
  document.getElementById("lockedContent").style.display = "none";
  document.getElementById("courseContent").style.display = "block";
}
</script>

</body>
  </html>
