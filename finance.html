<script>
  let username = localStorage.getItem("username");

if(!username){
  username = prompt("Enter your username (e.g seller1)");
  localStorage.setItem("username", username);
}

console.log("Current user:", username);
let currentService = "";

// ================= COUNTRY RATES =================
const countryRates = {
  NG:{symbol:"₦",rate:1500}, GH:{symbol:"₵",rate:12},
  KE:{symbol:"KSh",rate:160}, ZA:{symbol:"R",rate:18},
  EG:{symbol:"E£",rate:50}, CM:{symbol:"FCFA",rate:600},
  UG:{symbol:"USh",rate:3800}, TZ:{symbol:"TSh",rate:2500},
  ET:{symbol:"Br",rate:56}, RW:{symbol:"FRw",rate:1300},
  SN:{symbol:"FCFA",rate:600}, CI:{symbol:"FCFA",rate:600},
  DZ:{symbol:"DZD",rate:135}, MA:{symbol:"MAD",rate:10},
  AO:{symbol:"Kz",rate:830}, ZM:{symbol:"ZK",rate:25},
  ZW:{symbol:"ZWL",rate:6000}, MW:{symbol:"MK",rate:1700},
  BW:{symbol:"P",rate:13}, NA:{symbol:"N$",rate:18},
  SL:{symbol:"Le",rate:23000}, LR:{symbol:"L$",rate:190},
  TG:{symbol:"FCFA",rate:600}, BJ:{symbol:"FCFA",rate:600},
  NE:{symbol:"FCFA",rate:600}, ML:{symbol:"FCFA",rate:600},
  BF:{symbol:"FCFA",rate:600}, GA:{symbol:"FCFA",rate:600},
  CG:{symbol:"FCFA",rate:600}, CD:{symbol:"CDF",rate:2800}
};

// ================= LOAD SERVICES =================
function loadServices(){
  let country = document.getElementById("country").value;
  document.getElementById("servicesSection").style.display =
    country ? "block" : "none";
}

// ================= OPEN SERVICE =================
function openService(type){
  currentService = type;
  let country = document.getElementById("country").value;
  if(!country){
    alert("Select country first");
    return;
  }

  let html = "";

  switch(type){
    case "airtime":
      html=`
        <h3>📱 Airtime Recharge</h3>
        <label>Phone Number</label><br>
        <input type="tel" id="phone" placeholder="Enter phone number"><br><br>

        <label>Amount</label><br>
        <input type="number" id="amount" placeholder="Enter amount"><br><br>

        <div id="result"></div><br>

        <button onclick="calculate('amount')">Calculate</button>

        <div id="payButtons" style="display:none;">
          <button class="pay-btn" onclick="payWithPi()">🪙 Pay Pi</button>
          <button class="pay-btn" onclick="payWithFiat()">💵 Pay Fiat</button>
        </div>
      `;
      break;

    case "data":
      html=`
        <h3>🌐 Data Subscription</h3>
        <label>Phone Number</label><br>
        <input type="tel" id="phone" placeholder="Enter phone number"><br><br>

        <label>Select Plan</label><br>
        <select id="plan">
          <option value="500">1GB - 500</option>
          <option value="1000">2GB - 1000</option>
          <option value="2000">5GB - 2000</option>
        </select><br><br>

        <div id="result"></div><br>

        <button onclick="calculate('plan')">Calculate</button>

        <div id="payButtons" style="display:none;">
          <button class="pay-btn" onclick="payWithPi()">🪙 Pay Pi</button>
          <button class="pay-btn" onclick="payWithFiat()">💵 Pay Fiat</button>
        </div>
      `;
      break;

    case "tv":
      html=`
        <h3>📺 TV Subscription</h3>
        <label>Provider</label><br>
        <select id="tvProvider">
          <option>DSTV</option>
          <option>GOTV</option>
          <option>Startimes</option>
        </select><br><br>

        <label>Smart Card Number</label><br>
        <input type="text" id="smartcard" placeholder="Enter smart card number"><br><br>

        <label>Amount</label><br>
        <input type="number" id="amount" placeholder="Enter amount"><br><br>

        <div id="result"></div><br>

        <button onclick="calculate('amount')">Calculate</button>

        <div id="payButtons" style="display:none;">
          <button class="pay-btn" onclick="payWithPi()">🪙 Pay Pi</button>
          <button class="pay-btn" onclick="payWithFiat()">💵 Pay Fiat</button>
        </div>
      `;
      break;

    case "electricity":
      html=`
        <h3>💡 Electricity Bill</h3>
        <label>Meter Number</label><br>
        <input type="text" id="meter" placeholder="Enter meter number"><br><br>

        <label>Amount</label><br>
        <input type="number" id="amount" placeholder="Enter amount"><br><br>

        <div id="result"></div><br>

        <button onclick="calculate('amount')">Calculate</button>

        <div id="payButtons" style="display:none;">
          <button class="pay-btn" onclick="payWithPi()">🪙 Pay Pi</button>
          <button class="pay-btn" onclick="payWithFiat()">💵 Pay Fiat</button>
        </div>
      `;
      break;
  }

  document.getElementById("serviceContainer").innerHTML = html;
}

// ================= CALCULATE =================
function calculate(fieldId){
  let country = document.getElementById("country").value;
  let amountInput = document.getElementById(fieldId);

  if(!amountInput) return alert("Amount field not found");

  let amount = parseFloat(amountInput.value);
  if(!amount) return alert("Enter amount");

  let {symbol,rate} = countryRates[country];

  let usd = amount / rate;
  let pi = usd / 314159;

  localStorage.setItem("last_amount_local", amount);
  localStorage.setItem("last_amount_pi", pi);

  document.getElementById("result").innerHTML =
    `💰 ${symbol}${amount}<br>💱 $${usd.toFixed(2)}<br>🪙 ${pi.toFixed(8)} π`;

  // Show pay buttons
  let btn = document.getElementById("payButtons");
  if(btn) btn.style.display = "block";
}

// ================= PAYMENT =================
async function payWithBackend(method){

  const walletId = localStorage.getItem("walletId");

  if(!walletId){
    return alert("Wallet not found. Open wallet page first.");
  }

  let phone = document.getElementById("phone")?.value;
  let meter = document.getElementById("meter")?.value;
  let card = document.getElementById("smartcard")?.value;

  if(!phone && !meter && !card){
    return alert("Please fill required details");
  }

  // ✅ GET AMOUNT
  let key = method === "Pi" ? "last_amount_pi" : "last_amount_local";
  let amount = parseFloat(localStorage.getItem(key));

  if(!amount){
    return alert("Click calculate first");
  }

  // ✅ DETERMINE CURRENCY
  let currency = method === "Pi" ? "PI" : "NG";

  try{

    const res = await fetch("http://127.0.0.1:3000/wallet/pay", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        walletId,
        amount,
        currency,
        type: currentService // 🔥 dynamic later
      })
    });

    const data = await res.json();

    if(data.success){
      alert("✅ Payment successful");

      // 🔥 REFRESH WALLET
      if(typeof loadBalance === "function"){
        loadBalance();
      }

    } else {
      alert("❌ " + data.message);
    }

  }catch(err){
    console.error(err);
    alert("Server error");
  }
}

async function payWithPi(){
  const allowed = await checkPaymentAccess("Pi");
  if(!allowed) return;

  payWithBackend("Pi");
}

async function payWithFiat(){
  const allowed = await checkPaymentAccess("Fiat");
  if(!allowed) return;

  payWithBackend("Fiat");
}

// Hide pay buttons when user edits inputs
document.addEventListener("input", (e) => {
  let container = document.getElementById("serviceContainer");
  if(!container) return;
  let btn = container.querySelector("#payButtons");
  if(btn) btn.style.display = "none";
});
</script>
