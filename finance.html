<body>

<header>
<h1>💰 Financial Services</h1>
</header>

<main>

<h2>Select Your Country</h2>
  

<select id="country" onchange="selectCountry()">
  <option value="">-- Select Country --</option>
  <option value="nigeria">🇳🇬 Nigeria</option>
  <option value="ghana">🇬🇭 Ghana</option>
  <option value="kenya">🇰🇪 Kenya</option>
</select>
  <!-- SERVICES (HIDDEN FIRST) -->
<div id="services" style="display:none; margin-top:20px;">

<h3>Select Service</h3>

<div class="service-grid">

<button onclick="showService('airtime')">📱 Airtime Recharge</button>

<button onclick="showService('data')">🌐 Data Top-Up</button>

<button onclick="showService('tv')">📺 TV Subscription</button>

<button onclick="showService('electricity')">💡 Electricity Bill</button>

</div>
  <!-- SERVICE FORM -->
<div id="serviceForm" style="margin-top:20px;"></div>
  <div id="result" style="margin-top:20px;"></div>

<button onclick="payNow()" style="margin-top:10px;">Pay with Pi</button>

</div>

<br><br>

<h3>Network Provider</h3>

<select id="network"></select>

<br><br>

<h3>Enter Amount</h3>

<input type="number" id="amount" placeholder="Enter amount">

<br><br>

<button onclick="calculate()">Calculate</button>

<h3 id="result"></h3>

<button onclick="pay()">Pay with Pi</button>

</main>

<script>

// COUNTRY NETWORK DATA
const data = {
  nigeria: {
    currency: "₦",
    rate: 314159,
    networks: ["MTN", "Airtel", "Glo", "9mobile"]
  },
  ghana: {
    currency: "₵",
    rate: 314159,
    networks: ["MTN", "Vodafone", "AirtelTigo"]
  },
  kenya: {
    currency: "KSh",
    rate: 314159,
    networks: ["Safaricom", "Airtel"]
  }
};

// LOAD NETWORKS
function loadProviders(){

let country = document.getElementById("country").value;
let networkSelect = document.getElementById("network");

networkSelect.innerHTML = "";

if(country && data[country]){

  data[country].networks.forEach(net => {
    let option = document.createElement("option");
    option.text = net;
    networkSelect.add(option);
  });

}

}

// CALCULATE PRICE
function calculate(){

let country = document.getElementById("country").value;
let amount = document.getElementById("amount").value;

if(!country || amount == ""){
  alert("Fill all fields");
  return;
}

let rate = data[country].rate;
let currency = data[country].currency;

let pi = (amount / rate).toFixed(8);

document.getElementById("result").innerText =
`You are buying ${currency}${amount} airtime = ${pi} π`;

}

// PAYMENT (READY FOR PI)
function pay(){

let result = document.getElementById("result").innerText;

if(result === ""){
  alert("Calculate first");
  return;
}

alert("Payment system coming next (Pi integration)");

}
  function selectCountry(){
  let country = document.getElementById("country").value;

  if(country !== ""){
    document.getElementById("services").style.display = "block";
  }
  }
  function showService(type){

let html = "";

if(type === "airtime"){
html = `
<h3>Airtime Recharge</h3>

<select id="network">
<option>MTN</option>
<option>Glo</option>
<option>Airtel</option>
<option>9mobile</option>
</select><br><br>

<input type="number" id="amount" placeholder="Enter Amount"><br><br>

<button onclick="calculate('airtime')">Calculate</button>
`;
}

if(type === "data"){
html = `
<h3>Data Top-Up</h3>

<select id="network">
<option>MTN</option>
<option>Airtel</option>
</select><br><br>

<input type="number" id="amount" placeholder="Enter Amount"><br><br>

<button onclick="calculate('data')">Calculate</button>
`;
}

if(type === "tv"){
html = `
<h3>TV Subscription</h3>

<select id="provider">
<option>DSTV</option>
<option>GOTV</option>
<option>Startimes</option>
</select><br><br>

<input type="text" placeholder="Smart Card Number"><br><br>

<input type="number" id="amount" placeholder="Enter Amount"><br><br>

<button onclick="calculate('tv')">Calculate</button>
`;
}

if(type === "electricity"){
html = `
<h3>Electricity Bill</h3>

<input type="text" placeholder="Meter Number"><br><br>

<input type="number" id="amount" placeholder="Enter Amount"><br><br>

<button onclick="calculate('electricity')">Calculate</button>
`;
}

document.getElementById("serviceForm").innerHTML = html;
  }
  function calculate(service){

let amount = document.getElementById("amount").value;

// Example rates
let nairaToUSD = 1500;
let piRate = 314159;

let usd = amount / nairaToUSD;
let pi = usd / piRate;

document.getElementById("result").innerHTML =
`You are paying ₦${amount} = ${pi.toFixed(8)} π`;
}
  function payNow(){
  alert("Payment integration coming next (Pi SDK)");
}

</script>
