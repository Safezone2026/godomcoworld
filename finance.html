UG: ["MTN", "Airtel"],

ET: ["Ethio Telecom"],
RW: ["MTN", "Airtel"],

SN: ["Orange", "Free", "Expresso"],
CI: ["MTN", "Orange", "Moov"],
DZ: ["Djezzy", "Mobilis", "Ooredoo"],
MA: ["Maroc Telecom", "Orange", "Inwi"],
AO: ["Unitel", "Movicel"],

ZM: ["MTN", "Airtel", "Zamtel"],
ZW: ["Econet", "NetOne", "Telecel"],
MW: ["TNM", "Airtel"],
BW: ["Mascom", "Orange", "BTC"],
NA: ["MTC", "TN Mobile"],

SL: ["Africell", "Orange"],
LR: ["Lonestar", "Orange"],
TG: ["Togocom", "Moov"],
BJ: ["MTN", "Moov"],

CG: ["MTN", "Airtel"],

// LOAD SERVICES
function loadServices(){
let country = document.getElementById("country").value;
document.getElementById("servicesSection").style.display =
country ? "block" : "none";
}

// OPEN SERVICES 
function openService(type){

let country = document.getElementById("country").value;

let nets = providers[country] || ["MTN", "Airtel"];
let networkOptions = nets.map(n => `<option>${n}</option>`).join("");

let html = "";

// 📱 AIRTIME
if(type === "airtime"){
html = `
<h3>📱 Airtime Recharge</h3>

<label>Network</label><br>
<select id="network">${networkOptions}</select><br><br>

<label>Phone Number</label><br>
<input type="tel" id="phone" placeholder="Enter phone number"><br><br>

<label>Amount</label><br>
<input type="number" id="amount" placeholder="Enter amount"><br><br>

<div id="result"></div><br>

<button onclick="calculate()">Calculate</button>
<button class="pay-btn" onclick="payWithPi()">🪙 Pay with Pi</button>
<button class="pay-btn" onclick="payWithFiat()">💵 Pay with Fiat</button>
`;
}

// 🌐 DATA
else if(type === "data"){
html = `
<h3>🌐 Data Top-Up</h3>

<label>Network</label><br>
<select id="network">${networkOptions}</select><br><br>

<label>Phone Number</label><br>
<input type="tel" id="phone" placeholder="Enter phone number"><br><br>

<label>Select Plan</label><br>
<select id="plan">
<option value="500">1GB - 500</option>
<option value="1000">2GB - 1000</option>
<option value="2000">5GB - 2000</option>
</select><br><br>

<div id="result"></div><br>

<button onclick="calculateData()">Calculate</button>
<button class="pay-btn" onclick="payWithPi()">🪙 Pay with Pi</button>
<button class="pay-btn" onclick="payWithFiat()">💵 Pay with Fiat</button>
`;
}

// 📺 TV
else if(type === "tv"){
html = `
<h3>📺 TV Subscription</h3>

<select>
<option>DSTV</option>
<option>GOTV</option>
<option>Startimes</option>
</select><br><br>

<label>Smart Card Number</label><br>
<input type="text" placeholder="Enter smart card number"><br><br>

<label>Amount</label><br>
<input type="number" id="amount" placeholder="Enter amount"><br><br>

<div id="result"></div><br>

<button onclick="calculate()">Calculate</button>
<button class="pay-btn" onclick="payWithPi()">🪙 Pay with Pi</button>
<button class="pay-btn" onclick="payWithFiat()">💵 Pay with Fiat</button>
`;
}

// 💡 ELECTRICITY
else if(type === "electricity"){
html = `
<h3>💡 Electricity Bill</h3>

<label>Meter Number</label><br>
<input type="text" placeholder="Enter meter number"><br><br>

<label>Amount</label><br>
<input type="number" id="amount" placeholder="Enter amount"><br><br>

<div id="result"></div><br>

<button onclick="calculate()">Calculate</button>
<button class="pay-btn" onclick="payWithPi()">🪙 Pay with Pi</button>
<button class="pay-btn" onclick="payWithFiat()">💵 Pay with Fiat</button>
`;
}

document.getElementById("serviceContainer").innerHTML = html;

  }  
  function calculateData(){

let amount = document.getElementById("plan").value;
document.getElementById("amount")?.remove(); // optional cleanup

let country = document.getElementById("country").value;
let selected = countryRates[country];

let usd = amount / selected.rate;
let pi = usd / 314159;

// SAVE
localStorage.setItem("last_amount_local", amount);
localStorage.setItem("last_amount_pi", pi);

// DISPLAY
document.getElementById("result").innerHTML =
`💰 ${selected.symbol}${amount}<br>
💵 $${usd.toFixed(2)}<br>
🪙 ${pi.toFixed(8)} π`;

  }

// CALCULATE
function calculate(){

let amount = document.getElementById("amount").value;
let country = document.getElementById("country").value;

if(!amount){
alert("Enter amount");
return;
}

let selected = countryRates[country];

if(!selected){
alert("Country not supported");
return;
}

let symbol = selected.symbol;
let rate = selected.rate;

// CONVERSIONS
let usd = amount / rate;
let pi = usd / 314159;

// SAVE FOR PAYMENT
localStorage.setItem("last_amount_local", amount);
localStorage.setItem("last_amount_pi", pi);

// DISPLAY
document.getElementById("result").innerHTML =
`💰 ${symbol}${amount}<br>
💵 $${usd.toFixed(2)}<br>
🪙 ${pi.toFixed(8)} π`
  }
  // 🔥 BACKEND PAYMENT (USED BY BOTH PI & FIAT)

async function payWithBackend(type) {
    const userId = 1;

    let amount;

    if(type === "Pi"){
        amount = parseFloat(localStorage.getItem("last_amount_pi"));
    } else {
        amount = parseFloat(localStorage.getItem("last_amount_local"));
    }

    if(!amount){
        alert("Please calculate amount first!");
        return;
    }

    try {
        const response = await fetch('http://127.0.0.1:3000/pay', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId, amount, type })
        });

        const data = await response.json();

        if (data.success) {
            alert(`${type} payment successful! New balance: ${data.newBalance}`);
        } else {
            alert(`Payment failed: ${data.message}`);
        }

    } catch (err) {
        console.error(err);
        alert('Error connecting to backend!');
    }
}

// Buttons
function payWithPi() { payWithBackend("Pi"); }
function payWithFiat() { payWithBackend("Fiat"); }
