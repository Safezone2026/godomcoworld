<head>

<body>

<header>
<h1>💰 Financial Services</h1>
</header>

<main>

<h2>Select Your Country</h2>

<select id="country" onchange="loadServices()">
<option value="">🌍 Select Country</option>

<option value="NG">🇳🇬 Nigeria</option>

<option value="EG">🇪🇬 Egypt</option>
<option value="CM">🇨🇲 Cameroon</option>
<option value="UG">🇺🇬 Uganda</option>
<option value="TZ">🇹🇿 Tanzania</option>
<option value="ET">🇪🇹 Ethiopia</option>
<option value="RW">🇷🇼 Rwanda</option>
<option value="SN">🇸🇳 Senegal</option>
<option value="CI">🇨🇮 Ivory Coast</option>
<option value="DZ">🇩🇿 Algeria</option>
<option value="MA">🇲🇦 Morocco</option>
<option value="AO">🇦🇴 Angola</option>
<option value="ZM">🇿🇲 Zambia</option>
<option value="ZW">🇿🇼 Zimbabwe</option>
<option value="MW">🇲🇼 Malawi</option>
<option value="BW">🇧🇼 Botswana</option>
<option value="NA">🇳🇦 Namibia</option>
<option value="SL">🇸🇱 Sierra Leone</option>
<option value="LR">🇱🇷 Liberia</option>
<option value="TG">🇹🇬 Togo</option>
<option value="BJ">🇧🇯 Benin</option>
<option value="NE">🇳🇪 Niger</option>
<option value="ML">🇲🇱 Mali</option>
<option value="BF">🇧🇫 Burkina Faso</option>
<option value="GA">🇬🇦 Gabon</option>
<option value="CG">🇨🇬 Congo</option>
<option value="CD">🇨🇩 DR Congo</option>
</select>

<!-- SERVICES -->
<div id="servicesSection" style="display:none; margin-top:20px;">

<h3>Select Service</h3>

<div class="service-grid">
<button onclick="openService('airtime')">📱 Airtime</button>
<button onclick="openService('data')">🌐 Data</button>
<button onclick="openService('tv')">📺 TV</button>
<button onclick="openService('electricity')">💡 Electricity</button>
</div>

<div id="serviceContainer" style="margin-top:20px;"></div>

</div>

</main>

<script>

// 🌍 COUNTRY RATES
const countryRates = {
  NG: { symbol: "₦", rate: 1500 },
  GH: { symbol: "₵", rate: 12 },
  KE: { symbol: "KSh", rate: 160 },
  ZA: { symbol: "R", rate: 18 },
  EG: { symbol: "E£", rate: 50 },
  CM: { symbol: "FCFA", rate: 600 },
  UG: { symbol: "USh", rate: 3800 },
  TZ: { symbol: "TSh", rate: 2500 },
  ET: { symbol: "Br", rate: 56 },
  RW: { symbol: "FRw", rate: 1300 },
  SN: { symbol: "FCFA", rate: 600 },
  CI: { symbol: "FCFA", rate: 600 },
  DZ: { symbol: "DZD", rate: 135 },
  MA: { symbol: "MAD", rate: 10 },
  AO: { symbol: "Kz", rate: 830 },
  ZM: { symbol: "ZK", rate: 25 },
  ZW: { symbol: "ZWL", rate: 6000 },
  MW: { symbol: "MK", rate: 1700 },
  BW: { symbol: "P", rate: 13 },
  NA: { symbol: "N$", rate: 18 },
  SL: { symbol: "Le", rate: 23000 },
  LR: { symbol: "L$", rate: 190 },
  TG: { symbol: "FCFA", rate: 600 },
  BJ: { symbol: "FCFA", rate: 600 },
  NE: { symbol: "FCFA", rate: 600 },
  ML: { symbol: "FCFA", rate: 600 },
  BF: { symbol: "FCFA", rate: 600 },
  GA: { symbol: "FCFA", rate: 600 },
  CG: { symbol: "FCFA", rate: 600 },
  CD: { symbol: "CDF", rate: 2800 }
};

// 📦 LOAD SERVICES
function loadServices(){
let country = document.getElementById("country").value;

document.getElementById("servicesSection").style.display =
country ? "block" : "none";
}

// 🧱 OPEN SERVICE
function openService(type){

let html = "";

if(type === "airtime"){
html = `
<h3>📱 Airtime Recharge</h3>
<input type="number" id="amount" placeholder="Enter Amount"><br><br>
<div id="result"></div><br>
<button onclick="calculate()">Calculate</button>
`;
}

if(type === "data"){
html = `
<h3>🌐 Data Top-Up</h3>
<select>
<option>1GB</option>
<option>2GB</option>
<option>5GB</option>
</select><br><br>
<input type="number" id="amount" placeholder="Enter Amount"><br><br>
<div id="result"></div><br>
<button onclick="calculate()">Calculate</button>
`;
}

if(type === "tv"){
html = `
<h3>📺 TV Subscription</h3>
<select>
<option>DSTV</option>
<option>GOTV</option>
<option>Startimes</option>
</select><br><br>
<input type="text" placeholder="Smart Card Number"><br><br>
<input type="number" id="amount" placeholder="Enter Amount"><br><br>
<div id="result"></div><br>
<button onclick="calculate()">Calculate</button>
`;
}

if(type === "electricity"){
html = `
<h3>💡 Electricity Bill</h3>
<input type="text" placeholder="Meter Number"><br><br>
<input type="number" id="amount" placeholder="Enter Amount"><br><br>
<div id="result"></div><br>
<button onclick="calculate()">Calculate</button>
`;
}

document.getElementById("serviceContainer").innerHTML = html;

}

// 💰 CALCULATE (MAIN LOGIC)
function calculate(){

let amount = document.getElementById("amount").value;
let country = document.getElementById("country").value;

if(!amount){
alert("Enter amount");
return;
}

let selected = countryRates[country];

if(!selected){
alert("Country not supported");
return;
}

let symbol = selected.symbol;
let rate = selected.rate;

// CONVERSION
let usd = amount / rate;
let pi = usd / 314159;

// DISPLAY
document.getElementById("result").innerHTML =
`💰 ${symbol}${amount}<br>
💵 $${usd.toFixed(2)}<br>
🪙 ${pi.toFixed(8)} π`;

}

</script>
