<script>
"use strict";

const FINANCE_API = "https://godomcoworld-backend-testnet.onrender.com";
const FINANCE_NETWORK = "testnet";

let currentService = "";
let financeQuote = null;
let financeRequestId = null;
let financeBusy = false;

const DATA_BUNDLES_GB = [1, 2, 5, 10, 15, 20, 30, 40, 50, 100];

function financeUUID() {
  if (crypto.randomUUID) return crypto.randomUUID();

  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === "x" ? r : (r & 3 | 8)).toString(16);
  });
}

function financeWalletId() {
  return localStorage.getItem("walletId_testnet");
}

async function financeRequest(path, body) {
  const response = await fetch(FINANCE_API + path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });

  const data = await response.json().catch(() => ({}));

  if (!response.ok || data.success === false) {
    throw new Error(data.message || "Finance request failed.");
  }

  return data;
}

function invalidateFinanceQuote() {
  financeQuote = null;
  financeRequestId = null;

  const result = document.getElementById("result");
  const buttons = document.getElementById("payButtons");

  if (result) result.textContent = "Details changed. Calculate a new quote.";
  if (buttons) buttons.style.display = "none";
}

function loadServices() {
  const country = document.getElementById("country").value;
  document.getElementById("servicesSection").style.display =
    country ? "block" : "none";

  document.getElementById("serviceContainer").innerHTML = "";
  currentService = "";
  financeQuote = null;
  financeRequestId = null;
}

function openService(type) {
  const country = document.getElementById("country").value;

  if (!country) {
    alert("Select your country first.");
    return;
  }

  currentService = type;
  financeQuote = null;
  financeRequestId = null;

  if (country !== "NG") {
    document.getElementById("serviceContainer").innerHTML =
      '<p style="color:#ffcc80">Finance Testnet quoting currently supports Nigeria (NGN). Please select Nigeria.</p>';
    return;
  }

  const providerOptions = `
    <option value="">Select network/provider</option>
    <option value="MTN">MTN</option>
    <option value="Airtel">Airtel</option>
    <option value="Glo">Glo</option>
    <option value="9mobile">9mobile</option>`;

  const dataOptions = DATA_BUNDLES_GB.map(gb =>
    `<option value="${gb}">${gb} GB</option>`
  ).join("");

  let html = "";

  if (type === "airtime") {
    html = `
      <h3>📱 Airtime Recharge</h3>
      <label>Mobile Network</label><br>
      <select id="financeProvider">${providerOptions}</select><br><br>
      <label>Phone Number</label><br>
      <input type="tel" id="phone" placeholder="Enter phone number"><br><br>
      <label>Amount (NGN)</label><br>
      <input type="number" id="amount" min="1" step="0.01" placeholder="Enter airtime amount">
      ${financePaymentPreview()}`;
  } else if (type === "data") {
    html = `
      <h3>🌐 Data Bundle Subscription</h3>
      <label>Mobile Network</label><br>
      <select id="financeProvider">${providerOptions}</select><br><br>
      <label>Phone Number</label><br>
      <input type="tel" id="phone" placeholder="Enter phone number"><br><br>
      <label>Select Data Bundle</label><br>
      <select id="dataBundle">${dataOptions}</select><br><br>
      <label>Bundle Price (NGN)</label><br>
      <input type="number" id="amount" min="1" step="0.01" placeholder="Enter the bundle price">
      <p id="bundlePreview" style="color:#9ccc65">Selected bundle: 1 GB</p>
      ${financePaymentPreview()}`;
  } else if (type === "tv") {
    html = `
      <h3>📺 TV Subscription</h3>
      <label>Provider</label><br>
      <select id="financeProvider">
        <option value="">Select provider</option>
        <option value="DSTV">DSTV</option>
        <option value="GOTV">GOTV</option>
        <option value="Startimes">Startimes</option>
      </select><br><br>
      <label>Smart Card Number</label><br>
      <input type="text" id="smartcard" placeholder="Enter smart card number"><br><br>
      <label>Amount (NGN)</label><br>
      <input type="number" id="amount" min="1" step="0.01" placeholder="Enter amount">
      ${financePaymentPreview()}`;
  } else if (type === "electricity") {
    html = `
      <h3>💡 Electricity Bill</h3>
      <label>Distribution Provider</label><br>
      <select id="financeProvider">
        <option value="">Select provider</option>
        <option value="IKEDC">IKEDC</option>
        <option value="EKEDC">EKEDC</option>
        <option value="AEDC">AEDC</option>
        <option value="IBEDC">IBEDC</option>
        <option value="KEDCO">KEDCO</option>
        <option value="PHED">PHED</option>
        <option value="BEDC">BEDC</option>
        <option value="EEDC">EEDC</option>
      </select><br><br>
      <label>Meter Number</label><br>
      <input type="text" id="meter" placeholder="Enter meter number"><br><br>
      <label>Amount (NGN)</label><br>
      <input type="number" id="amount" min="1" step="0.01" placeholder="Enter amount">
      ${financePaymentPreview()}`;
  }

  document.getElementById("serviceContainer").innerHTML = html;

  if (type === "data") {
    document.getElementById("dataBundle").addEventListener("change", updateBundlePreview);
    updateBundlePreview();
  }
}

function financePaymentPreview() {
  return `
    <div id="result" style="margin:12px 0"></div>
    <button type="button" onclick="calculate()">Get Testnet Quote</button>
    <div id="payButtons" style="display:none;margin-top:12px">
      <button class="pay-btn" type="button" onclick="payWithPi()">π Pay with Pi Network</button>
      <button class="pay-btn" type="button" onclick="payWithWallet()">👛 Pay with Godomcoworld Wallet</button>
    </div>
    <p style="color:#ffcc80;font-size:13px">
      Testnet only: payments are recorded for testing. Airtime, data, TV and electricity services are NOT delivered.
    </p>`;
}

function updateBundlePreview() {
  const bundle = document.getElementById("dataBundle");
  const preview = document.getElementById("bundlePreview");

  if (bundle && preview) {
    preview.textContent = "Selected bundle: " + bundle.value + " GB";
  }
}

function getFinanceDetails() {
  const amount = document.getElementById("amount")?.value?.trim();
  const provider = document.getElementById("financeProvider")?.value?.trim();

  let customerReference = "";

  if (currentService === "airtime" || currentService === "data") {
    customerReference = document.getElementById("phone")?.value?.trim() || "";
  } else if (currentService === "tv") {
    customerReference = document.getElementById("smartcard")?.value?.trim() || "";
  } else if (currentService === "electricity") {
    customerReference = document.getElementById("meter")?.value?.trim() || "";
  }

  if (!provider) throw new Error("Select the service provider.");
  if (!customerReference) throw new Error("Enter the required customer reference.");
  if (!amount || !/^\d+(?:\.\d{1,2})?$/.test(amount) || Number(amount) <= 0) {
    throw new Error("Enter a valid positive amount in NGN.");
  }

  return { amount, provider, customerReference };
}

async function calculate() {
  try {
    if (financeBusy) return;

    const details = getFinanceDetails();

    const data = await financeRequest("/api/finance/quote", {
      serviceType: currentService,
      amount: details.amount
    });

    if (data.network !== FINANCE_NETWORK || !data.amountPI) {
      throw new Error("The server did not return a valid Testnet quote.");
    }

    financeQuote = {
      serviceType: currentService,
      amountNGN: details.amount,
      amountPI: data.amountPI,
      provider: details.provider,
      customerReference: details.customerReference
    };

    financeRequestId = financeUUID();

    document.getElementById("result").innerHTML =
      `Amount: ₦${Number(details.amount).toLocaleString()}<br>` +
      `Server quote: ${data.amountPI} π<br>` +
      `<small>${data.message || "Testnet quote"}</small>`;

    document.getElementById("payButtons").style.display = "block";
  } catch (error) {
    alert(error.message || "Unable to calculate quote.");
  }
}

async function payWithWallet() {
  if (!financeQuote || !financeRequestId) {
    return alert("Get a new quote before paying.");
  }

  if (financeBusy) return;

  const walletId = financeWalletId();

  if (!walletId) {
    return alert("Your Testnet wallet was not found. Open your Testnet wallet first.");
  }

  const pin = prompt("Enter your Godomcoworld Transaction PIN:");
  if (pin === null) return;
  if (!pin.trim()) return alert("Transaction PIN is required.");

  financeBusy = true;

  try {
    const verified = await financeRequest("/wallet/security/verify-pin", {
      walletId,
      network: FINANCE_NETWORK,
      pin: pin.trim()
    });

    const authorizationToken =
      verified.authorizationToken || verified.token;

    if (!authorizationToken) {
      throw new Error("PIN verification did not return an authorization token.");
    }

    const result = await financeRequest("/api/finance/wallet/pay", {
      walletId,
      authorizationToken,
      requestId: financeRequestId,
      network: FINANCE_NETWORK,
      serviceType: financeQuote.serviceType,
      amount: financeQuote.amountNGN,
      provider: financeQuote.provider,
      customerReference: financeQuote.customerReference
    });

    alert(
      (result.message || "Testnet wallet payment recorded.") +
      (result.receiptId ? "\nReceipt: " + result.receiptId : "") +
      "\nNo external service has been delivered."
    );

    if (typeof loadBalance === "function") {
      await loadBalance();
    }

    invalidateFinanceQuote();
  } catch (error) {
    alert(error.message || "Godomcoworld Wallet payment failed.");
  } finally {
    financeBusy = false;
  }
}

async function loadPiSDK() {
  if (window.Pi) return;

  await new Promise((resolve, reject) => {
    const existing = document.querySelector('script[data-finance-pi-sdk]');
    if (existing) {
      existing.addEventListener("load", resolve, { once: true });
      existing.addEventListener("error", reject, { once: true });
      return;
    }

    const script = document.createElement("script");
    script.src = "https://sdk.minepi.com/pi-sdk.js";
    script.async = true;
    script.dataset.financePiSdk = "true";
    script.onload = resolve;
    script.onerror = () => reject(new Error("Unable to load Pi SDK."));
    document.head.appendChild(script);
  });

  if (!window.Pi) throw new Error("Pi SDK is unavailable.");
}

async function payWithPi() {
  if (!financeQuote || !financeRequestId) {
    return alert("Get a new quote before paying.");
  }

  if (financeBusy) return;

  financeBusy = true;

  try {
    await loadPiSDK();

    Pi.init({ version: "2.0", sandbox: true });

    const auth = await Pi.authenticate(["username", "payments"]);

    if (!auth || !auth.accessToken) {
      throw new Error("Pi authentication was not completed.");
    }

    const details = financeQuote;
    const requestId = financeRequestId;

    Pi.createPayment({
      amount: Number(details.amountPI),
      memo: "Godomcoworld Finance Testnet payment",
      metadata: {
        purpose: "finance_service",
        requestId,
        serviceType: details.serviceType,
        provider: details.provider,
        customerReference: details.customerReference
      }
    }, {
      onReadyForServerApproval: async paymentId => {
        try {
          await financeRequest("/u2a/shared/approve", {
            paymentId,
            accessToken: auth.accessToken,
            network: FINANCE_NETWORK,
            paymentType: "finance_service",
            serviceType: details.serviceType,
            amount: details.amountNGN,
            provider: details.provider,
            customerReference: details.customerReference
          });
        } catch (error) {
          console.error("Finance U2A approval failed:", error);
          alert(error.message || "Pi payment approval failed.");
        }
      },

      onReadyForServerCompletion: async (paymentId, txid) => {
        try {
          const result = await financeRequest("/u2a/shared/complete", {
            paymentId,
            txid,
            accessToken: auth.accessToken,
            network: FINANCE_NETWORK,
            paymentType: "finance_service"
          });

          alert(
            (result.message || "Finance Testnet payment recorded.") +
            (result.receiptId ? "\nReceipt: " + result.receiptId : "") +
            "\nNo external service has been delivered."
          );

          invalidateFinanceQuote();
        } catch (error) {
          console.error("Finance U2A completion failed:", error);
          alert(error.message || "Payment completion could not be confirmed.");
        } finally {
          financeBusy = false;
        }
      },

      onCancel: () => {
        financeBusy = false;
        alert("Pi payment was cancelled.");
      },

      onError: error => {
        financeBusy = false;
        console.error("Finance Pi payment error:", error);
        alert(error?.message || "Pi payment failed.");
      }
    });
  } catch (error) {
    financeBusy = false;
    alert(error.message || "Unable to start Pi payment.");
  }
}

document.addEventListener("input", event => {
  if (event.target.closest("#serviceContainer")) {
    invalidateFinanceQuote();
  }
});

document.addEventListener("change", event => {
  if (event.target.closest("#serviceContainer")) {
    invalidateFinanceQuote();
    if (event.target.id === "dataBundle") updateBundlePreview();
  }
});
</script>
