<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wallet - Godomcoworld</title>
<link rel="stylesheet" href="css/style.css">

<style>
.balance-card{
  background:#111;
  padding:20px;
  margin:15px 0;
  border-radius:12px;
  text-align:center;
}

button{
  padding:10px;
  margin:5px;
  border:none;
  border-radius:8px;
  background:#00c853;
  color:white;
}
#qr-container img{
  border:2px solid #4CAF50;
  padding:10px;
  border-radius:10px;
}
</style>

</head>

<body>

<header>
<h1>💳 My Wallet</h1>
</header>

<main>

<!-- FIAT BALANCE -->
<div class="balance-card">
<h2>💵 Fiat Balance</h2>
<h1 id="fiatBalance">₦0</h1>

<button onclick="depositFiat()">Deposit</button>
<button onclick="withdrawFiat()">Withdraw</button>
</div>

<!-- PI BALANCE -->
<div class="balance-card">
<h2>🪙 Pi Balance</h2>
<h1 id="piBalance">0 π</h1>

<button onclick="depositPi()">Deposit Pi</button>
<button onclick="sendPi()">Send Pi</button>
</div>

<h2>🪙 Pi Wallet</h2>

<div>
  <p><strong>Your Pi Address:</strong></p>
  <p id="pi-address">Not connected</p>

  <button onclick="connectWallet()">🔗 Connect Wallet</button>
  <button onclick="showQRCode()">📥 Receive Pi</button>

  <div id="qr-container" style="margin-top:15px;"></div>
</div>

</main>

<script>
  let fiat = parseFloat(localStorage.getItem("fiat_balance")) || 0;
let pi = parseFloat(localStorage.getItem("pi_balance")) || 0;

// LOAD BALANCES
function loadBalance(){

  document.getElementById("fiatBalance").innerText =
    "₦" + fiat.toLocaleString();

  document.getElementById("piBalance").innerText =
    pi.toFixed(6) + " π";
}
  function depositFiat(){
  let amount = prompt("Enter amount to deposit (₦):");

  if(!amount) return;

  fiat += parseFloat(amount);

  localStorage.setItem("fiat_balance", fiat);

  loadBalance(); // 🔥 update instantly
  }
  function depositPi(){
  let amount = prompt("Enter Pi amount:");

  if(!amount) return;

  pi += parseFloat(amount);

  localStorage.setItem("pi_balance", pi);

  loadBalance(); // 🔥 update instantly
  }

function withdrawFiat(){
  let amount = prompt("Enter amount to withdraw:");

  if(amount > fiat){
    alert("Insufficient balance");
    return;
  }

  fiat -= amount;

  localStorage.setItem("fiat_balance", fiat);

  loadBalance();
    }

function sendPi(){
  let amount = prompt("Enter Pi to send:");

  if(amount > pi){
    alert("Insufficient Pi balance");
    return;
  }

  pi -= amount;

  localStorage.setItem("pi_balance", pi);

  loadBalance();
  }
// CONNECT WALLET 

function connectWallet(){
  let address = prompt("Enter your Pi Wallet Address:");

  if(address && address.length > 10){
    localStorage.setItem("pi_address", address);
    document.getElementById("pi-address").innerText = address;
  } else {
    alert("Invalid address");
  }
}

function showQRCode(){
  let address = localStorage.getItem("pi_address");

  if(!address){
    alert("Please connect your Pi wallet first");
    return;
  }
  document.getElementById("qr-container").innerHTML = "";

  // Generate QR Code
  document.getElementById("qr-container").innerHTML = `
    <p>Scan to send Pi:</p>
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${address}">
    <p style="word-break:break-all;">${address}</p>
  `;
}

// Load saved wallet on page load
window.onload = function(){

  loadBalance();

  let saved = localStorage.getItem("pi_address");
  if(saved){
    document.getElementById("pi-address").innerText = saved;
  }

  }

</script>
