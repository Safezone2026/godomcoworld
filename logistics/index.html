<!DOCTYPE html>
<html>
<head>
<title>Logistics Dashboard - Godomcoworld</title>
<link rel="stylesheet" href="../css/style.css">

<style>
body {
  background:#0b0b0b;
  color:white;
  font-family:sans-serif;
  padding:20px;
}

.card {
  background:#111;
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
}

button {
  background:orange;
  border:none;
  padding:10px;
  border-radius:8px;
  margin-top:10px;
  width:100%;
  cursor:pointer;
}

.delivery {
  background:#1a1a1a;
  padding:10px;
  margin:10px 0;
  border-radius:8px;
}

.small-btn{
  width:auto;
  margin:5px;
  padding:6px 10px;
  font-size:12px;
}
</style>
</head>

<body>

<h2>🚚 Logistics Dashboard</h2>

<div class="card">
  <h3 id="riderName">Welcome</h3>

  <h3>💰 Available Pi Balance</h3>
  <h2 id="piBalance">π 0.000000</h2>

  <h3>📦 Deliveries Completed</h3>
  <h2 id="completed">0</h2>
</div>
<div class="card">
  <h3>💸 Withdraw Earnings</h3>

  <input
    type="number"
    id="withdrawAmount"
    placeholder="Enter amount">

  <input type="hidden" id="withdrawCurrency" value="PI">

  <input type="hidden" id="withdrawMethod" value="pi">

  <input type="text" id="withdrawDetails" placeholder="Pi wallet address">

  <button onclick="withdrawFunds()">
    Withdraw
  </button>

  <p id="withdrawMsg"></p>
</div>

<div class="card">
  <h3>📜 Withdrawal History</h3>
  <div id="withdrawHistory">Loading...</div>
</div>

<div class="card">
  <h3>📋 Assigned Deliveries</h3>
  <div id="deliveryList">Loading...</div>
</div>

<div class="card">
  <h3>📦 Track Shipment</h3>
  <a href="track.html">
    <button>Track Now</button>
  </a>
</div>

<div class="card">
  <h3>🏠 Back to Logistics Home</h3>
  <a href="logistics-home.html">
    <button>Go Back</button>
  </a>
</div>
<a href="logistics-partner-registration.html">
  <button>🚚 Become a Logistics Partner</button>
</a>

<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<script src="../js/network.js"></script>
<script>

// ================= USER =================
const TESTNET_BACKEND = "https://godomcoworld-backend-testnet.onrender.com";
const network = "testnet";
localStorage.setItem("walletNetwork", "testnet");

let rider = (localStorage.getItem("logisticsName") || "").trim();
let riderAccessToken = "";

Pi.init({ version: "2.0", sandbox: true });

console.log("Current Rider =", rider, "Network =", network);

// ================= LOAD DASHBOARD =================
async function loadDashboard(){

  try {

    if (!riderAccessToken) return;
    const res = await fetch(
      `${TESTNET_BACKEND}/logistics-dashboard/${encodeURIComponent(rider)}?network=${network}`,
      { headers: { Authorization: `Bearer ${riderAccessToken}` } }
    );
    const data = await res.json();

    console.log("LOGISTICS DATA:", data);

    // Pi balance only; do not relabel generic fiat earnings.
    const balances = data.balances || {};
    document.getElementById("piBalance").innerText =
      "π " + Number(balances.PI || 0).toLocaleString(undefined, {
        minimumFractionDigits: 6,
        maximumFractionDigits: 6
      });

    // 📦 COMPLETED
    document.getElementById("completed").innerText =
      data.completed || 0;

    renderDeliveries(data.deliveries || []);

  } catch(err){
    console.error(err);
    document.getElementById("deliveryList").innerHTML = "Failed to load";
  }
}


// ================= RENDER DELIVERIES =================
function renderDeliveries(deliveries){

  let container = document.getElementById("deliveryList");

  if(deliveries.length === 0){
    container.innerHTML = "No deliveries assigned";
    return;
  }

  container.innerHTML = "";

  deliveries.forEach(d => {

    container.innerHTML += `
      <div class="delivery">

        <b>🆔 Order:</b>
        ${d.order_id || d.orderId || "-"}
        <br>

        <b>📦 Product:</b>
        ${d.product_name || "-"}
        <br>

        <b>Status:</b>
        ${d.status || "-"}
        <br>

        <b>Distance:</b>
        ${d.distance || 0} km
        <br>

        <br><br>

        <div style="
          background:#151515;
          padding:10px;
          border-radius:8px;
          margin-top:8px;
        ">

          <b>👤 BUYER DETAILS</b>
          <br>

          Name:
          ${d.buyer_name || "-"}
          <br>

          Phone:
          ${d.buyer_phone || "-"}
          <br>

          Email:
          ${d.buyer_email || "-"}
          <br>

          Address:
          ${d.buyer_address || "-"}
          <br>

          House/Street:
          ${d.house_address || "-"}
          <br>

          City:
          ${d.buyer_city || "-"}
          <br>

          State:
          ${d.buyer_state || "-"}
          <br>

          Country:
          ${d.buyer_country || "-"}
          <br>

        </div>

        <div style="
          background:#151515;
          padding:10px;
          border-radius:8px;
          margin-top:8px;
        ">

          <b>🏪 SELLER DETAILS</b>
          <br>

          Username:
          ${d.seller_username || "-"}
          <br>

          Phone:
          ${d.seller_phone || "-"}
          <br>

          Address:
          ${d.seller_address || "-"}
          <br>

          City:
          ${d.seller_city || "-"}
          <br>

          State:
          ${d.seller_state || "-"}
          <br>

          Country:
          ${d.seller_country || "-"}
          <br>

        </div>

        <button
          class="small-btn"
          onclick="downloadOrderReceipt(
            '${d.order_id || d.orderId || ""}',
            '${(
              d.username ||
              localStorage.getItem("username") ||
              localStorage.getItem("logisticsName") ||
              ""
            ).replace(/'/g, "\\'")}'
          )"
        >
          📄 Download Order Receipt
        </button>

        ${renderButtons(d)}

      </div>
    `;
  });
}


// ================= STATUS BUTTONS =================
function renderButtons(d){

  if(d.status === "pending"){
    return `
      <button class="small-btn" onclick="updateStatus('${d.orderId}','in_transit')">
        🚚 Start Delivery
      </button>
    `;
  }

  if(d.status === "in_transit"){
    return `
      <button class="small-btn" onclick="updateStatus('${d.orderId}','delivered_pending')">
        📦 Mark Delivered (Await Buyer)
      </button>
    `;
  }

  if(d.status === "delivered_pending"){
    return `<small>Waiting for buyer confirmation</small>`;
  }

  if(d.status === "delivered"){
    return `<small>✅ Completed</small>`;
  }

  return "";
}


// ================= UPDATE STATUS =================
async function updateStatus(orderId, status){

  const res = await fetch('https://godomcoworld-backend-testnet.onrender.com/update-delivery-status', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
  orderId,
  status,
  network
})
  });

  const data = await res.json();

  alert(data.message);

  loadDashboard();
}

// ================= RIDER WITHDRAW =================
async function withdrawFunds(){
  const amount = Number(document.getElementById("withdrawAmount").value);
  const method = "pi";
  const withdrawalCurrency = "PI";

  if (!riderAccessToken) {
    return alert("Please complete Pi sign-in first.");
  }
  if (!amount || amount <= 0) {
    return alert("Enter withdrawal amount");
  }

  const body = {
    riderName: rider,
    amount,
    currency: withdrawalCurrency,
    method,
    network
  };

  try {
    const res = await fetch(`${TESTNET_BACKEND}/rider-withdraw`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: `Bearer ${riderAccessToken}`
      },
      body: JSON.stringify(body)
    });

    const data = await res.json();
    document.getElementById("withdrawMsg").innerText = data.message || "Request completed.";

    if (data.success) {
      document.getElementById("withdrawAmount").value = "";
      document.getElementById("withdrawDetails").value = "";
      await Promise.all([loadDashboard(), loadWithdrawals()]);
    }
  } catch (err) {
    console.error("RIDER WITHDRAWAL:", err);
    document.getElementById("withdrawMsg").innerText = "Withdrawal request failed.";
  }
}

// ================= LOAD WITHDRAWALS =================
async function loadWithdrawals(){

  try {

    if (!riderAccessToken) return;
    const res = await fetch(
      `${TESTNET_BACKEND}/rider-withdrawals/${encodeURIComponent(rider)}?network=${network}`,
      { headers: { Authorization: `Bearer ${riderAccessToken}` } }
    );

    const data = await res.json();

    if(!data.success){
      document.getElementById("withdrawHistory").innerHTML =
        "<p>Failed to load withdrawal history.</p>";
      return;
    }

    const history = (data.withdrawals || []).filter(w => String(w.currency || "").toUpperCase() === "PI");

    document.getElementById("withdrawHistory").innerHTML =
      history.length
      ? history.map(w => {

          const currency = String(w.currency || "NG").toUpperCase();

          const symbol =
            currency === "USD"
              ? "$"
              : currency === "PI"
                ? "π "
                : "₦";

          const amount = Number(w.amount || 0).toLocaleString(undefined,{
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
          });

          const fee = Number(w.fee || 0).toLocaleString(undefined,{
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
          });

          const destination =
            w.method === "bank"
              ? `Bank: ${w.bank_name || "-"}<br>Account: ${w.account_number || "-"}`
              : `Crypto: ${w.crypto_address || "-"}<br>Network: ${w.network || "-"}`;

          return `
<p>
💸 <b>${symbol}${amount} ${currency}</b><br>

Fee: ${fee} ${currency}<br>

Method: ${w.method || "-"}<br>

${destination}<br>

Status:
<b>${w.status || "-"}</b><br>

Withdrawal ID:
<code>${w.withdrawal_id || w.id || "-"}</code><br>

Created:
${w.created_at ? new Date(w.created_at).toLocaleString() : "-"}<br>

Paid:
${w.paid_at ? new Date(w.paid_at).toLocaleString() : "Not paid yet"}

</p>
<hr>
`;
        }).join("")
      : "<p>No withdrawals yet.</p>";

  } catch(err){

    console.error("RIDER WITHDRAWAL HISTORY:", err);

    document.getElementById("withdrawHistory").innerHTML =
      "<p>Failed to load withdrawal history.</p>";
  }

}

// ================= PI AUTHENTICATION AND AUTO LOAD =================
async function authenticateRider() {
  if (!rider) {
    alert("Rider username is missing. Please register again.");
    window.location.href = "logistics-partner-registration.html";
    return false;
  }

  try {
    const auth = await Pi.authenticate(
      ["username", "payments"],
      function(payment) {
        console.warn("Unexpected incomplete Pi payment:", payment);
      }
    );

    if (!auth || !auth.accessToken) {
      throw new Error("Pi authentication did not return an access token.");
    }

    riderAccessToken = auth.accessToken;
    document.getElementById("riderName").innerText = "Rider: " + rider;

    await Promise.all([loadDashboard(), loadWithdrawals()]);
    return true;
  } catch (err) {
    console.error("RIDER PI AUTHENTICATION:", err);
    alert("Pi sign-in failed. Please reload and try again.");
    return false;
  }
}

window.addEventListener("load", async function() {
  if (await authenticateRider()) {
    setInterval(() => {
      if (riderAccessToken) {
        loadDashboard();
        loadWithdrawals();
      }
    }, 5000);
  }
});

</script>

<script src="../js/dev-console.js"></script>
<script src="../js/receipt.js"></script>
</body>
</html>
