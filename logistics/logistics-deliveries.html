<!DOCTYPE html>
<html>
<head>
<title>My Deliveries</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<h2>🚚 My Deliveries</h2>

<div id="deliveryList">Loading...</div>

<script>
const rider = localStorage.getItem("logisticsName");

fetch('https://godomcoworld-backend.onrender.com/api/deliveries')
.then(res => res.json())
.then(data => {

  const myDeliveries = data.filter(d => d.rider === rider);

  const container = document.getElementById("deliveryList");
  container.innerHTML = "";

  if(!myDeliveries.length){
    container.innerHTML = "No deliveries yet";
    return;
  }

  myDeliveries.forEach(d => {
    const div = document.createElement("div");
    div.innerHTML = `
      <p>Order: ${d.order_id}</p>
<p>Status: ${d.status}</p>

<button onclick="updateStatus('${d.order_id}','in_transit')">
Start Journey
</button>

<button onclick="updateStatus('${d.order_id}','delivered_pending')">
Delivered to Buyer
</button>

      <hr>
    `;
    container.appendChild(div);
  });

});
function updateStatus(orderId, status){

  fetch('https://godomcoworld-backend.onrender.com/api/update-delivery', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ orderId, status })
  })
  .then(() => location.reload());
}

</script>

<script src="js/dev-console.js"></script>
</body>
</html>
