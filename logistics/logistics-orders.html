<!DOCTYPE html>
<html>
<head>
<title>Available Orders</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<h2>📦 Available Orders</h2>

<div id="ordersList">Loading...</div>

<script>
fetch('/api/orders')
.then(res => res.json())
.then(data => {
  const container = document.getElementById("ordersList");
  container.innerHTML = "";

  if(!data.length){
    container.innerHTML = "No orders available";
    return;
  }

  data.forEach(order => {
    const div = document.createElement("div");
    div.innerHTML = `
      <p><b>Order:</b> ${order.id}</p>
      <p>Total: ₦${order.total}</p>
      <button onclick="acceptOrder('${order.id}')">Accept</button>
      <hr>
    `;
    container.appendChild(div);
  });
});

function acceptOrder(id){

  const rider = localStorage.getItem("logistics_username");

  fetch('/api/assign-order', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      orderId: id,
      rider: rider
    })
  })
  .then(res => res.json())
  .then(data => {
    alert(data.message);

    // 🔥 reload list
    location.reload();
  });
}
</script>

</body>
</html>
