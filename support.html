<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Support - Godomcoworld</title>
<style>
body{background:#0d0d0d;color:white;font-family:Arial,sans-serif;margin:0}
.container{max-width:760px;margin:auto;padding:20px}
input,textarea{box-sizing:border-box;width:100%;padding:12px;margin-top:10px;border-radius:8px;border:1px solid #333;background:#1a1a1a;color:white}
textarea{min-height:130px;resize:vertical}
button{padding:12px;margin-top:15px;border:none;border-radius:8px;background:#00bcd4;color:white;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.hint{color:#bbb;font-size:.9rem;line-height:1.5}
#previewList{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px}
.preview{width:125px;overflow:hidden;border:1px solid #444;border-radius:8px;padding:6px}
.preview img{width:100%;height:95px;object-fit:cover;border-radius:5px}
.preview button{width:100%;padding:7px;margin-top:6px;background:#8b3030}
#msg{white-space:pre-wrap;line-height:1.5}
</style>
</head>
<body>
<div class="container">
<h2>Customer Support</h2>
<p>Describe your issue and attach up to five screenshots if they help explain the problem.</p>

<form id="supportForm">
<label for="name">Your name</label>
<input type="text" id="name" maxlength="120" autocomplete="name" required>

<label for="email">Your email</label>
<input type="email" id="email" maxlength="254" autocomplete="email" required>

<label for="issue">Describe your issue</label>
<textarea id="issue" maxlength="10000" required></textarea>

<label for="screenshots">Screenshots (optional)</label>
<input type="file" id="screenshots" accept="image/jpeg,image/png,image/webp" multiple>
<p class="hint">Up to 5 images. JPEG, PNG or WebP. Maximum 5 MB per image.</p>
<div id="previewList"></div>

<button type="submit" id="submitButton">Submit Ticket</button>
<p id="msg" role="status" aria-live="polite"></p>
</form>

<section id="mySupportSection" style="margin-top:35px">
  <hr style="border-color:#333">
  <h2>My Support Tickets</h2>
  <p class="hint">View your previous support requests and continue conversations with our team.</p>
  <button type="button" id="refreshTicketsButton">Refresh Tickets</button>
  <p id="historyMsg" class="hint" role="status" aria-live="polite">Loading your support history...</p>
  <div id="mySupportTickets"></div>
</section>
</div>

<script>
const MAX_FILES = 5;
const MAX_SIZE = 5 * 1024 * 1024;
const ALLOWED_TYPES = ["image/jpeg", "image/png", "image/webp"];
const picker = document.getElementById("screenshots");
const previewList = document.getElementById("previewList");
const msg = document.getElementById("msg");
const form = document.getElementById("supportForm");
const submitButton = document.getElementById("submitButton");
let selectedFiles = [];

function renderPreviews() {
  previewList.replaceChildren();
  selectedFiles.forEach((file, index) => {
    const card = document.createElement("div");
    card.className = "preview";
    const img = document.createElement("img");
    img.alt = "Screenshot preview " + (index + 1);
    const url = URL.createObjectURL(file);
    img.src = url;
    img.onload = () => URL.revokeObjectURL(url);
    const label = document.createElement("div");
    label.className = "hint";
    label.textContent = file.name;
    const remove = document.createElement("button");
    remove.type = "button";
    remove.textContent = "Remove";
    remove.setAttribute("aria-label", "Remove " + file.name);
    remove.onclick = () => {
      selectedFiles.splice(index, 1);
      picker.value = "";
      renderPreviews();
    };
    card.append(img, label, remove);
    previewList.append(card);
  });
}

picker.addEventListener("change", () => {
  const incoming = Array.from(picker.files || []);
  const combined = [...selectedFiles, ...incoming];

  if (combined.length > MAX_FILES) {
    msg.textContent = "You can attach no more than five screenshots.";
    picker.value = "";
    return;
  }

  for (const file of incoming) {
    if (!ALLOWED_TYPES.includes(file.type)) {
      msg.textContent = "Only JPEG, PNG and WebP images are accepted.";
      picker.value = "";
      return;
    }
    if (file.size > MAX_SIZE) {
      msg.textContent = file.name + " exceeds the 5 MB limit.";
      picker.value = "";
      return;
    }
  }

  selectedFiles = combined;
  picker.value = "";
  msg.textContent = "";
  renderPreviews();
});

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const issue = document.getElementById("issue").value.trim();

  if (!name || !email || !issue) {
    msg.textContent = "Please fill in all required fields.";
    return;
  }
  if (selectedFiles.length > MAX_FILES) {
    msg.textContent = "You can attach no more than five screenshots.";
    return;
  }

  const body = new FormData();
  body.append("name", name);
  body.append("email", email);
  body.append("issue", issue);
  selectedFiles.forEach(file => body.append("screenshots", file, file.name));

  submitButton.disabled = true;
  msg.textContent = "Submitting ticket and uploading screenshots…";

  try {
    const response = await fetch(
      "https://godomcoworld-backend-testnet.onrender.com/support/tickets",
      { method: "POST", credentials: "include", body }
    );
    const result = await response.json().catch(() => ({}));

    if (!response.ok || !result.success) {
      throw new Error(result.message || "Ticket submission failed.");
    }

    msg.textContent = "Ticket submitted successfully. Our team will review it.";
    form.reset();
    selectedFiles = [];
    renderPreviews();
  } catch (error) {
    console.error("Support ticket submission failed:", error);
    msg.textContent = error.message || "Could not submit your ticket. Please try again.";
  } finally {
    submitButton.disabled = false;
  }
});


// Customer support history and two-way messaging
const historyMsg = document.getElementById("historyMsg");
const ticketsBox = document.getElementById("mySupportTickets");
const refreshTicketsButton = document.getElementById("refreshTicketsButton");
const SUPPORT_API = "https://godomcoworld-backend-testnet.onrender.com";

function supportEscape(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;",
    '"': "&quot;", "'": "&#39;"
  })[c]);
}

async function loadMySupportTickets() {
  historyMsg.textContent = "Loading your support history...";
  ticketsBox.replaceChildren();

  try {
    const response = await fetch(SUPPORT_API + "/support/my-tickets", {
      credentials: "include"
    });

    if (response.status === 401) {
      historyMsg.textContent =
        "Sign in with Pi using this browser to view tickets linked to your account. Anonymous tickets cannot be linked automatically.";
      return;
    }

    const result = await response.json().catch(() => ({}));
    if (!response.ok) {
      throw new Error(result.message || result.error || "Could not load support history.");
    }

    const tickets = Array.isArray(result) ? result : result.tickets;
    if (!Array.isArray(tickets) || tickets.length === 0) {
      historyMsg.textContent = "You have no support tickets linked to this Pi account yet.";
      return;
    }

    historyMsg.textContent = tickets.length + " support ticket(s) found.";

    ticketsBox.innerHTML = tickets.map(ticket => {
      const id = supportEscape(ticket.id);
      const messages = Array.isArray(ticket.messages) ? ticket.messages : [];
      const unread = Number(ticket.unread_replies || 0);

      const attachments = (Array.isArray(ticket.attachments) ? ticket.attachments : [])
        .map(file => {
          if (!file || !file.signed_url) {
            return `<span class="hint">${supportEscape(file && file.name || "Attachment unavailable")}</span>`;
          }
          const url = supportEscape(file.signed_url);
          const name = supportEscape(file.name || "Screenshot");
          return `<a href="${url}" target="_blank" rel="noopener noreferrer">${name}</a>`;
        }).join("<br>") || "No screenshots attached.";

      const conversation = messages.map(message => `
        <div style="border-bottom:1px solid #333;padding:10px 0">
          <strong>${message.sender_type === "admin" ? "Support team" : "You"}</strong>
          <small class="hint"> — ${supportEscape(message.created_at || "")}</small>
          <div style="white-space:pre-wrap;margin-top:6px">${supportEscape(message.message)}</div>
        </div>
      `).join("") || '<p class="hint">No replies yet. You can send a message below.</p>';

      return `<article class="card" style="background:#171717;border:1px solid #333;border-radius:10px;padding:15px;margin:15px 0">
        <strong>Ticket: ${id}</strong><br>
        <span>Status: ${supportEscape(ticket.status || "open")}</span>
        ${unread ? `<p style="color:#ffca28;font-weight:bold">${unread} unread support reply/replies</p>` : ""}
        <p><strong>Issue:</strong></p>
        <div style="white-space:pre-wrap">${supportEscape(ticket.issue)}</div>
        <p class="hint">Submitted: ${supportEscape(ticket.created_at || "")}</p>
        <p><strong>Screenshots:</strong><br>${attachments}</p>
        <details ontoggle="if(this.open) markSupportTicketRead('${id}')">
          <summary style="cursor:pointer;color:#00bcd4">View conversation (${messages.length} message(s))</summary>
          <div style="margin-top:10px">${conversation}</div>
        </details>
        <label for="customer-reply-${id}">Your reply:</label>
        <textarea id="customer-reply-${id}" maxlength="10000" placeholder="Write a message to our support team..."></textarea>
        <button type="button" onclick="sendCustomerSupportReply('${id}')">Send Reply</button>
      </article>`;
    }).join("");
  } catch (error) {
    console.error("Support history:", error);
    historyMsg.textContent = error.message || "Could not load support history.";
  }
}

async function markSupportTicketRead(id) {
  try {
    await fetch(SUPPORT_API + "/support/tickets/" + encodeURIComponent(id) + "/read", {
      method: "POST",
      credentials: "include"
    });
  } catch (error) {
    console.error("Could not mark support messages as read:", error);
  }
}

async function sendCustomerSupportReply(id) {
  const field = document.getElementById("customer-reply-" + id);
  const message = field ? field.value.trim() : "";

  if (!message) {
    alert("Please enter a message first.");
    return;
  }

  try {
    const response = await fetch(
      SUPPORT_API + "/support/tickets/" + encodeURIComponent(id) + "/messages",
      {
        method: "POST",
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message })
      }
    );

    const result = await response.json().catch(() => ({}));
    if (!response.ok) {
      throw new Error(result.message || result.error || "Could not send your reply.");
    }

    alert("Your reply has been sent.");
    await loadMySupportTickets();
  } catch (error) {
    alert(error.message || "Could not send your reply.");
  }
}

refreshTicketsButton.addEventListener("click", loadMySupportTickets);
loadMySupportTickets();

</script>
<script src="js/dev-console.js"></script>
</body>
</html>
