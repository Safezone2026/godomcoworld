<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Support - Godomcoworld</title>

<style>
body{
  background:#0d0d0d;
  color:white;
  font-family:Arial;
}

.container{
  padding:20px;
}

input, textarea{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:8px;
  border:none;
  background:#1a1a1a;
  color:white;
}

button{
  padding:12px;
  margin-top:15px;
  width:100%;
  border:none;
  border-radius:8px;
  background:#00bcd4;
  color:white;
  cursor:pointer;
}
</style>

</head>

<body>

<div class="container">

<h2>Customer Support</h2>

<input type="text" id="name" placeholder="Your Name">
<input type="email" id="email" placeholder="Your Email">

<textarea id="issue" placeholder="Describe your issue"></textarea>

<button onclick="submitTicket()">Submit Ticket</button>

<p id="msg"></p>

</div>

<script>

async function submitTicket(){

const name = document.getElementById("name").value.trim();
const email = document.getElementById("email").value.trim();
const issue = document.getElementById("issue").value.trim();
const msg = document.getElementById("msg");

if(!name || !email || !issue){
  msg.innerText = "Please fill all fields.";
  return;
}

msg.innerText = "Submitting ticket...";

try {
  const response = await fetch(
    "https://godomcoworld-backend-testnet.onrender.com/support/tickets",
    {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, email, issue })
    }
  );

  const result = await response.json().catch(() => ({}));

  if(!response.ok){
    throw new Error(result.error || result.message || "Ticket submission failed.");
  }

  msg.innerText = "Ticket submitted successfully. Our team will review it.";
  document.getElementById("name").value = "";
  document.getElementById("email").value = "";
  document.getElementById("issue").value = "";
} catch(error) {
  console.error("Support ticket submission failed:", error);
  msg.innerText = "Could not submit your ticket. Please try again later.";
}

}

</script>

<script src="js/dev-console.js"></script>
</body>
</html>
