<!DOCTYPE html>
<html>
<head>
<title>Revenue Dashboard</title>
</head>

<body>

<h2>📊 Seller Earnings</h2>

<h3 id="user"></h3>
<h1 id="earnings">₦0</h1>
<script>

async function loadEarnings(){

  let user = localStorage.getItem("piUser");

  const res = await fetch('http://127.0.0.1:3000/sellers');
  const data = await res.json();

  let earnings = data.sellers[user] || 0;

  document.getElementById("earnings").innerText =
    "₦" + earnings.toFixed(2);

}

window.onload = loadEarnings;

</script>

</body>
</html>
