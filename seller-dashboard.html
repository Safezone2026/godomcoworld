<!DOCTYPE html>
<html>
<head>
<title>Revenue Dashboard</title>
</head>

<body>

<h2>📊 Seller Earnings</h2>

<h3 id="user"></h3>
<h1 id="earnings">₦0</h1>

<script>

let currentUser = localStorage.getItem("piUser");

document.getElementById("user").innerText =
  "User: " + currentUser;

let sellers = JSON.parse(localStorage.getItem("sellers")) || {};

let earnings = sellers[currentUser] || 0;

document.getElementById("earnings").innerText =
  "₦" + earnings.toFixed(2);

</script>

</body>
</html>
