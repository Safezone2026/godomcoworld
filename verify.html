<!DOCTYPE html>
<html>
<head>
<title>Verify Certificate</title>
</head>

<link rel="stylesheet" href="../css/style.css">
<body>

<h2>Verify Certificate</h2>

<input type="text" id="certInput" placeholder="Enter Certificate ID">
<button onclick="verifyCert()">Verify</button>

<div id="result"></div>

<script>
// AUTO GET ID FROM URL
let params = new URLSearchParams(window.location.search);
let idFromURL = params.get("id");

if(idFromURL){
document.getElementById("certInput").value = idFromURL;
verifyCert();
}

function verifyCert(){

let id = document.getElementById("certInput").value;

let data = localStorage.getItem("cert_" + id);

if(data){
let cert = JSON.parse(data);

document.getElementById("result").innerHTML = `
✅ Valid Certificate<br>
Name: ${cert.name}<br>
Course: ${cert.course}<br>
Date: ${cert.date}
`;
}else{
document.getElementById("result").innerHTML = "❌ Invalid Certificate";
}
  }
</script>

</body>
</html>
