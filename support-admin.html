<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Godomcoworld Support Admin</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 16px;
      background: #0d0d0d;
      color: #fff;
    }
    .portal-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }
    .back-link {
      display: inline-block;
      padding: 10px 14px;
      background: #2563eb;
      color: #fff;
      text-decoration: none;
      border-radius: 7px;
      font-weight: bold;
    }
    .card {
      border: 1px solid #444;
      padding: 12px;
      margin: 12px 0;
      background: #1a1a1a;
      color: #fff;
      border-radius: 8px;
      overflow-wrap: anywhere;
    }
    button, input, select, textarea {
      max-width: 100%;
      box-sizing: border-box;
    }
    textarea {
      background: #222;
      color: #fff;
      border: 1px solid #555;
      border-radius: 6px;
      padding: 10px;
    }
  </style>
</head>
<body>

<header class="portal-header">
  <div>
    <h1>🎫 Support Portal</h1>
    <p>Customer tickets and conversations</p>
  </div>
  <a class="back-link" href="admin.html">← Back to Admin Dashboard</a>
</header>

<button type="button" onclick="loadSupportTickets()">🔄 Refresh tickets</button>
<div id="supportTicketsList" class="card">Checking admin session...</div>

<script>
const API = "/api";

// Support ticket administration: Testnet backend
function escapeTicketText(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;",
    '"': "&quot;", "'": "&#39;"
  })[c]);
}

async function loadSupportTickets() {
  const box = document.getElementById("supportTicketsList");
  if (!box) return;
  box.textContent = "Loading support tickets...";

  try {
    const res = await fetch(API + "/admin/support-tickets", {
      credentials: "include"
    });

    if (res.status === 401 || res.status === 403) {
      box.textContent = "Admin session expired. Please sign in again.";
      return;
    }
    if (!res.ok) throw new Error("Could not load tickets.");

    const payload = await res.json();
    const tickets = Array.isArray(payload) ? payload : payload.tickets;

    if (!Array.isArray(tickets) || tickets.length === 0) {
      box.textContent = "No support tickets yet.";
      return;
    }

    box.innerHTML = tickets.map(t => {
      const id = escapeTicketText(t.id);
      const statuses = ["open", "in_progress", "resolved", "closed"];
      const messages = Array.isArray(t.messages) ? t.messages : [];
      const unread = messages.filter(m =>
        m.sender_type === "customer" && !m.read_at
      ).length;

      return `<div class="card">
        <strong>${escapeTicketText(t.name)}</strong> —
        ${escapeTicketText(t.email)}<br>
        ${unread ? `<strong style="color:#ffb74d">New customer messages: ${unread}</strong><br>` : ""}
        <strong>Issue:</strong>
        <div style="white-space:pre-wrap">${escapeTicketText(t.issue)}</div>
        <small>Created: ${escapeTicketText(t.created_at || "")}</small><br>

        <strong>Screenshots:</strong>
        <div style="display:flex;flex-wrap:wrap;gap:10px;margin:8px 0">
          ${(Array.isArray(t.attachments) ? t.attachments : []).map(a => {
            if (!a || !a.signed_url) {
              return `<span class="hint">${escapeTicketText(a && a.name || "Attachment unavailable")}</span>`;
            }
            const url = escapeTicketText(a.signed_url);
            const label = escapeTicketText(a.name || "Screenshot");
            return `<a href="${url}" target="_blank" rel="noopener noreferrer" style="display:block;max-width:150px">
              <img src="${url}" alt="${label}" style="display:block;width:140px;height:100px;object-fit:contain;background:#111;border:1px solid #555;border-radius:6px">
              <span>${label}</span>
            </a>`;
          }).join("") || "<span>No screenshots attached.</span>"}
        </div>

        <strong>Conversation:</strong>
        <div style="background:#111;padding:10px;border-radius:8px;margin:8px 0">
          ${messages.length ? messages.map(m => `
            <div style="border-bottom:1px solid #444;padding:8px 0">
              <strong>${m.sender_type === "admin" ? "Support team" : "Customer"}</strong>
              <small> — ${escapeTicketText(m.created_at || "")}</small>
              <div style="white-space:pre-wrap;margin-top:5px">${escapeTicketText(m.message)}</div>
            </div>
          `).join("") : "<span>No replies yet.</span>"}
        </div>

        <label>Public reply (visible to customer):<br>
          <textarea id="ticket-reply-${id}" rows="3" maxlength="10000" style="width:100%" placeholder="Write a reply to the customer..."></textarea>
        </label><br>
        <button type="button" onclick="sendSupportReply('${id}')">Send public reply</button>

        <hr style="border-color:#444;margin:14px 0">
        <label>Status:
          <select id="ticket-status-${id}">
            ${statuses.map(st => `<option value="${st}" ${t.status === st ? "selected" : ""}>${st}</option>`).join("")}
          </select>
        </label><br>
        <label>Private admin notes (not visible to customer):<br>
          <textarea id="ticket-notes-${id}" rows="3" style="width:100%">${escapeTicketText(t.admin_notes || "")}</textarea>
        </label><br>
        <button type="button" onclick="saveSupportTicket('${id}')">Save ticket</button>
      </div>`;
    }).join("");
  } catch (error) {
    console.error("Support tickets:", error);
    box.textContent = "Could not load support tickets.";
  }
}

async function sendSupportReply(id) {
  const field = document.getElementById("ticket-reply-" + id);
  const message = field ? field.value.trim() : "";

  if (!message) {
    alert("Please enter a reply first.");
    return;
  }

  try {
    const res = await fetch(
      API + "/admin/support-tickets/" + encodeURIComponent(id) + "/replies",
      {
        method: "POST",
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message })
      }
    );

    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      throw new Error(data.error || data.message || "Could not send reply.");
    }

    alert("Public reply sent successfully.");
    await loadSupportTickets();
  } catch (error) {
    alert(error.message || "Could not send reply.");
  }
}

async function saveSupportTicket(id) {
  const status = document.getElementById("ticket-status-" + id).value;
  const admin_notes = document.getElementById("ticket-notes-" + id).value;

  try {
    const res = await fetch(API + "/admin/support-tickets/" + encodeURIComponent(id), {
      method: "PATCH",
      credentials: "include",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ status, admin_notes })
    });

    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      throw new Error(data.error || data.message || "Could not update ticket.");
    }

    alert("Support ticket updated.");
    await loadSupportTickets();
  } catch (error) {
    alert(error.message || "Could not update support ticket.");
  }
}

document.addEventListener("DOMContentLoaded", () => {
  loadSupportTickets();
});
</script>

<script src="js/dev-console.js"></script>
</body>
</html>
