<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Transaction History - Godomcoworld</title>
<link rel="stylesheet" href="css/style.css">

<style>
.card{
  background:#111;
  color:white;
  padding:15px;
  margin:10px 0;
  border-radius:10px;
}
.success{
  color:#00e676;
}
.empty{
  text-align:center;
  margin-top:40px;
  color:gray;
}
</style>

</head>

<body>

<header>
<h1>🧾 Transaction History</h1>
</header>

<main>

<div id="historyContainer"></div>

</main>

<script>

async function loadHistory(){

  try {

    const res = await fetch('http://127.0.0.1:3000/orders');
    const data = await res.json();

    let container = document.body;
    container.innerHTML = "<h2>🧾 Transaction History</h2>";

    data.orders.forEach(order => {

      let items = order.items.map(i => i.name).join(", ");

      container.innerHTML += `
        <div>
          <h3>${order.user}</h3>
          <p>${items}</p>
          <p>₦${order.total}</p>
          <p>${order.method}</p>
          <small>${order.date}</small>
          <hr>
        </div>
      `;
    });

  } catch(err){
    alert("Failed to load history");
  }
}

window.onload = loadHistory;

</script>
