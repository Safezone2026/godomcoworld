<script src="js/network.js"></script>
<script>
"use strict";
// activity-center-repair-v1

const timeline = document.getElementById("timeline");
const welcomeText = document.getElementById("welcomeText");
const searchInput = document.getElementById("searchActivity");

const username =
    localStorage.getItem("username") ||
    localStorage.getItem("piUsername") || "";

const network =
    localStorage.getItem("walletNetwork") ||
    localStorage.getItem("network") ||
    "testnet";

let allActivities = [];
let activeFilter = "all";

welcomeText.textContent = username
    ? `Hello, ${username} 👋`
    : "Welcome 👋";

function showMessage(message) {
    timeline.replaceChildren();
    const box = document.createElement("div");
    box.className = "empty";
    box.textContent = message;
    timeline.appendChild(box);
}

function makeText(label, value) {
    const paragraph = document.createElement("p");
    const strong = document.createElement("strong");
    strong.textContent = label + ": ";
    paragraph.append(strong, document.createTextNode(String(value ?? "—")));
    return paragraph;
}

function formatDate(value) {
    if (!value) return "Date unavailable";
    const date = new Date(value);
    return Number.isNaN(date.getTime())
        ? "Date unavailable"
        : date.toLocaleString();
}

function createActivityCard(activity) {
    const card = document.createElement("article");
    card.className = "activity-card";

    const heading = document.createElement("h3");
    heading.textContent = activity.title;
    card.appendChild(heading);

    activity.details.forEach(([label, value]) => {
        card.appendChild(makeText(label, value));
    });

    const date = document.createElement("p");
    date.textContent = "Date: " + formatDate(activity.date);
    card.appendChild(date);

    if (activity.receiptId || activity.transactionId || activity.orderId) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "receipt-btn";
        button.textContent = "📄 Download Receipt";

        button.addEventListener("click", async () => {
            if (typeof window.downloadReceipt !== "function") {
                alert("Receipt service is unavailable. Please refresh and try again.");
                return;
            }

            button.disabled = true;
            button.textContent = "Preparing receipt…";

            try {
                await window.downloadReceipt({
                    username,
                    receiptId: activity.receiptId,
                    transactionId: activity.transactionId,
                    orderId: activity.orderId
                });
            } catch (error) {
                console.error("Receipt error:", error);
                alert("Could not prepare this receipt. Please try again.");
            } finally {
                button.disabled = false;
                button.textContent = "📄 Download Receipt";
            }
        });

        card.appendChild(button);
    }

    return card;
}

function renderActivities() {
    timeline.replaceChildren();

    const keyword = searchInput.value.trim().toLowerCase();
    const statusValue = document.getElementById("activityStatus").value;
    const dateValue = document.getElementById("activityDate").value;

    const activities = allActivities.filter(activity => {
        const categoryMatches =
            activeFilter === "all" || activity.category === activeFilter;

        const statusMatches =
            statusValue === "all" || activity.status === statusValue;

        const dateMatches =
            !dateValue ||
            (activity.date && String(activity.date).slice(0, 10) === dateValue);

        const searchable = [
            activity.title,
            activity.category,
            activity.status,
            ...activity.details.flat()
        ].join(" ").toLowerCase();

        return categoryMatches &&
            statusMatches &&
            dateMatches &&
            searchable.includes(keyword);
    });

    if (!activities.length) {
        showMessage("📭 No matching activity found.");
        return;
    }

    activities.forEach(activity => {
        timeline.appendChild(createActivityCard(activity));
    });
}

async function loadHistory() {
    if (!username) {
        showMessage("Please sign in with Pi to view your activity.");
        return;
    }

    if (network !== "testnet") {
        showMessage("This Activity Center is for Testnet. Switch to your Testnet session and try again.");
        return;
    }

    showMessage("Loading activity…");

    try {
        const api = "https://godomcoworld-backend-testnet.onrender.com";
        const url =
            `${api}/history/${encodeURIComponent(username)}?network=testnet`;

        const response = await fetch(url);

        if (!response.ok) {
            throw new Error(`The server returned HTTP ${response.status}.`);
        }

        const data = await response.json();
        const orders = Array.isArray(data.orders) ? data.orders : [];
        const transactions =
            Array.isArray(data.transactions) ? data.transactions : [];

        document.getElementById("orderCount").textContent = orders.length;
        document.getElementById("walletCount").textContent = transactions.length;
        document.getElementById("swapCount").textContent =
            transactions.filter(t =>
                String(t.type || "").toLowerCase() === "swap"
            ).length;
        document.getElementById("deliveryCount").textContent =
            orders.filter(o =>
                String(o.status || "").toLowerCase() === "delivered"
            ).length;

        allActivities = [];

        orders.forEach(order => {
            const orderId = order.order_id || order.id || "";
            const status = String(order.status || "unknown").toLowerCase();

            allActivities.push({
                category: status === "delivered" ? "delivery" : "orders",
                title: "📦 Order",
                date: order.created_at || order.date || "",
                status,
                orderId,
                receiptId: order.receipt_id || "",
                transactionId: "",
                details: [
                    ["Order ID", orderId || "Unavailable"],
                    ["Status", order.status || "Unknown"],
                    ["Total", "₦" + Number(order.total || 0).toLocaleString()]
                ]
            });
        });

        transactions.forEach(transaction => {
            const type = String(transaction.type || "wallet").toLowerCase();
            const transactionId =
                transaction.transaction_id || transaction.id || "";

            allActivities.push({
                category: type === "swap" ? "swap" : "wallet",
                title: type === "swap"
                    ? "🔄 Swap Transaction"
                    : "💸 Wallet Transaction",
                date: transaction.created_at || transaction.date || "",
                status: String(transaction.status || "completed").toLowerCase(),
                orderId: "",
                receiptId: transaction.receipt_id || "",
                transactionId,
                details: [
                    ["Transaction ID", transactionId || "Unavailable"],
                    ["Type", transaction.type || "Wallet"],
                    ["Amount",
                        Number(transaction.amount || 0).toLocaleString() +
                        " " + (transaction.currency || "")],
                    ["Status", transaction.status || "Completed"]
                ]
            });
        });

        allActivities.sort((a, b) =>
            new Date(b.date || 0) - new Date(a.date || 0)
        );

        renderActivities();
    } catch (error) {
        console.error("Activity Center load failed:", error);
        showMessage("Unable to load activity. Check your connection and select Refresh to try again.");
    }
}

searchInput.addEventListener("input", renderActivities);

document.querySelectorAll(".tabs button").forEach(button => {
    button.addEventListener("click", () => {
        document.querySelectorAll(".tabs button").forEach(tab => {
            tab.classList.remove("active");
        });

        button.classList.add("active");
        activeFilter = button.dataset.filter;
        renderActivities();
    });
});

document.getElementById("activityStatus")
    .addEventListener("change", renderActivities);

document.getElementById("activityDate")
    .addEventListener("change", renderActivities);

document.getElementById("clearActivityFilters").addEventListener("click", () => {
    searchInput.value = "";
    document.getElementById("activityStatus").value = "all";
    document.getElementById("activityDate").value = "";
    activeFilter = "all";

    document.querySelectorAll(".tabs button").forEach(tab => {
        tab.classList.toggle("active", tab.dataset.filter === "all");
    });

    renderActivities();
});

document.getElementById("refreshActivity")
    .addEventListener("click", loadHistory);

loadHistory();
</script>
