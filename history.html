<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Transaction History - Godomcoworld</title>
<link rel="stylesheet" href="css/style.css">

<style>
.card{
  background:#111;
  color:white;
  padding:15px;
  margin:10px 0;
  border-radius:10px;
}
.success{
  color:#00e676;
}
.empty{
  text-align:center;
  margin-top:40px;
  color:gray;
}
</style>

</head>

<body>

<header>
<h1>🧾 Transaction History</h1>
</header>

<main>

<div id="historyContainer"></div>

</main>

<script>

async function loadHistory(){
  try {

    const res = await fetch('http://127.0.0.1:3000/orders');

    console.log("STATUS:", res.status);

    const text = await res.text();
    console.log("RAW RESPONSE:", text);

    const data = JSON.parse(text);

    console.log("PARSED:", data);

    let container = document.getElementById("productList") || document.body;
    container.innerHTML = "<h2>🧾 Transaction History</h2>";

    data.orders.forEach(order => {
      container.innerHTML += `
        <div>
          <p>${order.user}</p>
          <p>₦${order.total}</p>
        </div>
      `;
    });

  } catch(err){
    console.error("FULL ERROR:", err);
    alert("Failed to load history");
  }
}

window.onload = loadHistory;

</script>
