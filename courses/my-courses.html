<!DOCTYPE html>
<html>
<head>
  <title>My Courses</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body { background:#0d0d0d; color:white; font-family:Arial; padding:20px; }
    .card {
      background:#1a1a1a;
      padding:15px;
      margin:10px 0;
      border-radius:8px;
    }
    a {
      color:#4CAF50;
      text-decoration:none;
    }
  </style>
</head>
<body>

<h2>📚 My Courses</h2>

<div id="myCourses"></div>

<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<script>
(async function () {
  const container = document.getElementById("myCourses");
  container.textContent = "Connecting to Pi Network Testnet...";

  try {
    Pi.init({version:"2.0", sandbox:true});

    const auth = await Pi.authenticate(["username"], () => {});

    if (!auth || !auth.accessToken) {
      throw new Error("Pi authentication was not completed.");
    }

    const response = await fetch(
      "https://godomcoworld-backend-testnet.onrender.com/api/courses/my-subscriptions",
      {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({
          accessToken: auth.accessToken,
          network: "testnet"
        })
      }
    );

    const result = await response.json();

    if (!response.ok || !result.success) {
      throw new Error(result.message || "Subscription lookup failed.");
    }

    container.replaceChildren();

    const subscriptions = Array.isArray(result.subscriptions)
      ? result.subscriptions : [];

    if (!subscriptions.length) {
      container.textContent =
        "No verified active Testnet course subscriptions were found.";
      return;
    }

    subscriptions.forEach(subscription => {
      const card = document.createElement("div");
      card.className = "card";

      const title = document.createElement("h3");
      title.textContent = subscription.course_title ||
        subscription.course_slug || "Course";

      const plan = document.createElement("p");
      plan.textContent = "Plan: " + (subscription.plan_name || "Subscription");

      const status = document.createElement("p");
      status.textContent = "Status: Active (Testnet)";

      const link = document.createElement("a");
      link.href = "topics.html?course=" +
        encodeURIComponent(subscription.course_slug);
      link.textContent = "▶ View Course";

      card.append(title, plan, status, link);
      container.appendChild(card);
    });
  } catch (error) {
    container.textContent = "Unable to load verified courses: " +
      error.message;
  }
})();
</script>

<script src="../js/dev-console.js"></script>
</body>
</html>
