<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Godomcoworld - Dev Sandbox</title>

</head>
<body>
  <!-- Header -->
  <header>
    <h1>Godomcoworld Sandbox</h1>
    <nav>
      <a href="../index.html">Home</a>
      <a href="../learn.html">Learn</a>
      <a href="../course.html">Courses</a>
      <a href="../marketplace.html">Marketplace</a>
      <a href="../finance.html">Finance</a>
      <a href="../dashboard.html">Dashboard</a>
      <a href="../upload.html">Upload</a>
    </nav>
  </header>

  <!-- Main Content -->
  <main>
    <h2>Welcome to Godomcoworld Dev Sandbox</h2>
    <p>This is the sandbox version for Pi SDK testing.</p>

    <button id="pi-login-btn">Connect Pi Wallet</button>

    <section id="sandbox-info">
      <p>Use this page to test courses, marketplace, finance, and upload sections.</p>
    </section>
  </main>

  <!-- Pi SDK -->
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <script>
    // Initialize Pi SDK for Sandbox
    Pi.init({
      version: "2.0",
      sandbox: true,
      apiKey: "qc4ufrjtkej5vt51xmoljidnzyrjfdghxr3mzd8s0h14qf7qybebv6kehyqudl7h",
      walletAddress: "GDJIQMWBMXWMV2R4P4Z2KILJUS7VC4DHWXDT5AELWYNRABUJAHZSGLB2"
    });

    async function connectPi() {
      try {
        const scopes = ['username', 'payments', 'wallet_address'];
        const authResult = await Pi.authenticate(scopes, function(payment) {
          console.log("Payment received:", payment);
        });
        console.log("User authenticated:", authResult);
        const wallet = await Pi.wallet();
        console.log("Wallet connected:", wallet);
      } catch (err) {
        console.error("Pi SDK error:", err);
      }
    }

    // Connect on button click
    document.getElementById("pi-login-btn").addEventListener("click", connectPi);
  </script>

  <!-- Link to JS in root -->
  <script src="../js/script.js"></script>
</body>
  </html>
