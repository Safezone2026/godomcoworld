<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Godomcoworld Payment Test</title>

<link rel="stylesheet" href="style.css">

<script src="https://sdk.minepi.com/pi-sdk.js"></script>

</head>

<body>

<h2>Blockchain Course Payment Test</h2>

<p>Basic Plan</p>
<p class="price">$20 / 0.0000637 π per month</p>

<button onclick="loginPi()">Connect Pi</button>

<button onclick="payCourse()">Pay with Pi</button>

<div id="courseContent" style="display:none; margin-top:20px;">
<h3>Course Unlocked</h3>
<p>Welcome to Blockchain Technology Basic Course.</p>
</div>

<script>

Pi.init({
  version: "2.0",
  sandbox: true
});

let currentUser = null;

// Authenticate user first
async function loginPi(){

  try{

    const scopes = ['username','payments'];

    const auth = await Pi.authenticate(scopes);

    currentUser = auth.user;

    console.log("Logged in:", currentUser.username);

    alert("Connected as: " + currentUser.username);

  }catch(err){

    console.error(err);
    alert("Login failed");

  }

}

// Payment function
function payCourse(){

Pi.createPayment(

{
  amount: 0.0000637,
  memo: "Blockchain Basic Course",
  metadata: { course: "blockchain_basic" }

},

{

onReadyForServerApproval: function(paymentId){
console.log("Approval:", paymentId);
},

onReadyForServerCompletion: function(paymentId, txid){
console.log("Completed:", txid);
alert("Payment successful!");
},

onCancel: function(paymentId){
console.log("Cancelled");
},

onError: function(error){
console.error(error);
alert("Payment error");
}

}

);

}

  </script>

</body>
  </html>
