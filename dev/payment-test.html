<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Godomcoworld Payment Test</title>

<link rel="stylesheet" href="style.css">

<script src="https://sdk.minepi.com/pi-sdk.js"></script>

</head>

<body>

<h2>Blockchain Course Payment Test</h2>

<p>Basic Plan</p>
<p class="price">$20 / 0.0000637 π per month</p>

<button onclick="loginPi()">Connect Pi</button>
<button onclick="payCourse()">Pay with Pi</button>

<p id="result"></p>

<div id="courseContent" style="display:none; margin-top:20px;">
<h3>Course Unlocked</h3>
<p>Welcome to Blockchain Technology Basic Course.</p>
</div>

<script>

Pi.init({
  version: "2.0",
  sandbox: true,
  apiKey: "qc4ufrjtkej5vt51xmoljidnzyrjfdghxr3mzd8s0h14qf7qybebv6kehyqudl7h"
});

async function loginPi(){

  try{

    const scopes = ['username','payments','wallet_address'];

    const auth = await Pi.authenticate(scopes);

    document.getElementById("result").innerHTML =
    "Connected as: " + auth.user.username;

  }

  catch(err){

    document.getElementById("result").innerHTML = "Login failed";

    console.log(err);

  }

}

function payCourse(){

Pi.createPayment(

{
  amount:0.0000637,
  memo:"Blockchain Basic Course",
  metadata:{course:"blockchain_basic"}
},

{

onReadyForServerApproval:function(paymentId){

console.log("Approve payment:",paymentId);

/* Simulate server approval */
setTimeout(function(){

console.log("Payment approved (sandbox)");

},1000);

},

onReadyForServerCompletion:function(paymentId,txid){

console.log("Payment completed:",txid);

alert("Payment successful");

document.getElementById("courseContent").style.display="block";

},

onCancel:function(paymentId){

console.log("Payment cancelled");

},

onError:function(error){

console.error(error);

}

}

);

}

</script>

</body>
  </html>
