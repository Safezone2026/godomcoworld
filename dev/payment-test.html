<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Godomcoworld Payment Test</title>

<link rel="stylesheet" href="style.css">

<script src="https://sdk.minepi.com/pi-sdk.js"></script>

</head>

<body>

<h2>Blockchain Course Payment Test</h2>

<p>Basic Plan</p>
<p class="price">$20 / 0.0000637 π per month</p>

<button id="payBtn">Pay with Pi</button>

<div id="courseContent" style="display:none; margin-top:20px;">
<h3>Course Unlocked</h3>
<p>Welcome to Blockchain Technology Basic Course.</p>
</div>

<script src="https://sdk.minepi.com/pi-sdk.js"></script>

<script>

Pi.init({
  version: "2.0",
  sandbox: true
});

const priceUSD = 20;
const pricePi = priceUSD / 314159;

function payCourse(){

Pi.createPayment(
  {
    amount: pricePi,
    memo: "Blockchain Basic Course",
    metadata: { course: "blockchain_basic" }
  },

  {

    onReadyForServerApproval: function(paymentId){
      console.log("Ready for approval:", paymentId);
    },

    onReadyForServerCompletion: function(paymentId, txid){
      console.log("Ready for completion:", paymentId, txid);
      alert("Payment successful!");
      document.getElementById("courseContent").style.display="block";
    },

    onCancel: function(paymentId){
      console.log("Payment cancelled", paymentId);
    },

    onError: function(error){
      console.error(error);
      alert("Payment error occurred");
    }

  }

);

}

document.getElementById("payBtn").addEventListener("click", payCourse);

</script>

</body>
  </html>
