<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload Product - Godomcoworld Marketplace</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header>
  <div class="logo">Upload Product</div>
  <a href="../marketplace.html"><button>Back</button></a>
</header>

<div class="container">
  <h2>Upload Your Product</h2>

  <input type="text" id="productName" placeholder="Product Name"><br><br>
  <textarea id="productDesc" placeholder="Product Description"></textarea><br><br>
  
  <label>Product Image:</label>
  <input type="file" id="productImage" accept="image/*"><br><br>
  
  <input type="number" id="productPrice" placeholder="Price (USD)"><br><br>
  
  <button onclick="uploadProduct()">Upload Product</button>
 <script>

function uploadProduct(){

  let name = document.getElementById("name").value;
  let price = document.getElementById("price").value;
  let file = document.getElementById("image").files[0];

  let sellerUsername = localStorage.getItem("piUser") || "seller1";

  if(!name || !price || !file){
    alert("Fill all fields including image");
    return;
  }

  let reader = new FileReader();

  reader.onload = function(){

    let base64Image = reader.result;

    fetch('http://127.0.0.1:3000/products', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name,
        price: Number(price),
        sellerUsername,
        image: base64Image // 🔥 IMAGE SAVED HERE
      })
    })
    .then(res => res.json())
    .then(data => {
      alert("Product uploaded with image!");
      window.location.href = "products.html";
    })
    .catch(err => {
      console.error(err);
      alert("Upload failed");
    });

  };

  reader.readAsDataURL(file); // 🔥 converts to base64
}

 </script> 

</body>
</html>
<a href="../marketplace.html">
<button>Back to Marketplace</button>
</a>
</body>
</html>
