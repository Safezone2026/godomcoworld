<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Upload Product</title>
  <script>

function registerSeller(){

const business = document.getElementById("business").value;
const owner = document.getElementById("owner").value;

if(business === "" || owner === ""){

alert("Please fill all fields");

return;

}

localStorage.setItem("seller_registered","true");
localStorage.setItem("seller_business",business);

alert("Seller registration successful");

window.location.href="seller-register.html";

}

  </script>

<link rel="stylesheet" href="../css/style.css">

</head>

<body>

<header>

<div class="logo">Upload Product</div>

<a href="index.html">
<button>Back</button>
</a>

</header>

<div class="container">

<h2>Upload Product</h2>

<input type="text" id="productName" placeholder="Product Name"><br><br>

<input type="text" id="productPrice" placeholder="Price ($)"><br><br>

<input type="file" id="productImage"><br><br>

<textarea id="productDesc" placeholder="Product Description"></textarea><br><br>

<button onclick="uploadProduct()">Upload Product</button>

</form>

</div>
<script>

function uploadProduct(){

let name = document.getElementById("productName").value;
let price = document.getElementById("productPrice").value;
let desc = document.getElementById("productDesc").value;

let fileInput = document.getElementById("productImage");
let file = fileInput.files[0];

if(!file){
alert("Please select an image");
return;
}

let reader = new FileReader();

reader.onload = function(){

let imageBase64 = reader.result;

let products = JSON.parse(localStorage.getItem("products")) || [];

products.push({
name:name,
price:price,
desc:desc,
image:imageBase64
});

localStorage.setItem("products", JSON.stringify(products));

alert("Product uploaded successfully");

window.location.href = "products.html";

};

reader.readAsDataURL(file);

}

</script>
<a href="../marketplace.html">
<button>Back to Marketplace</button>
</a>
</body>
</html>
