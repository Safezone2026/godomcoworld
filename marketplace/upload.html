<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Upload Product</title>
  <script>

function registerSeller(){

const business = document.getElementById("business").value;
const owner = document.getElementById("owner").value;

if(business === "" || owner === ""){

alert("Please fill all fields");

return;

}

localStorage.setItem("seller_registered","true");
localStorage.setItem("seller_business",business);

alert("Seller registration successful");

window.location.href="seller-register.html";

}

  </script>

<link rel="stylesheet" href="../css/style.css">

</head>

<body>

<header>

<div class="logo">Upload Product</div>

<a href="index.html">
<button>Back</button>
</a>

</header>

<div class="container">

<h2>Upload Product</h2>

<form>

<input type="text" placeholder="Product Name" required><br><br>

<input type="text" placeholder="Price ($)" required><br><br>

<input type="file" accept="image/*"><br><br>

<textarea placeholder="Product Description"></textarea><br><br>

<button onclick="registerSeller()">Register</button>

</form>

</div>
<a href="../marketplace.html">
<button>Back to Marketplace</button>
</a>
</body>
</html>
