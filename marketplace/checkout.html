<script>
  let currentUser = localStorage.getItem("username") || prompt("Enter your username (e.g seller1)");

// Testnet checkout amounts are calculated by the backend, not by frontend
// exchange-rate arithmetic. Mainnet keeps its existing calculation path.
async function getTestnetCheckoutQuote(cart, address, country) {
  const response = await fetch(
    "https://godomcoworld-backend-testnet.onrender.com/api/checkout/calculate",
    {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        cart,
        address: address || "",
        country: country || "",
        network: "testnet"
      })
    }
  );

  let data;
  try {
    data = await response.json();
  } catch (_) {
    throw new Error("Invalid response from the Testnet checkout service.");
  }

  if (!response.ok || !data || data.success !== true) {
    throw new Error(data && data.message
      ? data.message
      : "Unable to calculate the Testnet checkout total.");
  }

  for (const key of ["subtotal", "deliveryFee", "total"]) {
    if (!Number.isFinite(Number(data[key])) || Number(data[key]) < 0) {
      throw new Error("Invalid amount returned by the checkout service.");
    }
  }

  if (!Array.isArray(data.items)) {
    throw new Error("The checkout service did not return priced cart items.");
  }

  return data;
}

// Migrate legacy NGN Cart entries before requesting the Testnet quote.
async function migrateLegacyCheckoutCart() {
  const cart = JSON.parse(localStorage.getItem("cart") || "[]");
  if (!Array.isArray(cart) || !cart.length) return;

  if (!cart.some(item =>
    item && ["NGN", "₦", "NAIRA"].includes(
      String(item.currency || "").trim().toUpperCase()
    )
  )) return;

  const response = await fetch(
    "https://godomcoworld-backend-testnet.onrender.com/exchange-rates"
  );
  const data = await response.json();
  const nairaToUSD = Number(data?.rates?.NG?.rate);
  const piRate = nairaToUSD * 314159;

  if (!response.ok || !data.success ||
      !Number.isFinite(piRate) || piRate <= 0) {
    throw new Error("Unable to convert legacy Cart prices to Pi.");
  }

  let changed = false;
  for (const item of cart) {
    if (!item || typeof item !== "object") continue;
    const currency = String(item.currency || "").trim().toUpperCase();
    if (!["NGN", "₦", "NAIRA"].includes(currency)) continue;

    const originalPrice = Number(item.price);
    if (!Number.isFinite(originalPrice) || originalPrice < 0) {
      throw new Error("Invalid legacy Cart price.");
    }

    item.originalPrice = originalPrice;
    item.originalCurrency = currency;
    item.price = originalPrice / piRate;
    item.pricePi = item.price;
    item.currency = "PI";
    changed = true;
  }

  if (changed) localStorage.setItem("cart", JSON.stringify(cart));
}

// ================= LOAD CART =================
async function loadCart() {
  const container = document.getElementById("cartItems");
  try {
    await migrateLegacyCheckoutCart();
  } catch (error) {
    if (container) {
      container.textContent = error.message || "Unable to migrate Cart prices.";
    }
    console.error(error);
    return;
  }

  const cart = JSON.parse(localStorage.getItem("cart") || "[]");
  if (!container) return;

  if (!Array.isArray(cart) || cart.length === 0) {
    container.textContent = "Your cart is empty.";
    window.testnetCheckoutQuote = null;
    window.totalPi = 0;
    return;
  }

  try {
    const address = document.getElementById("address")?.value?.trim() || "";
    const country = document.getElementById("country")?.value?.trim() || "";
    const hasDeliveryDetails = address.length >= 5 && country.length > 0;
    container.textContent = "Calculating Testnet prices…";

    const quote = await getTestnetCheckoutQuote(cart, address, country);
    window.testnetCheckoutQuote = hasDeliveryDetails ? quote : null;
    window.totalPi = hasDeliveryDetails ? Number(quote.total) : 0;
    container.replaceChildren();

    for (const item of quote.items) {
      const row = document.createElement("div");
      const title = document.createElement("h4");
      const price = document.createElement("p");
      title.textContent = item.name || item.product || "Product";
      price.textContent =
        Number(item.lineTotalPi ?? item.pricePi).toFixed(8) + " π";
      row.append(title, price);
      container.appendChild(row);
    }

    const subtotal = document.getElementById("subtotal");
    if (subtotal) subtotal.textContent = Number(quote.subtotal).toFixed(8) + " π";

    const delivery = document.getElementById("deliveryFee");
    if (delivery) delivery.textContent = hasDeliveryDetails
      ? Number(quote.deliveryFee).toFixed(8) + " π"
      : "Enter delivery details";

    const total = document.getElementById("total");
    if (total) total.textContent = hasDeliveryDetails
      ? Number(quote.total).toFixed(8) + " π"
      : "Pending delivery calculation";

    const piTotal = document.getElementById("piTotal");
    if (piTotal) piTotal.textContent = hasDeliveryDetails
      ? Number(quote.total).toFixed(8) + " π"
      : "Pending delivery calculation";
  } catch (error) {
    window.testnetCheckoutQuote = null;
    window.totalPi = 0;
    container.textContent = error.message || "Testnet price calculation failed.";
    console.error(error);
  }
}

function requestMaskedTransactionPin(message) {
  return new Promise((resolve) => {
    const overlay = document.createElement("div");
    overlay.style.cssText = [
      "position:fixed",
      "inset:0",
      "z-index:99999",
      "display:flex",
      "align-items:center",
      "justify-content:center",
      "background:rgba(0,0,0,.7)",
      "padding:20px"
    ].join(";");

    const dialog = document.createElement("div");
    dialog.style.cssText = [
      "width:100%",
      "max-width:360px",
      "padding:24px",
      "border-radius:12px",
      "background:#fff",
      "color:#222",
      "box-shadow:0 8px 32px rgba(0,0,0,.3)"
    ].join(";");

    const title = document.createElement("h3");
    title.textContent = message;

    const input = document.createElement("input");
    input.type = "password";
    input.inputMode = "numeric";
    input.autocomplete = "current-password";
    input.maxLength = 6;
    input.placeholder = "Enter 4–6 digit PIN";
    input.setAttribute("aria-label", "Transaction PIN");
    input.style.cssText =
      "box-sizing:border-box;width:100%;padding:12px;" +
      "font-size:20px;letter-spacing:6px;margin:12px 0;";

    const error = document.createElement("p");
    error.style.cssText = "color:#c00;min-height:20px;margin:4px 0;";

    const buttons = document.createElement("div");
    buttons.style.cssText =
      "display:flex;gap:10px;justify-content:flex-end;margin-top:12px;";

    const cancel = document.createElement("button");
    cancel.type = "button";
    cancel.textContent = "Cancel";

    const verify = document.createElement("button");
    verify.type = "button";
    verify.textContent = "Verify PIN";

    buttons.append(cancel, verify);
    dialog.append(title, input, error, buttons);
    overlay.appendChild(dialog);
    document.body.appendChild(overlay);

    let finished = false;

    function close(value) {
      if (finished) return;
      finished = true;
      document.removeEventListener("keydown", onKeydown);
      overlay.remove();
      resolve(value);
    }

    function onKeydown(event) {
      if (event.key === "Escape") {
        close(null);
      } else if (event.key === "Enter") {
        submit();
      }
    }

    function submit() {
      const pin = input.value;
      if (!/^\d{4,6}$/.test(pin)) {
        error.textContent = "Enter a PIN containing 4 to 6 digits.";
        input.focus();
        return;
      }
      close(pin);
    }

    input.addEventListener("input", () => {
      input.value = input.value.replace(/\D/g, "").slice(0, 6);
      error.textContent = "";
    });

    cancel.addEventListener("click", () => close(null));
    verify.addEventListener("click", submit);
    overlay.addEventListener("click", (event) => {
      if (event.target === overlay) close(null);
    });
    document.addEventListener("keydown", onKeydown);

    input.focus();
  });
}

async function checkPaymentAccess(method){
  window.checkoutAuthorizationToken = null;
  window.checkoutAuthorizationWalletId = null;
  window.checkoutAuthorizationNetwork = null;

  const network = getWalletNetwork();
  const walletId = localStorage.getItem("walletId_" + network);

  if (!walletId) {
    alert("Wallet not initialized.");
    return false;
  }

  try {
    const statusRes = await fetch(
      "https://godomcoworld-backend-testnet.onrender.com/wallet/security/status/" +
      encodeURIComponent(walletId) +
      "?network=" + encodeURIComponent(network)
    );
    const statusData = await statusRes.json();

    if (!statusRes.ok) {
      alert(statusData.message || "Could not check Transaction PIN status.");
      return false;
    }

    if (!statusData.pinSet) {
      alert("Please set your Transaction PIN before making this payment.");
      return false;
    }

    if (statusData.locked) {
      alert("Transaction PIN is locked until " +
        new Date(statusData.lockedUntil).toLocaleString());
      return false;
    }

    const pin = await requestMaskedTransactionPin(
      "Enter your Transaction PIN to pay for this order:"
    );
    if (pin === null) return false;

    if (!/^\d{4,6}$/.test(pin)) {
      alert("PIN must contain 4 to 6 digits.");
      return false;
    }

    const verifyRes = await fetch(
      "https://godomcoworld-backend-testnet.onrender.com/wallet/security/verify-pin",
      {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          walletId: walletId,
          network: network,
          pin: pin
        })
      }
    );

    const verifyData = await verifyRes.json();

    if (!verifyRes.ok || !verifyData.success ||
        !verifyData.authorizationToken) {
      alert(verifyData.message || "Transaction PIN verification failed.");
      return false;
    }

    window.checkoutAuthorizationToken = verifyData.authorizationToken;
    window.checkoutAuthorizationWalletId = walletId;
    window.checkoutAuthorizationNetwork = network;
    return true;
  } catch (error) {
    console.error("Transaction PIN authorization failed:", error);
    alert("Could not verify your Transaction PIN. Please try again.");
    return false;
  }
}
// ================= PAYMENT =================
async function payWithPi(){
  const allowed = await checkPaymentAccess("Pi");
  if(!allowed) return;

  completeCheckout("Pi"); // ✅ method passed
}

async function completeCheckout(method){
  console.log("Checkout started with:", method);

  const cart = JSON.parse(localStorage.getItem("cart")) || [];

  try {

    const checkoutNetwork = getWalletNetwork();
    if (String(checkoutNetwork).toLowerCase() === "testnet") {
      const checkoutAddress = document.getElementById("address")?.value?.trim() || "";
      const checkoutCountry = document.getElementById("country")?.value?.trim() || "";
      const checkoutQuote = await getTestnetCheckoutQuote(
        cart, checkoutAddress, checkoutCountry
      );
      window.testnetCheckoutQuote = checkoutQuote;
      window.totalPi = Number(checkoutQuote.total);
    }

    const amount = Number(window.totalPi);
    const currency = "PI";

    if (!Number.isFinite(amount) || amount <= 0) {
      alert("Please calculate the delivery fee before paying.");
      return;
    }

    const currentNetwork =
  getWalletNetwork();

const walletId =
  localStorage.getItem(
    "walletId_" + currentNetwork
  );



    const payRes = await fetch("https://godomcoworld-backend-testnet.onrender.com/wallet/pay", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
  body: JSON.stringify({
  walletId,
  amount,
  currency,
  type: "product",
  network: currentNetwork,
  authorizationToken:
    window.checkoutAuthorizationWalletId === walletId &&
    window.checkoutAuthorizationNetwork === currentNetwork
      ? window.checkoutAuthorizationToken
      : null
})
    });

    const payData = await payRes.json();

    if(!payData.success){
      alert(payData.message);
      return;
    }

    const shipmentRes = await fetch('https://godomcoworld-backend-testnet.onrender.com/logistics/create');
    const shipmentData = await shipmentRes.json();

    const orderId = shipmentData.orderId;

    const buyerName =
      document.getElementById("buyerName")?.value?.trim() || "";

    const phone =
      document.getElementById("phone")?.value?.trim() || "";

    const email =
      document.getElementById("email")?.value?.trim() || "";

    const address =
      document.getElementById("address")?.value?.trim() || "";

    const houseAddress =
      document.getElementById("houseAddress")?.value?.trim() || "";

    const city =
      document.getElementById("city")?.value?.trim() || "";

    const state =
      document.getElementById("state")?.value?.trim() || "";

    const country =
      document.getElementById("country")?.value?.trim() || "";

    const lat = Number(localStorage.getItem("deliveryLat") || 0);
    const lng = Number(localStorage.getItem("deliveryLng") || 0);

await fetch('https://godomcoworld-backend-testnet.onrender.com/api/checkout', {
  method: 'POST',
  headers: {'Content-Type':'application/json'},
  body: JSON.stringify({
    method,
    cart,
    orderId,

    // Link the verified wallet payment to this order
    paymentTransactionId: payData.transactionId,
    paymentWalletId: walletId,
    paymentAmount: amount,

    // Buyer details — must match backend orders columns
    buyerName,
    phone,
    email,
    address,
    houseAddress,
    city,
    state,
    country,

    user: localStorage.getItem("username") || "guest",

    // Preserve Mainnet/Testnet isolation
    network: currentNetwork,

    lat,
    lng
})
});

    alert("✅ Payment successful\nOrder ID: " + orderId);

    localStorage.removeItem("cart");
    localStorage.setItem("lastOrderId", orderId);

    setTimeout(() => {
      window.location.href = "/logistics/track.html";
    }, 1500);

  } catch(err){
    console.error(err);
    alert("Payment failed");
  }
}


// ================= ENABLE CALCULATE BUTTON =================
function handleAddressInput(){
  const address = document.getElementById("address").value.trim();
  const country = document.getElementById("country").value;
  const btn = document.getElementById("calcBtn");

  if(!btn) return;

  if(address.length >= 5 && country !== ""){
    btn.disabled = false;
    btn.style.opacity = "1";
  } else {
    btn.disabled = true;
    btn.style.opacity = "0.5";
  }
}
window.handleAddressInput = handleAddressInput;

// ================= CALCULATE DELIVERY =================
async function calculateTotal() {
  const cart = JSON.parse(localStorage.getItem("cart") || "[]");
  if (!Array.isArray(cart) || cart.length === 0) {
    window.testnetCheckoutQuote = null;
    window.totalPi = 0;
    alert("Your cart is empty.");
    return;
  }

  try {
    const address = document.getElementById("address")?.value?.trim() || "";
    const country = document.getElementById("country")?.value?.trim() || "";

    if (address.length < 5 || !country) {
      window.testnetCheckoutQuote = null;
      window.totalPi = 0;
      alert("Please enter your delivery address and select your country before calculating delivery.");
      return;
    }

    const quote = await getTestnetCheckoutQuote(cart, address, country);

    window.testnetCheckoutQuote = quote;
    window.totalPi = Number(quote.total);

    const subtotal = document.getElementById("subtotal") ||
      document.getElementById("cartSubtotal");
    if (subtotal) subtotal.textContent = Number(quote.subtotal).toFixed(8) + " π";

    const delivery = document.getElementById("deliveryFee") ||
      document.getElementById("deliveryCost");
    if (delivery) delivery.textContent = Number(quote.deliveryFee).toFixed(8) + " π";

    const total = document.getElementById("total") ||
      document.getElementById("totalAmount") ||
      document.getElementById("checkoutTotal");
    if (total) total.textContent = Number(quote.total).toFixed(8) + " π";

    const piTotal = document.getElementById("piTotal");
    if (piTotal) piTotal.textContent = Number(quote.total).toFixed(8) + " π";

    return quote;
  } catch (error) {
    window.testnetCheckoutQuote = null;
    window.totalPi = 0;
    console.error(error);
    alert(error.message || "Unable to calculate Testnet total.");
  }
}
