<!-- 🛒 CART -->
<div id="cartItems"></div>

<script src="../js/network.js"></script>
<script id="gps1">
navigator.geolocation.getCurrentPosition(
  (pos) => {
    localStorage.setItem("deliveryLat", pos.coords.latitude);
    localStorage.setItem("deliveryLng", pos.coords.longitude);
  },
  (err) => {
    console.log("Location denied → using fallback");

    // 🔥 fallback (Lagos)
    localStorage.setItem("deliveryLat", 6.5244);
    localStorage.setItem("deliveryLng", 3.3792);
  }
);
</script>

<script>
  let currentUser = localStorage.getItem("username") || prompt("Enter your username (e.g seller1)");
localStorage.setItem("username", currentUser);

let subtotal = 0;

// ================= LOAD CART =================
function loadCart(){
  const cart = JSON.parse(localStorage.getItem("cart")) || [];

  const container = document.getElementById("cartItems");

  // 🔥 FIX: stop if element not found
  if (!container) return;

  let html = "";
  subtotal = 0;

  cart.forEach(item => {
    let price = Number(item.price);
    subtotal += price;

    html += `
      <div>
        <h4>${item.name}</h4>
        <p>${item.description}</p>
        <p>₦${price.toLocaleString()}</p>
      </div>
    `;
  });

  container.innerHTML = html;
}
async function checkPaymentAccess(method){
  // TEMP: always allow payment
  return true;
}
// ================= PAYMENT =================
async function payWithPi(){
  const allowed = await checkPaymentAccess("Pi");
  if(!allowed) return;

  completeCheckout("Pi"); // ✅ method passed
}

async function payWithFiat(){
  const allowed = await checkPaymentAccess("Fiat");
  if(!allowed) return;

  completeCheckout("Fiat"); // ✅ method passed
}
async function completeCheckout(method){
  console.log("Checkout started with:", method);

  const cart = JSON.parse(localStorage.getItem("cart")) || [];

  try {
    let amount = method === "Fiat"
      ? window.totalNaira
      : window.totalPi;

    let currency = method === "Fiat" ? "NG" : "PI";

    const currentNetwork =
  getWalletNetwork();

const walletId =
  localStorage.getItem(
    "walletId_" + currentNetwork
  );

alert(
  "walletId=" + walletId +
  "\nusername=" + localStorage.getItem("username")
);

    const payRes = await fetch("https://godomcoworld-backend.onrender.com/wallet/pay", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
  body: JSON.stringify({
  walletId,
  amount,
  currency,
  type: "product",
  network: currentNetwork
})
    });

    const payData = await payRes.json();

    if(!payData.success){
      alert(payData.message);
      return;
    }

    const shipmentRes = await fetch('https://godomcoworld-backend.onrender.com/logistics/create');
    const shipmentData = await shipmentRes.json();

    const orderId = shipmentData.orderId;

    const buyerName =
      document.getElementById("buyerName")?.value?.trim() || "";

    const phone =
      document.getElementById("phone")?.value?.trim() || "";

    const email =
      document.getElementById("email")?.value?.trim() || "";

    const address =
      document.getElementById("address")?.value?.trim() || "";

    const houseAddress =
      document.getElementById("houseAddress")?.value?.trim() || "";

    const city =
      document.getElementById("city")?.value?.trim() || "";

    const state =
      document.getElementById("state")?.value?.trim() || "";

    const country =
      document.getElementById("country")?.value?.trim() || "";

    const lat = Number(localStorage.getItem("deliveryLat") || 0);
    const lng = Number(localStorage.getItem("deliveryLng") || 0);

await fetch('https://godomcoworld-backend.onrender.com/api/checkout', {
  method: 'POST',
  headers: {'Content-Type':'application/json'},
  body: JSON.stringify({
    method,
    cart,
    orderId,

    // Buyer details — must match backend orders columns
    buyerName,
    phone,
    email,
    address,
    houseAddress,
    city,
    state,
    country,

    user: localStorage.getItem("username") || "guest",

    // Preserve Mainnet/Testnet isolation
    network: currentNetwork,

    lat,
    lng
})
});

    alert("✅ Payment successful\nOrder ID: " + orderId);

    localStorage.removeItem("cart");
    localStorage.setItem("lastOrderId", orderId);

    setTimeout(() => {
      window.location.href = "/logistics/track.html";
    }, 1500);

  } catch(err){
    console.error(err);
    alert("Payment failed");
  }
}


// ================= ENABLE CALCULATE BUTTON =================
function handleAddressInput(){
  const address = document.getElementById("address").value.trim();
  const country = document.getElementById("country").value;
  const btn = document.getElementById("calcBtn");

  if(!btn) return;

  if(address.length >= 5 && country !== ""){
    btn.disabled = false;
    btn.style.opacity = "1";
  } else {
    btn.disabled = true;
    btn.style.opacity = "0.5";
  }
}

// ================= CALCULATE DELIVERY =================
async function calculateTotal(){

  // 🔥 ALWAYS RECALCULATE subtotal FIRST
  loadCart();

  const cart = JSON.parse(localStorage.getItem("cart")) || [];

  document.getElementById("deliveryFee").innerText = "Calculating...";

  const res = await fetch('https://godomcoworld-backend.onrender.com/calculate-delivery', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      cart,
      address: document.getElementById("address").value,
      country: document.getElementById("country").value
    })
  });

  const data = await res.json();

  let delivery = 0;

  if(data.success){
  delivery = data.deliveryFee;

  let html = "";
  data.breakdown.forEach(item => {
    html += `
      <div>
        ${item.product} → ${item.weight}kg / ${item.distanceKm}km = ₦${item.fee.toLocaleString()}
      </div>
    `;
  });

  const breakdownDiv = document.getElementById("deliveryBreakdown");
if (breakdownDiv) {
  breakdownDiv.innerHTML = html;
}

  const total = subtotal + delivery;

  // 🔥 STORE GLOBAL VALUES
  window.totalNaira = total;
  window.totalPi = total / 471238500;

  // UPDATE UI
  document.getElementById("subtotal").innerText =
    "₦" + subtotal.toLocaleString();

  document.getElementById("deliveryFee").innerText =
    "₦" + delivery.toLocaleString();

  document.getElementById("total").innerText =
    "₦" + total.toLocaleString();

  updateCurrency(total);
}

// ================= CURRENCY =================
function updateCurrency(total){

  const usd = total / 1500;
  const pi = total / 471238500;

  document.getElementById("usdTotal").innerText =
    "$" + usd.toFixed(2);

  document.getElementById("piTotal").innerText =
    pi.toFixed(8) + " π";
}

// ================= INIT =================
window.payWithPi = payWithPi;
window.payWithFiat = payWithFiat;
window.addEventListener("storage", () => {
  updateCartCount();
});
loadCart();
}
</script>
