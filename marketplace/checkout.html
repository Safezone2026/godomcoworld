<script id="gps1">
window.deliveryLocationPromise = new Promise((resolve, reject) => {
  if (!navigator.geolocation) {
    reject(new Error("Your browser does not support GPS location."));
    return;
  }

  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const latitude = Number(pos.coords.latitude);
      const longitude = Number(pos.coords.longitude);

      if (!Number.isFinite(latitude) || !Number.isFinite(longitude)) {
        reject(new Error("Your GPS returned invalid coordinates."));
        return;
      }

      localStorage.setItem("deliveryLat", String(latitude));
      localStorage.setItem("deliveryLng", String(longitude));
      resolve({ latitude, longitude });
    },
    (err) => {
      localStorage.removeItem("deliveryLat");
      localStorage.removeItem("deliveryLng");

      const message = err.code === 1
        ? "Location permission was denied. Allow location access to calculate delivery."
        : err.code === 3
          ? "GPS location timed out. Please try again."
          : "Unable to obtain your GPS location. Please enable location services.";

      reject(new Error(message));
    },
    {
      enableHighAccuracy: true,
      timeout: 20000,
      maximumAge: 0
    }
  );
});
</script>

<script>
  let currentUser = localStorage.getItem("username") || prompt("Enter your username (e.g seller1)");
localStorage.setItem("username", currentUser);

let subtotal = 0;


// Testnet checkout amounts are calculated by the backend, not by frontend
// exchange-rate arithmetic. Mainnet keeps its existing calculation path.
async function getTestnetCheckoutQuote(cart, address, country) {
  const response = await fetch(
    "https://godomcoworld-backend-testnet.onrender.com/api/checkout/calculate",
    {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        cart,
        address: address || "",
        country: country || "",
        buyerLat: (await window.deliveryLocationPromise).latitude,
        buyerLng: (await window.deliveryLocationPromise).longitude,
        network: "testnet"
      })
    }
  );

  let data;
  try {
    data = await response.json();
  } catch (_) {
    throw new Error("Invalid response from the Testnet checkout service.");
  }

  if (!response.ok || !data || data.success !== true) {
    throw new Error(data && data.message
      ? data.message
      : "Unable to calculate the Testnet checkout total.");
  }

  for (const key of ["subtotal", "deliveryFee", "total"]) {
    if (!Number.isFinite(Number(data[key])) || Number(data[key]) < 0) {
      throw new Error("Invalid amount returned by the checkout service.");
    }
  }

  if (!Array.isArray(data.items)) {
    throw new Error("The checkout service did not return priced cart items.");
  }

  return data;
}

// Migrate legacy NGN Cart entries before requesting the Testnet quote.
async function migrateLegacyCheckoutCart() {
  const cart = JSON.parse(localStorage.getItem("cart") || "[]");
  if (!Array.isArray(cart) || !cart.length) return;

  if (!cart.some(item =>
    item && ["NGN", "₦", "NAIRA"].includes(
      String(item.currency || "").trim().toUpperCase()
    )
  )) return;

  const response = await fetch(
    "https://godomcoworld-backend-testnet.onrender.com/exchange-rates"
  );
  const data = await response.json();
  const nairaToUSD = Number(data?.rates?.NG?.rate);
  const piRate = nairaToUSD * 314159;

  if (!response.ok || !data.success ||
      !Number.isFinite(piRate) || piRate <= 0) {
    throw new Error("Unable to convert legacy Cart prices to Pi.");
  }

  let changed = false;
  for (const item of cart) {
    if (!item || typeof item !== "object") continue;
    const currency = String(item.currency || "").trim().toUpperCase();
    if (!["NGN", "₦", "NAIRA"].includes(currency)) continue;

    const originalPrice = Number(item.price);
    if (!Number.isFinite(originalPrice) || originalPrice < 0) {
      throw new Error("Invalid legacy Cart price.");
    }

    item.originalPrice = originalPrice;
    item.originalCurrency = currency;
    item.price = originalPrice / piRate;
    item.pricePi = item.price;
    item.currency = "PI";
    changed = true;
  }

  if (changed) localStorage.setItem("cart", JSON.stringify(cart));
}

// ================= LOAD CART =================
async function loadCart() {
  const container = document.getElementById("cartItems");
  try {
    await migrateLegacyCheckoutCart();
  } catch (error) {
    if (container) {
      container.textContent = error.message || "Unable to migrate Cart prices.";
    }
    console.error(error);
    return;
  }

  const cart = JSON.parse(localStorage.getItem("cart") || "[]");
  if (!container) return;

  if (!Array.isArray(cart) || cart.length === 0) {
    container.textContent = "Your cart is empty.";
    window.testnetCheckoutQuote = null;
    window.totalPi = 0;
    return;
  }

  try {
    const address = document.getElementById("address")?.value?.trim() || "";
    const country = document.getElementById("country")?.value?.trim() || "";
    const hasDeliveryDetails = address.length >= 5 && country.length > 0;
    container.textContent = "Calculating Testnet prices…";

    const quote = await getTestnetCheckoutQuote(cart, address, country);
    window.testnetCheckoutQuote = hasDeliveryDetails ? quote : null;
    window.totalPi = hasDeliveryDetails ? Number(quote.total) : 0;
    container.replaceChildren();

    for (const item of quote.items) {
      const row = document.createElement("div");
      const title = document.createElement("h4");
      const price = document.createElement("p");
      title.textContent = item.name || item.product || "Product";
      price.textContent =
        Number(item.lineTotalPi ?? item.pricePi).toFixed(7) + " π";
      row.append(title, price);
      container.appendChild(row);
    }

    const subtotal = document.getElementById("subtotal");
    if (subtotal) subtotal.textContent = Number(quote.subtotal).toFixed(7) + " π";

    const delivery = document.getElementById("deliveryFee");
    if (delivery) delivery.textContent = hasDeliveryDetails
      ? Number(quote.deliveryFee).toFixed(7) + " π"
      : "Enter delivery details";

    const total = document.getElementById("total");
    if (total) total.textContent = hasDeliveryDetails
      ? Number(quote.total).toFixed(7) + " π"
      : "Pending delivery calculation";

    const piTotal = document.getElementById("piTotal");
    if (piTotal) piTotal.textContent = hasDeliveryDetails
      ? Number(quote.total).toFixed(7) + " π"
      : "Pending delivery calculation";
  } catch (error) {
    window.testnetCheckoutQuote = null;
    window.totalPi = 0;
    container.textContent = error.message || "Testnet price calculation failed.";
    console.error(error);
  }
}

function requestMaskedTransactionPin(message) {
  return new Promise((resolve) => {
    const overlay = document.createElement("div");
    overlay.style.cssText = [
      "position:fixed",
      "inset:0",
      "z-index:99999",
      "display:flex",
      "align-items:center",
      "justify-content:center",
      "background:rgba(0,0,0,.7)",
      "padding:20px"
    ].join(";");

    const dialog = document.createElement("div");
    dialog.style.cssText = [
      "width:100%",
      "max-width:360px",
      "padding:24px",
      "border-radius:12px",
      "background:#fff",
      "color:#222",
      "box-shadow:0 8px 32px rgba(0,0,0,.3)"
    ].join(";");

    const title = document.createElement("h3");
    title.textContent = message;

    const input = document.createElement("input");
    input.type = "password";
    input.inputMode = "numeric";
    input.autocomplete = "current-password";
    input.maxLength = 6;
    input.placeholder = "Enter 4–6 digit PIN";
    input.setAttribute("aria-label", "Transaction PIN");
    input.style.cssText =
      "box-sizing:border-box;width:100%;padding:12px;" +
      "font-size:20px;letter-spacing:6px;margin:12px 0;";

    const error = document.createElement("p");
    error.style.cssText = "color:#c00;min-height:20px;margin:4px 0;";

    const buttons = document.createElement("div");
    buttons.style.cssText =
      "display:flex;gap:10px;justify-content:flex-end;margin-top:12px;";

    const cancel = document.createElement("button");
    cancel.type = "button";
    cancel.textContent = "Cancel";

    const verify = document.createElement("button");
    verify.type = "button";
    verify.textContent = "Verify PIN";

    buttons.append(cancel, verify);
    dialog.append(title, input, error, buttons);
    overlay.appendChild(dialog);
    document.body.appendChild(overlay);

    let finished = false;

    function close(value) {
      if (finished) return;
      finished = true;
      document.removeEventListener("keydown", onKeydown);
      overlay.remove();
      resolve(value);
    }

    function onKeydown(event) {
      if (event.key === "Escape") {
        close(null);
      } else if (event.key === "Enter") {
        submit();
      }
    }

    function submit() {
      const pin = input.value;
      if (!/^\d{4,6}$/.test(pin)) {
        error.textContent = "Enter a PIN containing 4 to 6 digits.";
        input.focus();
        return;
      }
      close(pin);
    }

    input.addEventListener("input", () => {
      input.value = input.value.replace(/\D/g, "").slice(0, 6);
      error.textContent = "";
    });

    cancel.addEventListener("click", () => close(null));
    verify.addEventListener("click", submit);
    overlay.addEventListener("click", (event) => {
      if (event.target === overlay) close(null);
    });
    document.addEventListener("keydown", onKeydown);

    input.focus();
  });
}

async function checkPaymentAccess(method){
  window.checkoutAuthorizationToken = null;
  window.checkoutAuthorizationWalletId = null;
  window.checkoutAuthorizationNetwork = null;

  const network = getWalletNetwork();
  const walletId = localStorage.getItem("walletId_" + network);

  if (!walletId) {
    alert("Wallet not initialized.");
    return false;
  }

  try {
    const statusRes = await fetch(
      "https://godomcoworld-backend-testnet.onrender.com/wallet/security/status/" +
      encodeURIComponent(walletId) +
      "?network=" + encodeURIComponent(network)
    );
    const statusData = await statusRes.json();

    if (!statusRes.ok) {
      alert(statusData.message || "Could not check Transaction PIN status.");
      return false;
    }

    if (!statusData.pinSet) {
      alert("Please set your Transaction PIN before making this payment.");
      return false;
    }

    if (statusData.locked) {
      alert("Transaction PIN is locked until " +
        new Date(statusData.lockedUntil).toLocaleString());
      return false;
    }

    const pin = await requestMaskedTransactionPin(
      "Enter your Transaction PIN to pay for this order:"
    );
    if (pin === null) return false;

    if (!/^\d{4,6}$/.test(pin)) {
      alert("PIN must contain 4 to 6 digits.");
      return false;
    }

    const verifyRes = await fetch(
      "https://godomcoworld-backend-testnet.onrender.com/wallet/security/verify-pin",
      {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          walletId: walletId,
          network: network,
          pin: pin
        })
      }
    );

    const verifyData = await verifyRes.json();

    if (!verifyRes.ok || !verifyData.success ||
        !verifyData.authorizationToken) {
      alert(verifyData.message || "Transaction PIN verification failed.");
      return false;
    }

    window.checkoutAuthorizationToken = verifyData.authorizationToken;
    window.checkoutAuthorizationWalletId = walletId;
    window.checkoutAuthorizationNetwork = network;
    return true;
  } catch (error) {
    console.error("Transaction PIN authorization failed:", error);
    alert("Could not verify your Transaction PIN. Please try again.");
    return false;
  }
}
// ================= PAYMENT =================
async function payWithPi(){
  const allowed = await checkPaymentAccess("Pi");
  if(!allowed) return;

  completeCheckout("Pi"); // ✅ method passed
}

async function completeCheckout(method) {
  if (window.marketplacePaymentInProgress) return;

  window.marketplacePaymentInProgress = true;

  let orderId = null;

  try {
    const cart = JSON.parse(localStorage.getItem("cart") || "[]");

    if (!Array.isArray(cart) || cart.length === 0) {
      throw new Error("Your cart is empty.");
    }

    const currentNetwork = getWalletNetwork();

    if (String(currentNetwork).toLowerCase() !== "testnet") {
      throw new Error("Marketplace wallet checkout is Testnet only.");
    }

    const address = document.getElementById("address")?.value?.trim() || "";
    const country = document.getElementById("country")?.value?.trim() || "";

    const quote = await getTestnetCheckoutQuote(cart, address, country);
    const amount = Number(quote.total);

    window.testnetCheckoutQuote = quote;
    window.totalPi = amount;

    if (!Number.isFinite(amount) || amount <= 0) {
      throw new Error("Please calculate a valid delivery fee before paying.");
    }

    const walletId = localStorage.getItem("walletId_" + currentNetwork);
    const username = localStorage.getItem("username") || "";

    if (!walletId || !username) {
      throw new Error("Your Testnet wallet or username is unavailable. Please sign in again.");
    }

    // Create the pending order before attempting the wallet debit.
    orderId = await createPendingU2AMarketplaceOrder(
      cart,
      username,
      amount,
      "godomcoworld_wallet"
    );

    const authorizationToken =
      window.checkoutAuthorizationWalletId === walletId &&
      window.checkoutAuthorizationNetwork === currentNetwork
        ? window.checkoutAuthorizationToken
        : null;

    if (!authorizationToken) {
      throw new Error("Transaction PIN authorization is missing. Please verify your PIN again.");
    }

    const payRes = await fetch(
      TESTNET_API + "/wallet/pay",
      {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          walletId,
          amount,
          currency: "PI",
          type: "product",
          orderId,
          network: currentNetwork,
          authorizationToken
        })
      }
    );

    const payData = await payRes.json();

    if (!payRes.ok || !payData.success || !payData.transactionId) {
      throw new Error(
        payData.message ||
        "Wallet payment failed. Your order remains pending."
      );
    }

    localStorage.removeItem("cart");
    localStorage.setItem("lastOrderId", orderId);

    alert(
      "Wallet payment successful.\nTransaction: " +
      payData.transactionId +
      "\nOrder ID: " + orderId
    );

    window.location.href = "/logistics/track.html";

  } catch (error) {
    console.error("Godomcoworld wallet checkout failed:", error);

    alert(
      (error.message || "Wallet payment failed.") +
      (orderId ? "\nPending order: " + orderId : "")
    );

  } finally {
    window.marketplacePaymentInProgress = false;
  }
}

// ================= DIRECT PI NETWORK U2A PAYMENT =================
const TESTNET_API =
  "https://godomcoworld-backend-testnet.onrender.com";

async function createPendingU2AMarketplaceOrder(cart, username, amount, method = "pi_network_u2a") {
  const address = document.getElementById("address")?.value?.trim() || "";
  const country = document.getElementById("country")?.value?.trim() || "";

  if (address.length < 5 || !country) {
    throw new Error("Enter your delivery address and select your country.");
  }

  const orderId = String(Date.now());

  const body = {
    method,
    cart,
    orderId,
    buyerName: document.getElementById("buyerName")?.value?.trim() || "",
    phone: document.getElementById("phone")?.value?.trim() || "",
    email: document.getElementById("email")?.value?.trim() || "",
    address,
    houseAddress: document.getElementById("houseAddress")?.value?.trim() || "",
    city: document.getElementById("city")?.value?.trim() || "",
    state: document.getElementById("state")?.value?.trim() || "",
    country,
    user: username,
    network: "testnet",
    lat: Number(localStorage.getItem("deliveryLat") || 0),
    lng: Number(localStorage.getItem("deliveryLng") || 0)
  };

  const response = await fetch(TESTNET_API + "/api/checkout", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body)
  });

  const result = await response.json();

  if (!response.ok || result.success === false) {
    throw new Error(result.message || "Could not create the pending order.");
  }

  return orderId;
}

async function payDirectWithPiNetwork() {
  if (window.marketplacePaymentInProgress) return;

  window.marketplacePaymentInProgress = true;

  try {
    if (String(getWalletNetwork()).toLowerCase() !== "testnet") {
      throw new Error("Direct Pi marketplace payments are currently Testnet only.");
    }

    if (!window.Pi || typeof window.Pi.createPayment !== "function") {
      throw new Error("Pi Network SDK is unavailable. Open checkout inside the Pi Browser and try again.");
    }

    window.Pi.init({
      version: "2.0",
      sandbox: true
    });

    const cart = JSON.parse(localStorage.getItem("cart") || "[]");

    if (!Array.isArray(cart) || cart.length === 0) {
      throw new Error("Your cart is empty.");
    }

    const address = document.getElementById("address")?.value?.trim() || "";
    const country = document.getElementById("country")?.value?.trim() || "";

    const quote = await getTestnetCheckoutQuote(cart, address, country);
    const amount = Number(quote.total);

    if (!Number.isFinite(amount) || amount <= 0) {
      throw new Error("The checkout total is invalid. Please recalculate delivery.");
    }

    window.testnetCheckoutQuote = quote;
    window.totalPi = amount;

    const auth = await window.Pi.authenticate(
      ["username", "payments"],
      function(incompletePayment) {
        console.warn("Incomplete Pi payment reported by SDK:", incompletePayment);
      }
    );

    const accessToken = auth?.accessToken;
    const piUsername = String(auth?.user?.username || "").trim();

    if (!accessToken || !piUsername) {
      throw new Error("Pi authentication did not return a valid user session.");
    }

    // The order must exist before the backend can approve a U2A payment.
    const orderId = await createPendingU2AMarketplaceOrder(
      cart,
      piUsername,
      amount
    );

    window.activeU2AOrderId = orderId;

    const paymentData = {
      amount,
      memo: "Godomcoworld Testnet Marketplace Order " + orderId,
      metadata: {
        purpose: "marketplace",
        referenceType: "order",
        referenceId: orderId,
        network: "testnet"
      }
    };

    window.Pi.createPayment(paymentData, {
      onReadyForServerApproval: async function(paymentId) {
        try {
          const response = await fetch(TESTNET_API + "/u2a/payment/approve", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
              paymentId,
              accessToken,
              orderId,
              network: "testnet"
            })
          });

          const result = await response.json();

          if (!response.ok || !result.success) {
            throw new Error(result.message || "Pi payment approval failed.");
          }

          console.log("U2A payment approved:", paymentId);
        } catch (error) {
          console.error("U2A server approval failed:", error);
          alert(error.message || "The server could not approve this Pi payment.");
          window.marketplacePaymentInProgress = false;
        }
      },

      onReadyForServerCompletion: async function(paymentId, txid) {
        try {
          const response = await fetch(TESTNET_API + "/u2a/payment/complete", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
              paymentId,
              txid,
              accessToken,
              network: "testnet"
            })
          });

          const result = await response.json();

          if (!response.ok || !result.success) {
            throw new Error(result.message || "Pi payment completion was not confirmed.");
          }

          // Only clear the cart after authoritative backend completion.
          localStorage.removeItem("cart");
          localStorage.setItem("lastOrderId", orderId);

          alert("Pi payment completed successfully. Order ID: " + orderId);

          window.location.href = "/logistics/track.html";
        } catch (error) {
          console.error("U2A payment completion failed:", error);
          alert(
            "The Pi payment completion could not be confirmed by the server. " +
            "Do not make another payment yet. Order: " + orderId
          );
          window.marketplacePaymentInProgress = false;
        }
      },

      onCancel: function(paymentId) {
        console.warn("Pi payment cancelled:", paymentId);
        window.marketplacePaymentInProgress = false;
        alert("Pi payment was cancelled. The order may remain pending.");
      },

      onError: function(error, payment) {
        console.error("Pi payment SDK error:", error, payment);
        window.marketplacePaymentInProgress = false;
        alert("Pi payment encountered an error. Check the order status before retrying.");
      }
    });

  } catch (error) {
    console.error("Direct Pi payment failed:", error);
    alert(error.message || "Could not start direct Pi payment.");
    window.marketplacePaymentInProgress = false;
  }
}

// ================= ENABLE CALCULATE BUTTON =================
function handleAddressInput(){
  const address = document.getElementById("address").value.trim();
  const country = document.getElementById("country").value;
  const btn = document.getElementById("calcBtn");

  if(!btn) return;

  if(address.length >= 5 && country !== ""){
    btn.disabled = false;
    btn.style.opacity = "1";
  } else {
    btn.disabled = true;
    btn.style.opacity = "0.5";
  }
}
window.handleAddressInput = handleAddressInput;

// ================= CALCULATE DELIVERY =================
async function calculateTotal() {
  const cart = JSON.parse(localStorage.getItem("cart") || "[]");
  if (!Array.isArray(cart) || cart.length === 0) {
    window.testnetCheckoutQuote = null;
    window.totalPi = 0;
    alert("Your cart is empty.");
    return;
  }

  try {
    const address = document.getElementById("address")?.value?.trim() || "";
    const country = document.getElementById("country")?.value?.trim() || "";

    if (address.length < 5 || !country) {
      window.testnetCheckoutQuote = null;
      window.totalPi = 0;
      alert("Please enter your delivery address and select your country before calculating delivery.");
      return;
    }

    const quote = await getTestnetCheckoutQuote(cart, address, country);

    window.testnetCheckoutQuote = quote;
    window.totalPi = Number(quote.total);

    const subtotal = document.getElementById("subtotal") ||
      document.getElementById("cartSubtotal");
    if (subtotal) subtotal.textContent = Number(quote.subtotal).toFixed(7) + " π";

    const delivery = document.getElementById("deliveryFee") ||
      document.getElementById("deliveryCost");
    if (delivery) delivery.textContent = Number(quote.deliveryFee).toFixed(7) + " π";

    const total = document.getElementById("total") ||
      document.getElementById("totalAmount") ||
      document.getElementById("checkoutTotal");
    if (total) total.textContent = Number(quote.total).toFixed(7) + " π";

    const piTotal = document.getElementById("piTotal");
    if (piTotal) piTotal.textContent = Number(quote.total).toFixed(7) + " π";

    return quote;
  } catch (error) {
    window.testnetCheckoutQuote = null;
    window.totalPi = 0;
    console.error(error);
    alert(error.message || "Unable to calculate Testnet total.");
  }
}

// ================= PAYMENT METHOD SELECTION =================
function continueWithPaymentMethod() {
  const selected = document.querySelector(
    'input[name="marketplacePaymentMethod"]:checked'
  );

  if (!selected) {
    alert("Please select a payment method to continue.");
    return;
  }

  if (window.marketplacePaymentInProgress) {
    alert("A payment is already being processed.");
    return;
  }

  window.selectedMarketplacePaymentMethod = selected.value;

  if (selected.value === "godomcoworld_wallet") {
    payWithPi();
    return;
  }

  if (selected.value === "pi_network_u2a") {
    payDirectWithPiNetwork();
    return;
  }

  alert("Unsupported payment method.");
}
