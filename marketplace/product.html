<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Details</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<h2>Product Details</h2>

<div id="productDetails"></div>

<a href="products.html"><button>⬅ Back</button></a>

<script>

// ================= NETWORK AWARENESS =================
function getSelectedNetwork() {
  const network =
    String(
      localStorage.getItem("network") ||
      localStorage.getItem("selectedNetwork") ||
      "testnet"
    ).trim().toLowerCase();

  return network === "mainnet" ? "mainnet" : "testnet";
}

const CURRENT_NETWORK = getSelectedNetwork();

console.log("🌐 PRODUCT DETAILS NETWORK:", CURRENT_NETWORK);

const productDetails = document.getElementById('productDetails');

// Get product ID from URL
const params = new URLSearchParams(window.location.search);
const productId = params.get('id');

// Fetch all products
async function loadProduct() {
  try {
    const res = await fetch(`https://godomcoworld-backend.onrender.com/products?network=${encodeURIComponent(CURRENT_NETWORK)}`);
    const data = await res.json();

    const product = (Array.isArray(data) ? data : (data.products || [])).find(p => String(p.id) === productId);

    if (!product) {
      productDetails.innerHTML = "<p>Product not found</p>";
      return;
    }

    // ============================================================
    // PI is the primary marketplace currency.
    // Naira and USD are reference values only.
    // ============================================================
    let nairaToUSD = 1500;

    try {
      const ratesRes = await fetch(
        `https://godomcoworld-backend.onrender.com/exchange-rates`
      );

      if (ratesRes.ok) {
        const ratesData = await ratesRes.json();
        const detectedRate = Number(ratesData?.rates?.NG?.rate);

        if (Number.isFinite(detectedRate) && detectedRate > 0) {
          nairaToUSD = detectedRate;
        }
      }
    } catch (rateErr) {
      console.warn("PRODUCT DETAIL: using fallback NGN/USD rate", rateErr);
    }

    const naira = Number(product.price) || 0;
    const usd = naira / nairaToUSD;
    const piRate = nairaToUSD * 314159;
    const pi = naira / piRate;

    productDetails.innerHTML = `
      <div style="max-width:400px;">
        <img
  src="${product.imagePath?.startsWith("http")
    ? product.imagePath
    : "https://godomcoworld-backend.onrender.com" + product.imagePath}"
  style="width:100%; border-radius:10px;"
  alt="${product.name}"
  onerror="this.style.display='none';"
>
        <h2>${product.name}</h2>
        <p>${product.description}</p>
        <h3 style="font-size:24px;">
          π${pi.toFixed(8)}
        </h3>

        <div style="font-size:14px; color:#777; margin-top:-5px;">
          <div>₦${naira.toLocaleString()} (Ref)</div>
          <div>$${usd.toFixed(2)} (Ref)</div>
        </div>
        <p><strong>Category:</strong> ${product.category}</p>

        <button onclick='addToCart(${JSON.stringify(product)})'>
          🛒 Add to Cart
        </button>
      </div>
    `;
  } catch (err) {
    console.error(err);
    productDetails.innerHTML = "<p>Error loading product</p>";
  }
}

// Simple cart (local)
function addToCart(product){
  let cart = JSON.parse(localStorage.getItem('cart') || "[]");
  cart.push(product);
  localStorage.setItem('cart', JSON.stringify(cart));
  alert("Added to cart");
}

loadProduct();
</script>

<script src="../js/dev-console.js"></script>
</body>
</html>
