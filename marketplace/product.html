<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Details</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<h2>Product Details</h2>

<div id="productDetails"></div>

<a href="products.html"><button>⬅ Back</button></a>

<script>

// ================= NETWORK AWARENESS =================
function getSelectedNetwork() {
  const network =
    String(
      localStorage.getItem("network") ||
      localStorage.getItem("selectedNetwork") ||
      "testnet"
    ).trim().toLowerCase();

  return network === "mainnet" ? "mainnet" : "testnet";
}

const CURRENT_NETWORK = getSelectedNetwork();

console.log("🌐 PRODUCT DETAILS NETWORK:", CURRENT_NETWORK);

const productDetails = document.getElementById('productDetails');

// Get product ID from URL
const params = new URLSearchParams(window.location.search);
const productId = params.get('id');

// Fetch all products
async function loadProduct() {
  try {
    const res = await fetch(`https://godomcoworld-backend-testnet.onrender.com/products?network=${encodeURIComponent(CURRENT_NETWORK)}`);
    const data = await res.json();

    const product = (Array.isArray(data) ? data : (data.products || [])).find(p => String(p.id) === productId);

    if (!product) {
      productDetails.innerHTML = "<p>Product not found</p>";
      return;
    }

    const galleryImages = [
      ...(Array.isArray(product.imagePaths) ? product.imagePaths : []),
      product.imagePath
    ]
      .filter(Boolean)
      .map(imagePath => String(imagePath).startsWith("http")
        ? String(imagePath)
        : "https://godomcoworld-backend-testnet.onrender.com" + String(imagePath))
      .filter((imagePath, index, images) => images.indexOf(imagePath) === index);
    const storedPrice = Number(product.price) || 0;
    const currency = String(product.currency || "").trim().toUpperCase();
    let pi = storedPrice;

    if (currency !== "PI" &&
        (currency === "₦" || currency === "NGN" || currency === "NAIRA")) {
      const rateResponse = await fetch(
        "https://godomcoworld-backend-testnet.onrender.com/exchange-rates"
      );
      const rateData = await rateResponse.json();
      const nairaToUSD = Number(rateData?.rates?.NG?.rate);

      if (!rateData.success || !Number.isFinite(nairaToUSD) || nairaToUSD <= 0) {
        throw new Error("Could not load the exchange rate for legacy product pricing.");
      }

      const piRate = nairaToUSD * 314159;
      pi = storedPrice / piRate;
    }

    productDetails.innerHTML = `
      <div style="max-width:400px;">
        <img
          id="productMainImage"
          src="${galleryImages[0] || ''}"
          style="width:100%; max-height:420px; object-fit:contain; border-radius:10px;"
          alt="${product.name}"
          onerror="this.style.display='none';"
        >
        <div id="productImageThumbnails"
             style="display:flex; flex-wrap:wrap; gap:8px; margin-top:12px;">
        </div>
        <h2>${product.name}</h2>
        <p>${product.description}</p>
        <h3 style="font-size:24px;">
          π${pi.toFixed(8)}
        </h3>

        <p><strong>Category:</strong> ${product.category}</p>

        <button onclick='addToCart(${JSON.stringify(product)})'>
          🛒 Add to Cart
        </button>
      </div>
    `;
    const mainImage = document.getElementById("productMainImage");
    const thumbnails = document.getElementById("productImageThumbnails");

    if (galleryImages.length > 1 && mainImage && thumbnails) {
      galleryImages.forEach((imageUrl, index) => {
        const thumbnail = document.createElement("button");
        thumbnail.type = "button";
        thumbnail.style.cssText = "padding:3px; border:1px solid #ccc; border-radius:6px; background:white; cursor:pointer;";

        const image = document.createElement("img");
        image.src = imageUrl;
        image.alt = `${product.name} image ${index + 1}`;
        image.style.cssText = "width:75px; height:75px; object-fit:cover; border-radius:4px;";

        thumbnail.appendChild(image);
        thumbnail.addEventListener("click", () => {
          mainImage.src = imageUrl;
        });

        thumbnails.appendChild(thumbnail);
      });
    }
  } catch (err) {
    console.error(err);
    productDetails.innerHTML = "<p>Error loading product</p>";
  }
}

// Simple cart (local)
function addToCart(product){
  product.currency = product.currency || product.originalCurrency || "NGN";
  let cart = JSON.parse(localStorage.getItem('cart') || "[]");
  cart.push(product);
  localStorage.setItem('cart', JSON.stringify(cart));
  alert("Added to cart");
}

loadProduct();
</script>

<script src="../js/dev-console.js"></script>
</body>
</html>
