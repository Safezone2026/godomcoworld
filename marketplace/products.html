<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Marketplace Products</title>

<link rel="stylesheet" href="../css/style.css">

</head>

<body>

<header>

<div class="logo">Marketplace Products</div>

<a href="index.html">
<button>Back</button>
</a>

</header>

<div class="container">

<h2>Available Products</h2>

<!-- STATIC SAMPLE PRODUCTS (optional) -->
<div class="course-grid">

<div class="card">
<img src="../images/sample1.jpg" style="width:100%; border-radius:10px;">
<h3>African Handmade Bag</h3>
<p>$25</p>
<button>Buy Now</button>
</div>

<div class="card">
<img src="../images/sample2.jpg" style="width:100%; border-radius:10px;">
<h3>Wooden Chair</h3>
<p>$40</p>
<button>Buy Now</button>
</div>

</div>

<!-- ✅ DYNAMIC PRODUCTS WILL APPEAR HERE -->
<div id="productList" class="course-grid"></div>

</div>

<a href="../marketplace.html">
<button>Back to Marketplace</button>
</a>

<!-- ✅ SCRIPT TO LOAD PRODUCTS -->
<script>

document.addEventListener("DOMContentLoaded", function(){

let products = JSON.parse(localStorage.getItem("products")) || [];

let container = document.getElementById("productList");

container.innerHTML = "";

products.forEach(function(product, index){

let card = document.createElement("div");

card.className = "card";

card.innerHTML = `
<img src="${product.image}" style="width:100%; border-radius:10px;">
<h3>${product.name}</h3>
<p>${product.desc}</p>
<p><b>$${product.price}</b></p>

<button onclick="deleteProduct(${index})" style="background:red;color:white;margin-top:10px;">
Delete
</button>

`;

container.appendChild(card);

});

});

function deleteProduct(index){

let products = JSON.parse(localStorage.getItem("products")) || [];

products.splice(index, 1);

localStorage.setItem("products", JSON.stringify(products));

location.reload();

}

  </script>

</body>
</html>
