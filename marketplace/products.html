<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

<body>

<header>
  <div class="logo">Marketplace Products</div>
  <a href="marketplace.html"><button>Back</button></a>
</header>

<div class="container">
  <h2>Available Products</h2>
  <div class="course-grid" id="productList"></div>
</div>
  <button onclick="addProduct()">➕ Add Product</button>

<script src="https://sdk.minepi.com/pi-sdk.js"></script>

<script>
// ✅ Ensure user exists
let currentUser = localStorage.getItem("piUser");
if(!currentUser){
  currentUser = "seller1";
  localStorage.setItem("piUser", currentUser);
}

// ✅ Initialize Pi
Pi.init({
  version: "2.0",
  sandbox: true,
  apiKey: "qc4ufrjtkej5vt51xmoljidnzyrjfdghxr3mzd8s0h14qf7qybebv6kehyqudl7h"
});

  let container = document.getElementById("productList");
  container.innerHTML = "";

  allProducts.forEach(function(product, index){

    let card = document.createElement("div");
    card.className = "card";

    // ✅ FIX IMAGE (handles both base64 + sample images)
    let imgSrc = product.image.startsWith("data:")
      ? product.image
      : "images/" + product.image;

    // ✅ Delete button (ONLY seller)
    let deleteBtn = "";
    if(index >= 2 && product.sellerUsername === currentUser){
      deleteBtn = `
        <button onclick="deleteProduct(${index})"
        style="background:red;color:white;margin-top:10px;">
        Delete
        </button>
      `;
    }

    card.innerHTML = `
      <img src="${imgSrc}" style="width:100%; border-radius:10px;">
      <h3>${product.name}</h3>
      <p>${product.desc}</p>
      <p><b>$${product.priceUSD}</b> | ${product.pricePi} π</p>

      <button onclick="buyProduct(${index})"
      style="background:#00bfff;color:white;margin-top:10px;">
      Buy Now
      </button>

      ${deleteBtn}
    `;

    container.appendChild(card);
  });

});

// 🗑 Delete product
function deleteProduct(index){
  let uploadedProducts = JSON.parse(localStorage.getItem("products")) || [];

  uploadedProducts.splice(index-2, 1);

  localStorage.setItem("products", JSON.stringify(uploadedProducts));

  location.reload();
}

// ✅ LOAD PRODUCT FROM BACKEND

async function loadProducts(){
  try {
    const res = await fetch('http://10.11.173.37:3000/products')
    const data = await res.json();

    console.log("Loaded:", data); // 🔥 DEBUG

    let container = document.getElementById("productList");
    container.innerHTML = "";

    data.products.forEach((p) => {

      container.innerHTML += `
        <div class="card">
          <h3>${p.name}</h3>
          <p>₦${p.price}</p>

          <button onclick='addToCart(${JSON.stringify(p)})'>
            🛒 Add to Cart
          </button>
        </div>
      `;
    });

  } catch(err){
    console.error("ERROR:", err);
    alert("Failed to load products");
  }
}

// ✅ SELLER RESTRICTION + CART
function addToCart(product){

  let currentUser = localStorage.getItem("piUser");

  if(product.sellerUsername === currentUser){
    alert("You cannot add your own product!");
    return;
  }

  let cart = JSON.parse(localStorage.getItem("cart")) || [];

  cart.push(product);

  localStorage.setItem("cart", JSON.stringify(cart));

  alert("Added to cart");
}

// RUN
window.onload = loadProducts;

</script>

<a href="../marketplace.html">

</body>
</html>
