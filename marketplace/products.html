<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketplace Products</title>
<link rel="stylesheet" href="../css/style.css">
</head>

<body>

<header>
  <div class="logo">Marketplace Products</div>
  <a href="marketplace.html"><button>Back</button></a>
</header>

<div class="container">
  <h2>Available Products</h2>
  <div class="course-grid" id="productList"></div>
</div>
  <button onclick="addProduct()">➕ Add Product</button>

<script src="https://sdk.minepi.com/pi-sdk.js"></script>

<script>
// ✅ Ensure user exists
let currentUser = localStorage.getItem("piUser");

if(!currentUser){
  currentUser = "seller1";
  localStorage.setItem("piUser", currentUser);
}

// ✅ Initialize Pi
Pi.init({
  version: "2.0",
  sandbox: true,
  apiKey: "qc4ufrjtkej5vt51xmoljidnzyrjfdghxr3mzd8s0h14qf7qybebv6kehyqudl7h"
});

// ✅ LOAD PRODUCT FROM BACKEND

async function loadProducts(){
  try {
    const res = await fetch('http://127.0.0.1:3000/products')
    const data = await res.json();

    console.log("Loaded:", data); // 🔥 DEBUG

    let container = document.getElementById("productList");
    container.innerHTML = "";

    data.products.forEach((p) => {

      container.innerHTML += `
        <div class="card">
          <h3>${p.name}</h3>
          <p>₦${p.price}</p>

          <button onclick='addToCart(${JSON.stringify(p)})'>
            🛒 Add to Cart
          </button>
        </div>
      `;
    });

  } catch(err){
    console.error("ERROR:", err);
    alert("Failed to load products");
  }
}

// ✅ SELLER RESTRICTION + CART
function addToCart(product){

  let currentUser = localStorage.getItem("piUser");

  if(product.sellerUsername === currentUser){
    alert("You cannot add your own product!");
    return;
  }

  let cart = JSON.parse(localStorage.getItem("cart")) || [];

  cart.push(product);

  localStorage.setItem("cart", JSON.stringify(cart));

  alert("Added to cart");
}

// RUN
window.onload = loadProducts;

</script>

<a href="../marketplace.html">
‎<button>Back to Marketplace</button>
‎</a>
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>
</body>
</html>
