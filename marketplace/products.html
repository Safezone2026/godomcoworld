    console.error("❌ Failed to load live exchange rates:", err);

let buyerLatitude = null;
let buyerLongitude = null;

function getSellerDistanceKm(product) {
  const rawLat = product.sellerLat;
  const rawLng = product.sellerLng;

  if (
    rawLat === null || rawLat === undefined || rawLat === "" ||
    rawLng === null || rawLng === undefined || rawLng === "" ||
    buyerLatitude === null || buyerLongitude === null
  ) return null;

  const lat = Number(rawLat);
  const lng = Number(rawLng);

  if (
    !Number.isFinite(lat) || lat < -90 || lat > 90 ||
    !Number.isFinite(lng) || lng < -180 || lng > 180 ||
    (lat === 0 && lng === 0)
  ) return null;

  const rad = value => value * Math.PI / 180;
  const dLat = rad(lat - buyerLatitude);
  const dLng = rad(lng - buyerLongitude);
  const a =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(rad(buyerLatitude)) * Math.cos(rad(lat)) *
    Math.sin(dLng / 2) ** 2;

  return 6371 * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function enableBuyerLocation() {
  const status = document.getElementById("buyerLocationStatus");

  if (!navigator.geolocation) {
    status.textContent = "Location services are not supported.";
    return;
  }

  status.textContent = "Requesting location permission...";

  navigator.geolocation.getCurrentPosition(
    position => {
      buyerLatitude = position.coords.latitude;
      buyerLongitude = position.coords.longitude;
      status.textContent =
        "Location active. Distances are approximate straight-line distances.";
      displayProducts();
    },
    error => {
      status.textContent = error.code === 1
        ? "Location permission denied. Allow location access to use nearby filters."
        : "Unable to get your location. Please try again.";
    },
    { enableHighAccuracy: true, timeout: 20000, maximumAge: 60000 }
  );
}

function displayProducts() {

const distanceFilter =
      document.getElementById("sellerDistanceFilter")?.value || "all";
    const distanceSort =

    let filtered = allProducts
      .filter(p => (currentCategory === 'All' || p.category === currentCategory))
      .filter(p => (p.name || '').toLowerCase().includes(searchText))
      .map(product => ({
        ...product,
        nearbyDistanceKm: getSellerDistanceKm(product)
      }));

    if (distanceFilter !== "all") {
      if (buyerLatitude === null || buyerLongitude === null) {
        document.getElementById("buyerLocationStatus").textContent =
          "Enable your location before selecting a distance filter.";
        filtered = [];
      } else {
        const maxDistance = Number(distanceFilter);
        filtered = filtered.filter(product =>
          product.nearbyDistanceKm !== null &&
          product.nearbyDistanceKm <= maxDistance
        );
      }
    }

    if (distanceSort === "nearest") {
      filtered.sort((a, b) => {
        if (a.nearbyDistanceKm === null) return 1;
        if (b.nearbyDistanceKm === null) return -1;
        return a.nearbyDistanceKm - b.nearbyDistanceKm;
      });

console.log("FULL PRODUCT:", JSON.stringify(product, null, 2));

<p>Category: ${product.category || 'N/A'}</p>

function requestProductDeletePin() {
  return new Promise((resolve) => {
    const overlay = document.createElement("div");
    overlay.style.cssText =
      "position:fixed;inset:0;z-index:999999;display:flex;" +
      "align-items:center;justify-content:center;" +
      "background:rgba(0,0,0,.7);padding:20px;";

    const dialog = document.createElement("div");
    dialog.style.cssText =
      "width:100%;max-width:360px;padding:24px;border-radius:12px;" +
      "background:#fff;color:#222;";

    const title = document.createElement("h3");
    title.textContent = "Confirm Transaction PIN";

    const input = document.createElement("input");
    input.type = "password";
    input.inputMode = "numeric";
    input.autocomplete = "current-password";
    input.maxLength = 6;
    input.placeholder = "Enter 4–6 digit PIN";
    input.style.cssText =
      "width:100%;box-sizing:border-box;padding:12px;" +
      "margin:12px 0;border:1px solid #ccc;border-radius:6px;";

    const confirmButton = document.createElement("button");
    confirmButton.textContent = "Verify PIN";

    const cancelButton = document.createElement("button");
    cancelButton.textContent = "Cancel";
    cancelButton.style.marginLeft = "10px";

    let finished = false;
    function close(value) {
      if (finished) return;
      finished = true;
      overlay.remove();
      resolve(value);
    }

    confirmButton.onclick = () => {
      const value = input.value.trim();
      if (!/^[0-9]{4,6}$/.test(value)) {
        alert("Enter a valid 4–6 digit PIN.");
        return;
      }
      close(value);
    };

    cancelButton.onclick = () => close(null);
    overlay.onclick = (event) => {
      if (event.target === overlay) close(null);
    };

    input.onkeydown = (event) => {
      if (event.key === "Enter") confirmButton.click();
      if (event.key === "Escape") close(null);
    };

    dialog.append(title, input, confirmButton, cancelButton);
    overlay.appendChild(dialog);
    document.body.appendChild(overlay);
    input.focus();
  });
}

// 🗑️ DELETE BUTTON
    if (product.sellerUsername === currentSellerUsername) {

            }

            const auth = await window.Pi.authenticate(["username"], () => {});
            const accessToken = auth && auth.accessToken;
            if (!accessToken) {
              throw new Error("Pi authentication failed. Please sign in again.");
            }

            const pin = await requestProductDeletePin();
            if (pin === null) return;

            const verifyResponse = await fetch(`${API_URL}/seller/security/verify-pin`, {

            const verification = await verifyResponse.json();
            if (!verifyResponse.ok || verification.success !== true) {
              throw new Error(verification.message || "Transaction PIN verification failed.");
            }

            const authorizationToken = verification.authorizationToken;

            if (!authorizationToken) {
              throw new Error("PIN verification did not return an authorization token.");
            }

            requestBody = {
              ...requestBody,
              username: currentSellerUsername,
              sellerId,
              accessToken,

            };

          const result = await res.json();

          console.error("Product deletion failed:", err);

// -------------------- CART --------------------
function migrateLegacyCartPrices() {
  const rate = Number(PI_RATE);
  if (!Number.isFinite(rate) || rate <= 0) return;

  let items;
  try {
    items = JSON.parse(localStorage.getItem("cart") || "[]");
  } catch (error) {
    console.error("Could not read Cart for price migration:", error);
    return;
  }

  if (!Array.isArray(items)) return;

  let changed = false;

  for (const item of items) {
    if (!item || typeof item !== "object") continue;

    const currency = String(item.currency || "").trim().toUpperCase();
    const isNaira = ["₦", "NGN", "NAIRA"].includes(currency);

    if (!isNaira) continue;

    const originalPrice = Number(item.price);
    if (!Number.isFinite(originalPrice) || originalPrice < 0) continue;

    item.originalPrice = originalPrice;
    item.originalCurrency = currency;
    item.price = originalPrice / rate;
    item.pricePi = item.price;
    item.currency = "PI";
    changed = true;
  }

  if (changed) {
    localStorage.setItem("cart", JSON.stringify(items));
    if (typeof cart !== "undefined") cart = items;
    console.log("Migrated legacy NGN Cart prices to Pi.");
  }
}

function renderCart() {
  migrateLegacyCartPrices();
  let storedCart = JSON.parse(localStorage.getItem("cart")) || [];

  cartList.innerHTML = '';

  storedCart.forEach((item, index) => {
    const div = document.createElement('div');
    div.textContent = `${item.name} - π${Number(item.price).toFixed(8)}`;

    const removeBtn = document.createElement('button');
    removeBtn.textContent = 'Remove';

    removeBtn.onclick = () => {
      storedCart.splice(index, 1);
      localStorage.setItem("cart", JSON.stringify(storedCart));
      renderCart();
    };
    

    div.appendChild(removeBtn);
    cartList.appendChild(div);
  });

  document.getElementById('cartCount').textContent = storedCart.length;


  // ✅ FORCE REMOVE OLD BUTTON (important)
  const oldBtn = document.getElementById("checkoutBtn");
  if (oldBtn) oldBtn.remove();

  // ✅ ALWAYS RECREATE BUTTON (no condition delay)
  const checkoutBtn = document.createElement('button');
  checkoutBtn.id = "checkoutBtn";
  checkoutBtn.textContent = "Proceed to Checkout";
  checkoutBtn.style.marginTop = "10px";
  checkoutBtn.style.backgroundColor = "#4CAF50";
  checkoutBtn.style.color = "#fff";

  checkoutBtn.onclick = goToCheckout;

  cartList.appendChild(checkoutBtn);

  // ✅ update counter
  document.getElementById('cartCount').textContent = cart.length;
}

// -------------------- CHECKOUT --------------------
function goToCheckout() {
  if (cart.length === 0) {
    alert("Cart is empty");
    return;
  }

  // ✅ ENSURE cart is saved
  localStorage.setItem("cart", JSON.stringify(cart));

  window.location.href = "checkout.html";
}

// Sequential product image selection: supports Android pickers that select one file at a time.
const selectedProductImages = [];
const productImagesInput = document.getElementById("productImagesInput");
const addProductImageButton = document.getElementById("addProductImageButton");
const productImageCount = document.getElementById("productImageCount");
const productImagePreviews = document.getElementById("productImagePreviews");

function renderProductImageSelections() {
  if (!productImageCount || !productImagePreviews) return;

  productImagePreviews.querySelectorAll("img").forEach(img => {
    if (img.src.startsWith("blob:")) URL.revokeObjectURL(img.src);
  });

  productImagePreviews.innerHTML = "";
  productImageCount.textContent = `${selectedProductImages.length}/8 images selected`;

  selectedProductImages.forEach((file, index) => {
    const card = document.createElement("div");
    card.style.cssText = "width:105px;display:flex;flex-direction:column;gap:5px;";

    const preview = document.createElement("img");
    preview.src = URL.createObjectURL(file);
    preview.alt = `Product image ${index + 1}`;
    preview.style.cssText = "width:100px;height:85px;object-fit:cover;border-radius:6px;";

    const label = document.createElement("small");
    label.textContent = `Image ${index + 1}`;

    const removeButton = document.createElement("button");
    removeButton.type = "button";
    removeButton.textContent = "Remove";
    removeButton.addEventListener("click", () => {
      selectedProductImages.splice(index, 1);
      renderProductImageSelections();
      updateAddProductImageButton();
    });

    card.append(preview, label, removeButton);
    productImagePreviews.appendChild(card);
  });

  updateAddProductImageButton();
}

function updateAddProductImageButton() {
  if (addProductImageButton) {
    addProductImageButton.disabled = selectedProductImages.length >= 8;
    addProductImageButton.textContent =
      selectedProductImages.length >= 8 ? "Maximum 8 images selected" : "Add another image";
  }
}

if (productImagesInput && addProductImageButton) {
  addProductImageButton.addEventListener("click", () => {
    if (selectedProductImages.length < 8) productImagesInput.click();
  });

  productImagesInput.addEventListener("change", () => {
    const newlySelected = Array.from(productImagesInput.files || []);
    let added = 0;

    for (const file of newlySelected) {
      if (!file.type || !file.type.startsWith("image/")) {
        alert(`${file.name} is not a supported image.`);
        continue;
      }

      const duplicate = selectedProductImages.some(existing =>
        existing.name === file.name &&
        existing.size === file.size &&
        existing.lastModified === file.lastModified
      );

      if (duplicate) {
        alert(`${file.name} has already been selected.`);
        continue;
      }

      if (selectedProductImages.length >= 8) {
        alert("You can upload a maximum of 8 product images.");
        break;
      }

      selectedProductImages.push(file);
      added++;
    }

    // Clear the native picker so the same picker can be opened again.
    productImagesInput.value = "";
    renderProductImageSelections();
  });

  renderProductImageSelections();
}

if (form) {
  form.addEventListener('submit', async (e) => {
    e.preventDefault();


      if (selectedProductImages.length === 0) {
        alert("Please add at least one product image.");
        return;
      }

      if (selectedProductImages.length > 8) {
        alert("You can upload a maximum of 8 product images.");
        return;
      }

const formData = new FormData(form);
formData.delete("images");
selectedProductImages.forEach(file => {
  formData.append("images", file, file.name);
});

    // Product price is entered directly in Pi.
    const piPrice = Number(formData.get("price"));
    if (!Number.isFinite(piPrice) || piPrice <= 0) {
      alert("Enter a valid product price in Pi.");
      return;
    }
    formData.set("price", String(piPrice));
    formData.set("currency", "PI");

    // ========================================================
    // REGISTERED SELLER IDENTITY
    // ========================================================

    const sellerUsername =
      localStorage.getItem("username");

    const sellerId =
      localStorage.getItem("sellerId");

    if (!sellerUsername || !sellerId) {

      alert(
        "Seller account information is missing. Please log in again."
      );

      return;

    }

    formData.set(
      "sellerUsername",
      sellerUsername
    );

    formData.set(
      "sellerId",
      sellerId
    );

    console.log(
      "UPLOAD SELLER:",
      {
        sellerUsername,
        sellerId
      }
    );

    // ========================================================
    // WEIGHT
    // ========================================================

    const weightInput =
      document.getElementById("weight");

    if (weightInput) {

      formData.set(
        "weight",
        Number(weightInput.value) || 1
      );

    }

      try {
      const response = await fetch(`${API_URL}/products`, {
        method: 'POST',
        body: formData
      });

      const result = await response.json();
      statusDiv.textContent = result.message;

      if (result.product) loadProducts();

      form.reset();
      document.querySelector('input[name="sellerUsername"]').value = currentSellerUsername;

    } catch (err) {
      console.error(err);
      statusDiv.textContent = 'Upload failed';
    }
  });
}

// ✅ STORAGE LISTENER (CORRECT)
window.addEventListener("storage", () => {
  updateCartCount();
});

// ✅ INITIALIZE AFTER ALL FUNCTIONS ARE DEFINED
updateCartCount();

loadExchangeRates()
  .then(() => {
    migrateLegacyCartPrices();
    renderCart();
  })
  .catch((error) => {
    console.error("Cart price migration postponed: exchange rates unavailable.", error);
    const cartItems = document.getElementById("cartList");
    if (cartItems) {
      cartItems.textContent =
        "Unable to load exchange rates. Your saved Cart is unchanged; reload to retry.";
    }
  });

loadProducts();
</script>
