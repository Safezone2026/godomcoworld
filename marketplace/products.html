<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketplace Products - Godomcoworld</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header>
  <div class="logo">Marketplace Products</div>
  <a href="../marketplace.html">
    <button>Back</button>
  </a>
</header>

<div class="container">
  <h2>Available Products</h2>

  <!-- Container for dynamic product cards -->
  <div class="course-grid" id="productList"></div>
</div>

<a href="../marketplace.html">
  <button>Back to Marketplace</button>
</a>

<!-- Pi SDK -->
<script src="https://sdk.minepi.com/pi-sdk.js"></script>

<script>
// Initialize Pi SDK
Pi.init({
  version: "2.0",
  sandbox: true, // change to false for Mainnet
  apiKey: "qc4ufrjtkej5vt51xmoljidnzyrjfdghxr3mzd8s0h14qf7qybebv6kehyqudl7h",
  walletAddress: "GDJIQMWBMXWMV2R4P4Z2KILJUS7VC4DHWXDT5AELWYNRABUJAHZSGLB2"
});

// Render products
document.addEventListener("DOMContentLoaded", function(){
  let products = JSON.parse(localStorage.getItem("products")) || [];
  let container = document.getElementById("productList");
  container.innerHTML = "";

  products.forEach(function(product, index){
    let card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <img src="${product.image}" style="width:100%; border-radius:10px;">
      <h3>${product.name}</h3>
      <p>${product.desc}</p>
      <p><b>$${product.price}</b></p>

      <button onclick="buyProduct(${index})" style="background:#00bfff;color:white;margin-top:10px;">
        Buy Now
      </button>

      <button onclick="deleteProduct(${index})" style="background:red;color:white;margin-top:10px;">
        Delete
      </button>
    `;
    container.appendChild(card);
  });
});

// Delete product
function deleteProduct(index){
  let products = JSON.parse(localStorage.getItem("products")) || [];
  products.splice(index, 1);
  localStorage.setItem("products", JSON.stringify(products));
  location.reload();
}

// Buy product via Pi
async function buyProduct(index){
  let products = JSON.parse(localStorage.getItem("products")) || [];
  let product = products[index];

  try {
    // Request Pay
    const payment = await Pi.requestPay({
      amount: parseFloat(product.price) / 314159, // Convert $ to Pi using π formula
      memo: `Purchase: ${product.name}`,
      metadata: {product: product.name}
    });

    console.log("Payment result:", payment);

    if(payment && payment.txid){
      alert(`Payment successful!\nProduct unlocked: ${product.name}`);
      // Optional: mark product as purchased for this user
    }
  } catch(err){
    console.error("Payment error:", err);
    alert("Payment failed or cancelled.");
  }
}
</script>

</body>
</html>
