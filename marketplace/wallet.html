    console.log("Using existing wallet:", walletId);

    await loadBalance();
    return;
  }

  // Only create if no wallet exists...
  const res = await fetch(API + "/wallet/create", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
  username: username.trim(),
  network: currentNetwork,
})

if (!data.walletId) {

}

walletId = data.walletId;

);

// REAL PI TESTNET PAYMENT

let piAccessToken = null;
let piAuthenticatedUser = null;
let piSdkReady = false;

function initPiSDK() {

  if (piSdkReady) {
    return true;
  }

  if (typeof Pi === "undefined") {
    console.error("❌ Pi SDK is not available");
    alert(
      "Pi payments must be opened inside the Pi Browser."
    );
    return false;
  }

  try {

    Pi.init({
      version: "2.0",
      sandbox: true
    });

    piSdkReady = true;

    console.log("✅ Pi SDK initialized in sandbox mode");

    return true;

  } catch (err) {

    console.error("❌ Pi SDK initialization failed:", err);

    alert("Unable to initialize Pi payments.");

    return false;
  }
}


async function authenticatePi() {

  if (!initPiSDK()) {
    return false;
  }

  if (piAccessToken && piAuthenticatedUser) {
    return true;
  }

  try {

    const auth = await Pi.authenticate(
      ["username", "payments"],
      async function onIncompletePaymentFound(payment) {

        console.log(
          "⚠️ Incomplete Pi payment found:",
          payment
        );

        try {

          if (
            payment &&
            payment.identifier &&
            payment.transaction &&
            payment.transaction.txid
          ) {

            const response = await fetch(
              API + "/pi/payment/complete",
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json"
                },
                body: JSON.stringify({
                  paymentId: payment.identifier,
                  txid: payment.transaction.txid,
                  accessToken: piAccessToken
                })
              }
            );

            const data = await response.json();

            console.log(
              "📥 Incomplete payment recovery:",
              data
            );

            if (data.success) {
              await loadBalance();
            }

          }

        } catch (err) {

          console.error(
            "❌ Incomplete payment recovery failed:",
            err
          );
        }
      }
    );

    piAccessToken = auth.accessToken;
    piAuthenticatedUser = auth.user;

    console.log("✅ Pi authentication successful:", {
      username: auth.user?.username,
      uid: auth.user?.uid
    });

    return true;

  } catch (err) {

    console.error("❌ Pi authentication failed:", err);

    alert(
      "Pi authentication failed. Please try again inside Pi Browser."
    );

    return false;
  }
}


async function depositPi() {

  if (currentNetwork !== "testnet") {

    alert(
      "Real Test-Pi deposits are currently enabled only for the Testnet wallet."
    );

    return;
  }

  const authenticated = await authenticatePi();

  if (!authenticated) {
    return;
  }

  const amountText = prompt(
    "Enter the amount of Test-Pi to deposit:"
  );

  if (amountText === null) {
    return;
  }

  const amount = Number(amountText);

  if (!Number.isFinite(amount) || amount <= 0) {

    alert("Please enter a valid Pi amount.");

    return;
  }

  if (!walletId) {

    alert("Wallet not found. Please initialize your wallet first.");

    return;
  }

  console.log("📤 Creating REAL Pi Testnet payment:", {
    amount,
    walletId,
    network: currentNetwork
  });

  try {

    const payment = await Pi.createPayment(
      {
        amount: amount,

        memo:
          "Godomcoworld Test-Pi wallet deposit",

        metadata: {
          walletId: walletId,
          network: currentNetwork
        }
      },

      {
        onReadyForServerApproval: async function(paymentId) {

          console.log(
            "🔐 Pi payment ready for server approval:",
            paymentId
          );

          try {

            const response = await fetch(
              API + "/pi/payment/approve",
              {
                method: "POST",

                headers: {
                  "Content-Type": "application/json"
                },

                body: JSON.stringify({
                  paymentId: paymentId,
                  accessToken: piAccessToken,
                  walletId: walletId,
                  network: currentNetwork
                })
              }
            );

            const data = await response.json();

            console.log(
              "📥 Pi approval response:",
              data
            );

            if (!response.ok || !data.success) {

              console.error(
                "❌ Pi server approval failed:",
                data
              );

              alert(
                data.message ||
                "Pi payment approval failed."
              );
            }

          } catch (err) {

            console.error(
              "❌ Pi approval request failed:",
              err
            );

            alert(
              "Unable to approve the Pi payment."
            );
          }
        },


        onReadyForServerCompletion:
          async function(paymentId, txid) {

            console.log(
              "🔗 Pi payment ready for completion:",
              {
                paymentId,
                txid
              }
            );

            try {

              const response = await fetch(
                API + "/pi/payment/complete",
                {
                  method: "POST",

                  headers: {
                    "Content-Type": "application/json"
                  },

                  body: JSON.stringify({
                    paymentId: paymentId,
                    txid: txid,
                    accessToken: piAccessToken
                  })
                }
              );

              const data = await response.json();

              console.log(
                "📥 Pi completion response:",
                data
              );

              if (!response.ok || !data.success) {

                alert(
                  data.message ||
                  "Pi payment completion failed."
                );

                return;
              }

              alert(
                "✅ Real Test-Pi deposit completed!\n\n" +
                "Amount: " +
                Number(data.amount).toFixed(6) +
                " π"
              );

              await loadBalance();

            } catch (err) {

              console.error(
                "❌ Pi completion request failed:",
                err
              );

              alert(
                "Pi payment was processed, but wallet confirmation failed. Please refresh your wallet."
              );
            }
          },


        onCancel: function(paymentId) {

          console.log(
            "⚠️ Pi payment cancelled:",
            paymentId
          );

          alert("Pi payment cancelled.");
        },


        onError: function(error, payment) {

          console.error(
            "❌ Pi payment error:",
            error,
            payment
          );

          alert(
            "Pi payment failed. Please try again."
          );
        }
      }
    );

    console.log(
      "✅ Pi.createPayment completed:",
      payment
    );

  } catch (err) {

    console.error(
      "❌ Pi payment creation failed:",
      err
    );

    alert(
      "Unable to create Pi payment. Please try again."
    );
  }
}

async function updateWalletDisplay() {
  const walletId = localStorage.getItem("walletId_" + currentNetwork);
  const balanceElement = document.getElementById("piBalance");

  if (!walletId) {
    if (balanceElement) balanceElement.innerText = "0 π";
    return;
  }

  try {
    const res = await fetch(
      `${API}/wallet/${encodeURIComponent(walletId)}?network=${encodeURIComponent(currentNetwork)}`
    );

    if (!res.ok) throw new Error("Unable to load wallet balance");

    const wallet = await res.json();
    const pi = Number(wallet.balances?.PI || 0);

    if (balanceElement) {
      balanceElement.innerText = pi.toFixed(8) + " π";
    }
  } catch (error) {
    console.error("Could not refresh Pi balance:", error);
  }
}

// ================= TRANSACTION SECURITY =================

let transactionAuthorizationToken = null;
let transactionAuthorizationExpiresAt = 0;

function clearTransactionAuthorization(){
  transactionAuthorizationToken = null;
  transactionAuthorizationExpiresAt = 0;
}

async function loadSecurityStatus(){

  if(!walletId){
    return;
  }

  try{

    const res = await fetch(
      API +
      "/wallet/security/status/" +
      encodeURIComponent(walletId) +
      "?network=" +
      encodeURIComponent(currentNetwork)
    );

    const data = await res.json();

    const status = document.getElementById("securityStatus");
    const setupArea = document.getElementById("pinSetupArea");
    const changeArea = document.getElementById("pinChangeArea");

    if(!res.ok){
      status.textContent =
        data.message || "Unable to load Transaction PIN status.";
      return;
    }

    if(data.pinSet){

      if(data.locked){

        status.textContent =
          "🔒 Transaction PIN is locked until " +
          new Date(data.lockedUntil).toLocaleString();

      }else{

        status.textContent =
          "✅ Transaction PIN is active.";

      }

      setupArea.style.display = "none";
      changeArea.style.display = "block";

    }else{

      status.textContent =
        "⚠️ Set a Transaction PIN before sending, swapping, or withdrawing funds.";

      setupArea.style.display = "block";
      changeArea.style.display = "none";

    }

  }catch(err){

    console.error("Security status error:", err);

    document.getElementById("securityStatus").textContent =
      "Unable to load Transaction PIN status.";

  }
}


async function setupTransactionPin(){

  const pin =
    document.getElementById("transactionPin").value.trim();

  const confirmPin =
    document.getElementById("transactionPinConfirm").value.trim();

  const message =
    document.getElementById("securityMessage");

  if(!/^\d{4,6}$/.test(pin)){
    message.textContent =
      "PIN must contain 4 to 6 digits.";
    return;
  }

  if(pin !== confirmPin){
    message.textContent =
      "PIN confirmation does not match.";
    return;
  }

  try{

    const res = await fetch(
      API + "/wallet/security/setup-pin",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          walletId,
          network:currentNetwork,
          pin
        })
      }
    );

    const data = await res.json();

    message.textContent =
      data.message || "Unable to set Transaction PIN.";

    if(data.success){

      document.getElementById("transactionPin").value = "";
      document.getElementById("transactionPinConfirm").value = "";

      await loadSecurityStatus();

    }

  }catch(err){

    console.error("Setup PIN error:", err);

    message.textContent =
      "Unable to set Transaction PIN.";

  }
}


async function changeTransactionPin(){

  const currentPin =
    document.getElementById("currentTransactionPin").value.trim();

  const newPin =
    document.getElementById("newTransactionPin").value.trim();

  const confirmPin =
    document.getElementById("newTransactionPinConfirm").value.trim();

  const message =
    document.getElementById("securityMessage");

  if(!/^\d{4,6}$/.test(currentPin)){
    message.textContent =
      "Enter your current PIN.";
    return;
  }

  if(!/^\d{4,6}$/.test(newPin)){
    message.textContent =
      "New PIN must contain 4 to 6 digits.";
    return;
  }

  if(newPin !== confirmPin){
    message.textContent =
      "New PIN confirmation does not match.";
    return;
  }

  try{

    const res = await fetch(
      API + "/wallet/security/change-pin",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          walletId,
          network:currentNetwork,
          currentPin,
          newPin
        })
      }
    );

    const data = await res.json();

    message.textContent =
      data.message || "Unable to change Transaction PIN.";

    if(data.success){

      clearTransactionAuthorization();

      document.getElementById("currentTransactionPin").value = "";
      document.getElementById("newTransactionPin").value = "";
      document.getElementById("newTransactionPinConfirm").value = "";

      await loadSecurityStatus();

    }

  }catch(err){

    console.error("Change PIN error:", err);

    message.textContent =
      "Unable to change Transaction PIN.";

  }
}



function requestMaskedTransactionPin(message) {
  return new Promise((resolve) => {
    const overlay = document.createElement("div");
    overlay.style.cssText = [
      "position:fixed",
      "inset:0",
      "z-index:99999",
      "display:flex",
      "align-items:center",
      "justify-content:center",
      "background:rgba(0,0,0,.7)",
      "padding:20px"
    ].join(";");

    const dialog = document.createElement("div");
    dialog.style.cssText = [
      "width:100%",
      "max-width:360px",
      "padding:24px",
      "border-radius:12px",
      "background:#fff",
      "color:#222",
      "box-shadow:0 8px 32px rgba(0,0,0,.3)"
    ].join(";");

    const title = document.createElement("h3");
    title.textContent = message;

    const input = document.createElement("input");
    input.type = "password";
    input.inputMode = "numeric";
    input.autocomplete = "current-password";
    input.maxLength = 6;
    input.placeholder = "Enter 4–6 digit PIN";
    input.setAttribute("aria-label", "Transaction PIN");
    input.style.cssText =
      "box-sizing:border-box;width:100%;padding:12px;" +
      "font-size:20px;letter-spacing:6px;margin:12px 0;";

    const error = document.createElement("p");
    error.style.cssText = "color:#c00;min-height:20px;margin:4px 0;";

    const buttons = document.createElement("div");
    buttons.style.cssText =
      "display:flex;gap:10px;justify-content:flex-end;margin-top:12px;";

    const cancel = document.createElement("button");
    cancel.type = "button";
    cancel.textContent = "Cancel";

    const verify = document.createElement("button");
    verify.type = "button";
    verify.textContent = "Verify PIN";

    buttons.append(cancel, verify);
    dialog.append(title, input, error, buttons);
    overlay.appendChild(dialog);
    document.body.appendChild(overlay);

    let finished = false;

    function close(value) {
      if (finished) return;
      finished = true;
      document.removeEventListener("keydown", onKeydown);
      overlay.remove();
      resolve(value);
    }

    function onKeydown(event) {
      if (event.key === "Escape") {
        close(null);
      } else if (event.key === "Enter") {
        submit();
      }
    }

    function submit() {
      const pin = input.value;
      if (!/^\d{4,6}$/.test(pin)) {
        error.textContent = "Enter a PIN containing 4 to 6 digits.";
        input.focus();
        return;
      }
      close(pin);
    }

    input.addEventListener("input", () => {
      input.value = input.value.replace(/\D/g, "").slice(0, 6);
      error.textContent = "";
    });

    cancel.addEventListener("click", () => close(null));
    verify.addEventListener("click", submit);
    overlay.addEventListener("click", (event) => {
      if (event.target === overlay) close(null);
    });
    document.addEventListener("keydown", onKeydown);

    input.focus();
  });
}

async function requestTransactionAuthorization(operationName){

  clearTransactionAuthorization();

  if(!walletId){
    alert("Wallet not initialized.");
    return null;
  }

  const statusRes = await fetch(
    API +
    "/wallet/security/status/" +
    encodeURIComponent(walletId) +
    "?network=" +
    encodeURIComponent(currentNetwork)
  );

  const statusData = await statusRes.json();

  if(!statusData.pinSet){

    alert(
      "Please set your Transaction PIN before " +
      operationName.toLowerCase() +
      "."
    );

    await loadSecurityStatus();

    return null;
  }

  if(statusData.locked){

    alert(
      "Transaction PIN is locked until " +
      new Date(statusData.lockedUntil).toLocaleString()
    );

    return null;
  }

  const pin = await requestMaskedTransactionPin(
    "Enter your Transaction PIN to " +
    operationName.toLowerCase() + ":"
  );

  if(pin === null){
    return null;
  }

  if(!/^\d{4,6}$/.test(pin)){

    alert("PIN must contain 4 to 6 digits.");

    return null;
  }

  try{

    const res = await fetch(
      API + "/wallet/security/verify-pin",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          walletId,
          network:currentNetwork,
          pin
        })
      }
    );

    const data = await res.json();

    if(!res.ok || !data.success || !data.authorizationToken){

      alert(
        data.message ||
        "Transaction PIN verification failed."
      );

      await loadSecurityStatus();

      return null;
    }

    transactionAuthorizationToken =
      data.authorizationToken;

    transactionAuthorizationExpiresAt =
      data.expiresAt
        ? new Date(data.expiresAt).getTime()
        : Date.now() + (5 * 60 * 1000);

    return transactionAuthorizationToken;

  }catch(err){

    console.error(
      "Transaction PIN verification error:",
      err
    );

    alert(
      "Unable to verify Transaction PIN."
    );

    return null;
  }
}

// ================= SWAP PREVIEW =================
async function calculateSwapPreview() {

  const amount = Number(document.getElementById("swapAmount").value);
  const type = document.getElementById("swapType").value;
  const resultDiv = document.getElementById("swapResult");

  if (!amount || amount <= 0) {
    resultDiv.innerHTML = "";
    return;
  }

  let fromCurrency, toCurrency;

  if (type === "piToFiat") {
    fromCurrency = "PI";
    toCurrency = document.getElementById("currencySelect").value;
  } else {
    fromCurrency = document.getElementById("currencySelect").value;
    toCurrency = "PI";
  }

  try {

    const res = await fetch(API + "/wallet/swap-preview", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        fromCurrency,
        toCurrency,
        amount
      })
    });

    const data = await res.json();

    if (!data.success) {
      resultDiv.innerHTML = data.message;
      return;
    }

    const symbol = {
      PI: "π",
      NG: "₦",
      USD: "$",
      GH: "₵",
      KE: "KSh",
      ZA: "R"
    };

    const fromSymbol = symbol[fromCurrency] || "";
    const toSymbol = symbol[toCurrency] || "";

    let receiveDisplay;

    if (toCurrency === "PI") {

      receiveDisplay =
        Number(data.receivedAmount ?? data.received)
          .toFixed(8) + " π";

    } else {

      receiveDisplay =
        toSymbol +
        Number(data.receivedAmount ?? data.received)
          .toLocaleString(undefined, {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
          });

    }

    resultDiv.innerHTML = `
<b>Preview:</b><br>

You send:
${fromCurrency === "PI"
    ? amount + " π"
    : fromSymbol +
      Number(amount).toLocaleString(undefined,{
        minimumFractionDigits:2,
        maximumFractionDigits:2
      })
}<br><br>

Swap Fee:
${fromCurrency === "PI"
    ? Number(data.fee).toFixed(8) + " π"
    : fromSymbol +
      Number(data.fee).toLocaleString(undefined,{
        minimumFractionDigits:2,
        maximumFractionDigits:2
      })
}<br>

Gas Fee:
$${Number(data.gasUSD ?? 0.2).toLocaleString(undefined,{
  minimumFractionDigits:2,
  maximumFractionDigits:2
})}<br><br>

<b>You receive:
${receiveDisplay}
</b>
`;

  } catch (err) {

    console.error(err);
    resultDiv.innerHTML = "Unable to load preview.";

  }

}

// ================= SWAP =================
async function performSwap(){

  console.log("🚀 performSwap started");

  const amount = Number(document.getElementById("swapAmount").value);
  const type = document.getElementById("swapType").value;
  const resultDiv = document.getElementById("swapResult");

  if(!amount || amount <= 0){
    resultDiv.textContent = "Enter valid amount";
    return;
  }

  // ================= LOAD WALLET =================
  const resWallet = await fetch(
    API +
    "/wallet/" +
    walletId +
    "?network=" +
    currentNetwork
  );

  const wallet = await resWallet.json();

  // ================= DAILY CACHE =================
  let today = new Date().toLocaleDateString();
  let swapData =
    JSON.parse(localStorage.getItem("swapHistory")) || {};

  if(!swapData[today]) swapData[today] = 0;

  // ================= DETERMINE PAIR =================
  let fromCurrency, toCurrency;

  if(type === "piToFiat"){

    fromCurrency = "PI";
    toCurrency =
      document.getElementById("currencySelect").value;

  }else{

    fromCurrency =
      document.getElementById("currencySelect").value;
    toCurrency = "PI";

  }

  // ================= TRANSACTION PIN =================
  const authorizationToken =
    await requestTransactionAuthorization("perform this swap");

  if(!authorizationToken){
    return;
  }

  // ================= CALL BACKEND =================
  let res;

  try{

    res = await fetch(
      API + "/wallet/swap",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          walletId,
          fromCurrency,
          toCurrency,
          amount,
          network:currentNetwork,
          authorizationToken
        })
      }
    );

  }catch(err){

    clearTransactionAuthorization();

    console.error(
      "Swap request failed:",
      err
    );

    resultDiv.textContent =
      "Unable to complete swap.";

    return;
  }

  const data = await res.json();

  // Authorization tokens are one-time credentials.
  clearTransactionAuthorization();

  if(!data.success){
    resultDiv.textContent = data.message;
    return;
  }

  // ================= SYMBOLS =================
  const symbol = {
    PI:"π",
    USD:"$",
    NG:"₦",
    GH:"₵",
    KE:"KSh",
    ZA:"R"
  };

  const receiveSymbol =
    symbol[toCurrency] || "";

  const feeSymbol =
    symbol[fromCurrency] || "";

  // ================= SUCCESS =================
  resultDiv.innerHTML = `
  ✅ Swap successful<br><br>

  Received:
  ${receiveSymbol}${Number(data.receivedAmount).toLocaleString(undefined,{
    minimumFractionDigits:2,
    maximumFractionDigits:8
  })}<br>

  Fee:
  ${feeSymbol}${Number(data.fee).toLocaleString(undefined,{
    minimumFractionDigits:2,
    maximumFractionDigits:8
  })}<br>

  Gas Fee:
  $${Number(data.gasFee ?? data.gasUSD ?? 0.2).toLocaleString(undefined,{
    minimumFractionDigits:2,
    maximumFractionDigits:2
  })}
  `;

  // ================= REFRESH =================
  await updateWalletDisplay();
  loadSwapHistory();

}

// ================= HISTORY =================
async function loadSwapHistory(){

  console.log("loadSwapHistory()", {
    walletId:
      localStorage.getItem(
        "walletId_" + currentNetwork
      ),
    currentNetwork
  });

  const walletId =
    localStorage.getItem(
      "walletId_" + currentNetwork
    );

  if(!walletId){
    return;
  }

  const container =
    document.getElementById("swapHistory");

  try{

    const res = await fetch(
      API +
      "/transactions/" +
      encodeURIComponent(walletId) +
      "?network=" +
      encodeURIComponent(currentNetwork)
    );

    const txs = await res.json();

    if(!res.ok || !Array.isArray(txs)){

      container.innerHTML =
        "<p>Unable to load transaction history.</p>";

      return;
    }

    if(txs.length === 0){

      container.innerHTML =
        "<p>No transactions recorded yet.</p>";

      return;
    }

    function escapeHtml(value){

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }

    function symbol(currency){

      const symbols = {
        PI:"π",
        USD:"$",
        NG:"₦",
        GH:"₵",
        KE:"KSh",
        ZA:"R",
        EG:"E£",
        CM:"FCFA",
        UG:"USh",
        TZ:"TSh",
        ET:"Br",
        RW:"FRw",
        SN:"FCFA",
        CI:"FCFA",
        DZ:"DZD",
        MA:"MAD",
        AO:"Kz",
        ZM:"ZK",
        ZW:"ZWL",
        MW:"MK",
        BW:"P",
        NA:"N$",
        SL:"Le",
        LR:"L$",
        TG:"FCFA",
        BJ:"FCFA",
        NE:"FCFA",
        ML:"FCFA",
        BF:"FCFA",
        GA:"FCFA",
        CG:"FCFA",
        CD:"CDF"
      };

      return symbols[currency] || "";

    }

    function decimals(currency){

      return currency === "PI" ? 8 : 2;

    }

    function formatMoney(value, currency){

      const number = Number(value ?? 0);

      if(!Number.isFinite(number)){
        return symbol(currency) + "0";
      }

      return (
        symbol(currency) +
        number.toLocaleString(undefined,{
          minimumFractionDigits: decimals(currency),
          maximumFractionDigits: decimals(currency)
        })
      );

    }

    function transactionTitle(tx){

      const type =
        String(tx.type || "transaction")
          .replace(/_/g," ")
          .replace(/\b\w/g,c => c.toUpperCase());

      if(
        tx.from_currency &&
        tx.to_currency
      ){

        return (
          escapeHtml(type) +
          ": " +
          escapeHtml(tx.from_currency) +
          " → " +
          escapeHtml(tx.to_currency)
        );

      }

      return escapeHtml(type);

    }

    container.innerHTML = txs.map(tx => {

      const type =
        String(tx.type || "").toLowerCase();

      const amountCurrency =
        tx.from_currency ||
        tx.currency ||
        "";

      const receiveCurrency =
        tx.to_currency ||
        tx.currency ||
        "";

      const amount =
        formatMoney(
          tx.amount,
          amountCurrency
        );

      const received =
        formatMoney(
          tx.received,
          receiveCurrency
        );

      const fee =
        formatMoney(
          tx.fee,
          amountCurrency
        );

      const gas =
        Number(tx.gas ?? 0);

      const gasDisplay =
        Number.isFinite(gas)
          ? "$" +
            gas.toLocaleString(undefined,{
              minimumFractionDigits:2,
              maximumFractionDigits:2
            })
          : "$0.00";

      const created =
        tx.created_at
          ? new Date(tx.created_at).toLocaleString()
          : "Unknown date";

      let details = "";

      if(type === "swap"){

        details = `
          <br>Amount: ${amount}
          <br>Received: ${received}
          <br>Fee: ${fee}
          <br>Gas: ${gasDisplay}
        `;

      }else if(type === "withdrawal"){

        details = `
          <br>Amount: ${amount}
          <br>Received: ${received}
          <br>Fee: ${fee}
        `;

      }else if(type === "transfer"){

        details = `
          <br>Amount: ${amount}
          <br>Fee: ${fee}
          <br>Gas: ${gasDisplay}
        `;

      }else{

        details = `
          <br>Amount: ${amount}
          <br>Fee: ${fee}
        `;

        if(Number(tx.received ?? 0) !== 0){
          details +=
            `<br>Received: ${received}`;
        }

      }

      return `
        <div
          style="
            padding:12px;
            margin:8px 0;
            border:1px solid #333;
            border-radius:10px;
          "
        >
          <b>${transactionTitle(tx)}</b>
          ${details}
          <br>
          <small>
            Network: ${escapeHtml(tx.network || currentNetwork)}
          </small>
          <br>
          <small>
            ${escapeHtml(created)}
          </small>
          ${
            tx.tx_id
              ? `<br><small>TX: ${escapeHtml(tx.tx_id)}</small>`
              : ""
          }
          ${
            (tx.tx_id || tx.transaction_id || tx.order_id)
              ? `<br><button
                   type="button"
                   style="margin-top:10px;padding:9px 14px;border-radius:8px;cursor:pointer;"
                   data-transaction-id="${escapeHtml(tx.tx_id || tx.transaction_id || "")}"
                   data-order-id="${escapeHtml(tx.order_id || "")}"
                   onclick="downloadReceipt({
                     transactionId: this.dataset.transactionId || null,
                     orderId: this.dataset.orderId || null,
                     username: localStorage.getItem('username')
                   })"
                 >Download Receipt</button>`
              : ""
          }
        </div>
      `;

    }).join("");

  }catch(err){

    console.error(
      "Transaction history error:",
      err
    );

    container.innerHTML =
      "<p>Unable to load transaction history.</p>";

  }
}

// WITHDRAW Fiat
async function requestWithdrawal(){

  const amount =
    Number(
      document.getElementById(
        "withdrawAmount"
      ).value
    );

  const currency =
    document.getElementById(
      "withdrawCurrency"
    ).value;

  const method =
    document.getElementById(
      "withdrawMethod"
    ).value;

  const bankName =
    document.getElementById(
      "bankName"
    ).value.trim();

  const accountNumber =
    document.getElementById(
      "accountNumber"
    ).value.trim();

  const accountName =
    document.getElementById(
      "accountName"
    ).value.trim();

  const withdrawDetails =
    document.getElementById(
      "withdrawDetails"
    ).value.trim();

  if(!Number.isFinite(amount) || amount <= 0){

    return alert(
      "Enter a valid withdrawal amount."
    );

  }

  let details = {};

  if(method === "bank"){

    if(!bankName || !accountNumber || !accountName){

      return alert(
        "Fill in bank name, account number and account name."
      );

    }

    details = {
      bankName,
      accountNumber,
      accountName
    };

  }else{

    if(!withdrawDetails){

      return alert(
        "Enter the destination crypto/Pi wallet address."
      );

    }

    details = {
      cryptoAddress: withdrawDetails
    };

  }

  const currentWalletId =
    localStorage.getItem(
      "walletId_" + currentNetwork
    );

  if(!currentWalletId){

    return alert(
      "Wallet not initialized."
    );

  }

  const authorizationToken =
    await requestTransactionAuthorization(
      "request this withdrawal"
    );

  if(!authorizationToken){
    return;
  }

  try{

    const res = await fetch(
      API + "/wallet/withdraw",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          walletId: currentWalletId,
          network: currentNetwork,
          amount,
          currency,
          method,
          details,
          authorizationToken
        })
      }
    );

    const data = await res.json();

    clearTransactionAuthorization();

    alert(
      data.message ||
      (
        data.success
          ? "Withdrawal request submitted."
          : "Withdrawal failed."
      )
    );

    if(data.success){

      await loadBalance();
      await updateWalletDisplay();
      await loadSwapHistory();
      await loadWithdrawals();

    }

  }catch(err){

    clearTransactionAuthorization();

    console.error(
      "Withdrawal request error:",
      err
    );

    alert(
      "Unable to submit withdrawal."
    );

  }
}

// WITHDRAWAL HISTORY 
async function loadWithdrawals(){

  console.log("loadWithdrawals()", {
    walletId:
      localStorage.getItem(
        "walletId_" + currentNetwork
      ),
    currentNetwork
  });

  const walletId =
    localStorage.getItem(
      "walletId_" + currentNetwork
    );

  if(!walletId){
    return;
  }

  try{

    const res = await fetch(
      API +
      "/withdrawals?network=" +
      encodeURIComponent(currentNetwork)
    );

    const data = await res.json();

    if(!res.ok || !Array.isArray(data)){

      document.getElementById(
        "withdrawHistory"
      ).innerHTML =
        "<p>Unable to load withdrawal history.</p>";

      return;
    }

    const userData =
      data.filter(
        w => w.wallet_id === walletId
      );

    if(userData.length === 0){

      document.getElementById(
        "withdrawHistory"
      ).innerHTML =
        "<p>No withdrawal requests yet.</p>";

      return;
    }

    function escapeHtml(value){

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }

    function symbol(currency){

      return currency === "PI"
        ? "π"
        : currency === "USD"
          ? "$"
          : currency === "NG"
            ? "₦"
            : "";

    }

    document.getElementById(
      "withdrawHistory"
    ).innerHTML = userData.map(w => {

      const currency =
        w.currency || "NG";

      const amount =
        Number(w.amount ?? 0);

      const amountDisplay =
        Number.isFinite(amount)
          ? symbol(currency) +
            amount.toLocaleString(undefined,{
              minimumFractionDigits:
                currency === "PI" ? 6 : 2,
              maximumFractionDigits:
                currency === "PI" ? 8 : 2
            })
          : symbol(currency) + "0";

      const created =
        w.created_at
          ? new Date(w.created_at).toLocaleString()
          : "Unknown date";

      const destination =
        w.method === "bank"
          ? (
              "Bank: " +
              escapeHtml(w.bank_name || "") +
              "<br>Account: " +
              escapeHtml(w.account_number || "")
            )
          : (
              "Crypto/Pi address: " +
              escapeHtml(w.crypto_address || "")
            );

      return `
        <div
          style="
            padding:12px;
            margin:8px 0;
            border:1px solid #333;
            border-radius:10px;
          "
        >
          <b>💸 Withdrawal</b>
          <br>
          Amount: ${amountDisplay}
          <br>
          Method: ${escapeHtml(w.method || "")}
          <br>
          ${destination}
          <br>
          Status: ${escapeHtml(w.status || "unknown")}
          <br>
          <small>${escapeHtml(created)}</small>
        </div>
      `;

    }).join("");

  }catch(err){

    console.error(
      "Withdrawal history error:",
      err
    );

    document.getElementById(
      "withdrawHistory"
    ).innerHTML =
      "<p>Unable to load withdrawal history.</p>";

  }
}
