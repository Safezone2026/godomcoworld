let piAccessToken = null;
let piAuthenticatedUser = null;
let piSdkReady = false;

function initPiSDK() {

  if (piSdkReady) {
    return true;
  }

  if (typeof Pi === "undefined") {
    console.error("❌ Pi SDK is not available");
    alert(
      "Pi payments must be opened inside the Pi Browser."
    );
    return false;
  }

  try {

    Pi.init({
      version: "2.0",
      sandbox: true
    });

    piSdkReady = true;

    console.log("✅ Pi SDK initialized in sandbox mode");

    return true;

  } catch (err) {

    console.error("❌ Pi SDK initialization failed:", err);

    alert("Unable to initialize Pi payments.");

    return false;
  }
}


async function authenticatePi() {

  if (!initPiSDK()) {
    return false;
  }

  if (piAccessToken && piAuthenticatedUser) {
    return true;
  }

  try {

    const auth = await Pi.authenticate(
      ["username", "payments"],
      async function onIncompletePaymentFound(payment) {

        console.log(
          "⚠️ Incomplete Pi payment found:",
          payment
        );

        try {

          if (
            payment &&
            payment.identifier &&
            payment.transaction &&
            payment.transaction.txid
          ) {

            const response = await fetch(
              API + "/pi/payment/complete",
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json"
                },
                body: JSON.stringify({
                  paymentId: payment.identifier,
                  txid: payment.transaction.txid,
                  accessToken: piAccessToken
                })
              }
            );

            const data = await response.json();

            console.log(
              "📥 Incomplete payment recovery:",
              data
            );

            if (data.success) {
              await loadBalance();
            }

          }

        } catch (err) {

          console.error(
            "❌ Incomplete payment recovery failed:",
            err
          );
        }
      }
    );

    piAccessToken = auth.accessToken;
    piAuthenticatedUser = auth.user;

    console.log("✅ Pi authentication successful:", {
      username: auth.user?.username,
      uid: auth.user?.uid
    });

    return true;

  } catch (err) {

    console.error("❌ Pi authentication failed:", err);

    alert(
      "Pi authentication failed. Please try again inside Pi Browser."
    );

    return false;
  }
}


async function depositPi() {

  if (currentNetwork !== "testnet") {

    alert(
      "Real Test-Pi deposits are currently enabled only for the Testnet wallet."
    );

    return;
  }

  const authenticated = await authenticatePi();

  if (!authenticated) {
    return;
  }

  const amountText = prompt(
    "Enter the amount of Test-Pi to deposit:"
  );

  if (amountText === null) {
    return;
  }

  const amount = Number(amountText);

  if (!Number.isFinite(amount) || amount <= 0) {

    alert("Please enter a valid Pi amount.");

    return;
  }

  if (!walletId) {

    alert("Wallet not found. Please initialize your wallet first.");

    return;
  }

  console.log("📤 Creating REAL Pi Testnet payment:", {
    amount,
    walletId,
    network: currentNetwork
  });

  try {

    const payment = await Pi.createPayment(
      {
        amount: amount,

        memo:
          "Godomcoworld Test-Pi wallet deposit",

        metadata: {
          walletId: walletId,
          network: currentNetwork
        }
      },

      {
        onReadyForServerApproval: async function(paymentId) {

          console.log(
            "🔐 Pi payment ready for server approval:",
            paymentId
          );

          try {

            const response = await fetch(
              API + "/pi/payment/approve",
              {
                method: "POST",

                headers: {
                  "Content-Type": "application/json"
                },

                body: JSON.stringify({
                  paymentId: paymentId,
                  accessToken: piAccessToken,
                  walletId: walletId,
                  network: currentNetwork
                })
              }
            );

            const data = await response.json();

            console.log(
              "📥 Pi approval response:",
              data
            );

            if (!response.ok || !data.success) {

              console.error(
                "❌ Pi server approval failed:",
                data
              );

              alert(
                data.message ||
                "Pi payment approval failed."
              );
            }

          } catch (err) {

            console.error(
              "❌ Pi approval request failed:",
              err
            );

            alert(
              "Unable to approve the Pi payment."
            );
          }
        },


        onReadyForServerCompletion:
          async function(paymentId, txid) {

            console.log(
              "🔗 Pi payment ready for completion:",
              {
                paymentId,
                txid
              }
            );

            try {

              const response = await fetch(
                API + "/pi/payment/complete",
                {
                  method: "POST",

                  headers: {
                    "Content-Type": "application/json"
                  },

                  body: JSON.stringify({
                    paymentId: paymentId,
                    txid: txid,
                    accessToken: piAccessToken
                  })
                }
              );

              const data = await response.json();

              console.log(
                "📥 Pi completion response:",
                data
              );

              if (!response.ok || !data.success) {

                alert(
                  data.message ||
                  "Pi payment completion failed."
                );

                return;
              }

              alert(
                "✅ Real Test-Pi deposit completed!\n\n" +
                "Amount: " +
                Number(data.amount).toFixed(6) +
                " π"
              );

              await loadBalance();

            } catch (err) {

              console.error(
                "❌ Pi completion request failed:",
                err
              );

              alert(
                "Pi payment was processed, but wallet confirmation failed. Please refresh your wallet."
              );
            }
          },


        onCancel: function(paymentId) {

          console.log(
            "⚠️ Pi payment cancelled:",
            paymentId
          );

          alert("Pi payment cancelled.");
        },


        onError: function(error, payment) {

          console.error(
            "❌ Pi payment error:",
            error,
            payment
          );

          alert(
            "Pi payment failed. Please try again."
          );
        }
      }
    );

    console.log(
      "✅ Pi.createPayment completed:",
      payment
    );

  } catch (err) {

    console.error(
      "❌ Pi payment creation failed:",
      err
    );

    alert(
      "Unable to create Pi payment. Please try again."
    );
  }
}

// ================= SWAP PREVIEW =================
async function calculateSwapPreview() {

  const amount = Number(document.getElementById("swapAmount").value);
  const type = document.getElementById("swapType").value;
  const resultDiv = document.getElementById("swapResult");

  if (!amount || amount <= 0) {
    resultDiv.innerHTML = "";
    return;
  }

  let fromCurrency, toCurrency;

  if (type === "piToFiat") {
    fromCurrency = "PI";
    toCurrency = document.getElementById("currencySelect").value;
  } else {
    fromCurrency = document.getElementById("currencySelect").value;
    toCurrency = "PI";
  }

  try {

    const res = await fetch(API + "/wallet/swap-preview", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        fromCurrency,
        toCurrency,
        amount
      })
    });

    const data = await res.json();

    if (!data.success) {
      resultDiv.innerHTML = data.message;
      return;
    }

    const symbol = {
      PI: "π",
      NG: "₦",
      USD: "$",
      GH: "₵",
      KE: "KSh",
      ZA: "R"
    };

    const fromSymbol = symbol[fromCurrency] || "";
    const toSymbol = symbol[toCurrency] || "";

    let receiveDisplay;

    if (toCurrency === "PI") {

      receiveDisplay =
        Number(data.receivedAmount ?? data.received)
          .toFixed(8) + " π";

    } else {

      receiveDisplay =
        toSymbol +
        Number(data.receivedAmount ?? data.received)
          .toLocaleString(undefined, {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
          });

    }

    resultDiv.innerHTML = `
<b>Preview:</b><br>

You send:
${fromCurrency === "PI"
    ? amount + " π"
    : fromSymbol +
      Number(amount).toLocaleString(undefined,{
        minimumFractionDigits:2,
        maximumFractionDigits:2
      })
}<br><br>

Swap Fee:
${fromCurrency === "PI"
    ? Number(data.fee).toFixed(8) + " π"
    : fromSymbol +
      Number(data.fee).toLocaleString(undefined,{
        minimumFractionDigits:2,
        maximumFractionDigits:2
      })
}<br>

Gas Fee:
$${Number(data.gasUSD ?? 0.2).toLocaleString(undefined,{
  minimumFractionDigits:2,
  maximumFractionDigits:2
})}<br><br>

<b>You receive:
${receiveDisplay}
</b>
`;

  } catch (err) {

    console.error(err);
    resultDiv.innerHTML = "Unable to load preview.";

  }

}

// ================= SWAP =================
async function performSwap(){

  console.log("🚀 performSwap started");

  const amount = Number(document.getElementById("swapAmount").value);
  const type = document.getElementById("swapType").value;
  const resultDiv = document.getElementById("swapResult");

  if(!amount || amount <= 0){
    resultDiv.textContent = "Enter valid amount";
    return;
  }

  // ================= LOAD WALLET =================
  const resWallet = await fetch(
    API +
    "/wallet/" +
    walletId +
    "?network=" +
    currentNetwork
  );

  const wallet = await resWallet.json();

  // ================= DAILY CACHE =================
  let today = new Date().toLocaleDateString();
  let swapData =
    JSON.parse(localStorage.getItem("swapHistory")) || {};

  if(!swapData[today]) swapData[today] = 0;

  // ================= DETERMINE PAIR =================
  let fromCurrency, toCurrency;

  if(type === "piToFiat"){

    fromCurrency = "PI";
    toCurrency =
      document.getElementById("currencySelect").value;

  }else{

    fromCurrency =
      document.getElementById("currencySelect").value;
    toCurrency = "PI";

  }

  // ================= CALL BACKEND =================
  const res = await fetch(
    API + "/wallet/swap",
    {
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        walletId,
        fromCurrency,
        toCurrency,
        amount,
        network:currentNetwork
      })
    }
  );

  const data = await res.json();

  if(!data.success){
    resultDiv.textContent = data.message;
    return;
  }

  // ================= SYMBOLS =================
  const symbol = {
    PI:"π",
    USD:"$",
    NG:"₦",
    GH:"₵",
    KE:"KSh",
    ZA:"R"
  };

  const receiveSymbol =
    symbol[toCurrency] || "";

  const feeSymbol =
    symbol[fromCurrency] || "";

  // ================= SUCCESS =================
  resultDiv.innerHTML = `
  ✅ Swap successful<br><br>

  Received:
  ${receiveSymbol}${Number(data.receivedAmount).toLocaleString(undefined,{
    minimumFractionDigits:2,
    maximumFractionDigits:8
  })}<br>

  Fee:
  ${feeSymbol}${Number(data.fee).toLocaleString(undefined,{
    minimumFractionDigits:2,
    maximumFractionDigits:8
  })}<br>

  Gas Fee:
  $${Number(data.gasFee ?? data.gasUSD ?? 0.2).toLocaleString(undefined,{
    minimumFractionDigits:2,
    maximumFractionDigits:2
  })}
  `;

  // ================= REFRESH =================
  await updateWalletDisplay();
  loadSwapHistory();

}

    })}<br>

    Fee:
    ${feeSymbol}${Number(t.fee ?? 0).toLocaleString(undefined,{
      minimumFractionDigits: feeDecimals,
      maximumFractionDigits: feeDecimals
    })}<br>

    Gas:
    $${Number(t.gas ?? 0).toLocaleString(undefined,{
      minimumFractionDigits:2,
      maximumFractionDigits:2
    })}<br>

    ${new Date(t.created_at).toLocaleString()}
  </p>
  `;
})
.join("");
}
// WITHDRAW Fiat
async function requestWithdrawal(){

  const amount = Number(document.getElementById("withdrawAmount").value);
  const currency = document.getElementById("withdrawCurrency").value;

  const bankName = document.getElementById("bankName").value;
  const accountNumber = document.getElementById("accountNumber").value;
  const accountName = document.getElementById("accountName").value;

  if(!amount || amount <= 0){
    return alert("Enter valid amount");
  }

  if(currency === "NG"){
    if(!bankName || !accountNumber || !accountName){
      return alert("Fill bank details");
    }
  }

  const walletId =
  localStorage.getItem(
    "walletId_" + currentNetwork
  );

  const res = await fetch(API + "/wallet/withdraw", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
  walletId,
  network: currentNetwork,
  amount,
  currency,
  method: "bank",
  details: {
    bankName,
    accountNumber,
    accountName
  }
})
  });

  const data = await res.json();

  alert(data.message);
}

// WITHDRAWAL HISTORY 
async function loadWithdrawals(){
console.log("loadWithdrawals()", {
  walletId: localStorage.getItem("walletId_" + currentNetwork),
  currentNetwork
});
  const walletId =
  localStorage.getItem(
    "walletId_" + currentNetwork
  );

  const res = await fetch(API + "/withdrawals");
  const data = await res.json();

  const userData = data.filter(w => w.walletId === walletId);

  document.getElementById("withdrawHistory").innerHTML =
    userData.map(w => `
      <p>
💸 ₦${Number(w.amount ?? 0).toLocaleString(undefined,{
  minimumFractionDigits:2,
  maximumFractionDigits:2
})}<br>

Fee: ₦${Number(w.fee ?? 0).toLocaleString(undefined,{
  minimumFractionDigits:2,
  maximumFractionDigits:2
})}<br>

Received: ₦${Number(w.finalAmount ?? 0).toLocaleString(undefined,{
  minimumFractionDigits:2,
  maximumFractionDigits:2
})}<br>

Status: ${w.status}<br>
${new Date(w.date).toLocaleString()}
</p>
    `).join('');
}
// ================= POPULATE COUNTRIES =================
function populateCountries(){
  const select = document.getElementById("currencySelect");

  select.innerHTML = ""; // clear first

  for(let code in countryRates){
    let opt = document.createElement("option");
    opt.value = code;
    opt.textContent = `${code} (${countryRates[code].symbol})`;
    select.appendChild(opt);
  }
}

// ================= INIT =================
window.onload = async function(){

  document.getElementById("walletNetwork").value =
    currentNetwork;

  updateWalletUI();

  await initWallet();

  updateWalletDisplay();

  loadWithdrawals();

  populateCountries();

  loadSwapHistory();
  document.getElementById("swapAmount")
    .addEventListener("input", calculateSwapPreview);

  document.getElementById("swapType")
    .addEventListener("change", calculateSwapPreview);

};
